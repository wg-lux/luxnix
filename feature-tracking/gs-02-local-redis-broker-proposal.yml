proposal:
  id: gs-02-local-redis-broker
  status: implemented_not_deployed
  scope: gs-02
  summary: >-
    Replace gs-02's unreachable external Celery broker at
    redis://172.16.255.14:6380/1 with the lx-annotate module's host-local
    Redis instance on 127.0.0.1:6379/1.

incident_findings:
  hub_transfer_failure_caused_by_redis: true
  registration_failure_cause: >-
    Attempt 21 on 2026-08-28 reached gs-02 through mTLS, but Nginx returned 502
    because lx-annotate was not listening on 127.0.0.1:8117. The web service
    remained stopped after its required lx-annotate-hls-backfill dependency
    rejected Celery dispatch while the loopback Redis transport confirmation
    was false.
  excluded_causes:
    - Hub policy rejection.
    - mTLS failure.
    - Large video upload failure; registration never reached the application.
  migration_state: >-
    lx-annotate-migrate.service completed successfully at 14:00:31 with no
    migrations to apply.

security_decision:
  topology: host_local
  broker_url: redis://localhost:6379/1
  network_exposure: none
  authentication: >-
    No Redis password is required because the broker binds only to loopback and
    the firewall remains closed. It must not be exposed to another node.
  persistence: volatile
  persistence_reason: >-
    gs-02 does not yet have a verified encrypted filesystem boundary for Redis
    persistence. RDB and AOF persistence must therefore be disabled and the
    Redis working directory kept under /run. This avoids writing Celery payloads
    to unencrypted persistent storage.
  accepted_tradeoff: >-
    Queued messages do not survive a Redis or host restart. Database-backed job
    records remain authoritative and must be reconciled after activation or an
    unplanned restart. This is an availability limitation, not permission to
    silently treat pending work as completed.
  prohibited_extensions:
    - Do not bind Redis to 0.0.0.0 or 172.16.255.22.
    - Do not point gc-* or gs-01 at this plaintext Redis endpoint.
    - Do not set secureTransportConfirmed=true for node-to-node redis:// traffic.
    - Do not enable RDB or AOF persistence outside a verified encrypted mount.

source_change:
  authoritative_file: ansible/inventory/host_vars/gs-02.yml
  generated_files_must_not_be_edited:
    - autoconf/merged_vars/gs-02.yml
    - systems/x86_64-linux/gs-02/default.nix
  add_to_host_services:
    luxnix.lxAnnotateLocal.runtime.externalServices.redisUrl: "null"
    luxnix.lxAnnotateLocal.runtime.celeryBroker.secureTransportConfirmed: "lib.mkForce true"
    'redis.servers."lx-annotate".appendOnly': "lib.mkForce false"
    'redis.servers."lx-annotate".save': "lib.mkForce [ ]"
    'redis.servers."lx-annotate".settings.dir': 'lib.mkForce "/run/redis-lx-annotate"'

large_video_http_transport:
  implementation_files:
    - modules/nixos/services/lx-annotate-local/options.nix
    - modules/nixos/services/lx-annotate-local/config.nix
  max_upload_bytes: 53687091200
  nginx_timeout_seconds: 21600
  nginx_contract:
    - Use HTTP/1.1 for the upstream Django connection.
    - Stream request bodies with proxy_request_buffering disabled.
    - Disable response buffering for transfer responses.
    - Apply the typed upload-size limit at the dedicated transfer location.
    - Apply the typed timeout to client-body, upstream-read, upstream-write, and response-send inactivity.
    - Preserve Nginx client-certificate verification and replace any incoming mTLS attestation header.

expected_evaluation:
  celery_broker_url: redis://localhost:6379/1
  celery_broker_secure_transport_confirmed: true
  redis_unit: redis-lx-annotate.service
  redis_bind: 127.0.0.1
  redis_port: 6379
  firewall_open: false
  append_only: false
  snapshot_schedule: []
  data_directory: /run/redis-lx-annotate
  worker_ordering:
    after: redis-lx-annotate.service
    wants: redis-lx-annotate.service

preflight:
  repository:
    - git status --short
    - git rev-parse HEAD
    - git rev-parse HEAD:flake.lock
  generate:
    - devenv tasks run autoconf:check
    - devenv tasks run autoconf:generate
  evaluate:
    - nix eval '.#nixosConfigurations.gs-02.config.services.luxnix.lxAnnotateLocal.runtime.externalServices.redisUrl'
    - nix eval '.#nixosConfigurations.gs-02.config.services.redis.servers."lx-annotate"'
    - nix eval '.#nixosConfigurations.gs-02.config.systemd.services.redis-lx-annotate.after'
    - nix build '.#nixosConfigurations.gs-02.config.system.build.toplevel' --no-link
  review_requirements:
    - Confirm the generated diff is limited to the intended gs-02 broker topology.
    - Confirm no unrelated dirty changes are included in the deployment source.
    - Record the LuxNix revision, flake.lock revision, target host, and built closure.

activation:
  authorization: explicit_operator_approval_required
  command: sudo nixos-rebuild switch --flake .#gs-02
  notes:
    - >-
      The old s-04 queue is unavailable and is not migrated by this change.
      Preserve database job state and reconcile incomplete jobs after activation.
    - >-
      Do not mark jobs completed merely because the new broker is empty.

acceptance:
  commands:
    - sudo systemctl is-active redis-lx-annotate.service
    - redis-cli -h 127.0.0.1 -p 6379 PING
    - sudo grep '^CELERY_BROKER_URL=' /var/lib/lx-annotate/.env.systemd
    - sudo grep '^CELERY_BROKER_SECURE_TRANSPORT_CONFIRMED=' /var/lib/lx-annotate/.env.systemd
    - sudo systemctl show lx-annotate.service -p Environment
    - sudo systemctl status 'lx-annotate-celery-*.service' --no-pager
    - sudo journalctl --namespace=lx-annotate --since '-10 minutes' --no-pager
    - sudo ss -ltnp 'sport = :6379'
  required_results:
    - redis-cli returns PONG.
    - CELERY_BROKER_URL is redis://localhost:6379/1.
    - CELERY_BROKER_SECURE_TRANSPORT_CONFIRMED is true because the plaintext broker is loopback-only.
    - Redis listens only on 127.0.0.1:6379.
    - All enabled gs-02 Celery workers connect without retry loops.
    - Redis reports appendonly=no and no configured save schedule.
    - Pending database jobs are explicitly reconciled; ambiguous jobs are preserved or marked LOST where supported.

implementation_verification:
  passed:
    - Autoconf input validation.
    - Autoconf generation of systems/x86_64-linux/gs-02/default.nix.
    - Focused gs-02 Redis and large-transfer Nix evaluation contract.
    - Nix formatting checks for all changed Nix files.
    - Application hub-export worker and wheel-deployment tests: 37 passed.
    - Application Ruff checks for the timeout implementation.
    - Repository diff whitespace checks.
  blocked:
    check: nix build '.#nixosConfigurations.gs-02.config.system.build.toplevel' --no-link
    reason: >-
      The full host build exhausted the local encrypted root filesystem while
      fetching the unrelated Triton/CUDA closure. The Redis, Nginx,
      runtime-environment, and Celery unit derivations had already built.
    disk_state: /dev/mapper/cryptroot had approximately 2.7 GiB available and reported 100 percent use.
    required_action: >-
      Review and authorize recoverable Nix-store cleanup or provide additional
      build space, then rerun the full gs-02 build before deployment.

rollback:
  method: switch_to_previous_reviewed_nixos_generation
  caution: >-
    Rolling back restores the unreachable s-04 broker URL. It does not recover
    messages formerly held by s-04 or messages lost from the volatile local
    broker.
  verification:
    - Confirm the active system generation and service environment after rollback.
    - Preserve database job records and logs for manual reconciliation.

durable_follow_up:
  prerequisite: >-
    Provision and verify a LUKS/dm-crypt-backed filesystem on gs-02, with its
    key remaining local or delivered through the existing Vault-managed
    encrypted-data contract.
  change_after_prerequisite:
    - Move the Redis data directory inside the verified encrypted mount.
    - Re-enable appendOnly=true and appendFsync=everysec.
    - Order redis-lx-annotate.service after and require the encrypted mount unit.
    - Add a Nix assertion preventing persistent central-hub Redis on an unverified storage boundary.
  excluded: >-
    A shared multi-host broker requires rediss://, broker authentication,
    certificate lifecycle management, and scoped firewall rules. That is a
    separate design and is not implied by this local recovery proposal.
