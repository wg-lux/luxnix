schema_version: 1
title: LX-Annotate configuration ownership investigation
date: '2026-10-05'
assessed_by: codex-nix-quality-20261005
scope:
  kind: Local source and scoped module evaluation, with separately attributed runtime evidence received
    through tracker messages
  changed_files:
  - docs/guides/lx-annotate-configuration-ownership-audit.yml
  configuration_changes: false
  deployment_performed: false
  limitations:
  - The current working tree includes unrelated staged and unstaged changes.
  - No full flake check, system build, secret inspection, or live-host startup test was performed for
    this investigation.
  - Runtime diagnostics below are reported by codex-gc02-import-diagnostics-20261005; this agent did not
    repeat live-host checks or verify individual job records.
reported_symptom:
  claim: Duplicated attrname luxnix in lx-annotate-local/config.nix may indicate central configuration
    is being redefined.
  current_tree_result: 'Not reproduced: Nix parsing and Statix both exit 0.'
  explanation: services.luxnix and top-level luxnix are distinct option namespaces. Definitions of the
    same option across NixOS modules are merged by priority; a duplicate attribute within one Nix expression
    is a separate parse error.
  locations:
  - modules/nixos/services/lx-annotate-local/config.nix:2356
  - modules/nixos/services/lx-annotate-local/config.nix:2551
  conclusion: The namespace spelling alone does not establish an ownership bug. Scoped evaluations independently
    establish the issues below.
findings:
- id: local-database-classified-as-external
  priority: high
  status: Confirmed dependency selection in the evaluated gs-02 configuration; database management intent
    and live impact require verification
  problem: 'externalPostgresConfigured infers database management from a non-null externalServices.postgresHost.
    Endpoint locality does not establish ownership: loopback can be externally managed.'
  evidence:
  - gs-02 selects 127.0.0.1:5432, enables local PostgreSQL, and defines postgres-endoreg-setup.
  - Its runtime environment and migration units omit postgres-endoreg-setup.service and postgresql.service
    from their after lists.
  - The local dependency lists are also consumed by the web, preflight, master-key, and streamable-migration
    units.
  - Fresh gc-02 evaluation preserves localhost:5432/endoregDbLocal and web ordering after postgresql.service
    and postgres-endoreg-setup.service; the gs-02 dependency-selection finding must not be attributed
    to gc-02.
  sources:
  - modules/nixos/services/lx-annotate-local/config.nix:533
  - modules/nixos/services/lx-annotate-local/config.nix:1379
  - modules/nixos/services/lx-annotate-local/subservices/lx-annotate-runtime-env.nix:16
  - ansible/inventory/host_vars/gs-02.yml:54
  impact: If gs-02 expects LuxNix-managed PostgreSQL and credentials, the omitted dependencies create
    a boot-time ordering risk. An externally managed loopback database may legitimately omit them. Neither
    this evaluation nor the gc-02 diagnostics establishes a gs-02 database outage.
  recommendation: Declare database management explicitly, independently of address. Test locally managed
    PostgreSQL, externally managed loopback, and remote endpoints separately; derive provisioning, credential
    handling, and service dependencies from ownership without forcing all loopback connections into local
    management.
- id: hostname-default-conflicts-with-profile
  priority: high
  status: confirmed by failing scoped evaluation
  problem: The service writes hub.enable with mkDefault based on the gs-02 hostname while the central-hub
    profile writes mkDefault true.
  evidence:
  - 'Enabling profiles.endoregCentralHub on a renamed gc-10 configuration fails with conflicting hub.enable
    values: profile true, service false.'
  - options/hub.nix separately repeats the gs-02 hostname rule as the option default.
  - Current gs-02 and s-04 inventory explicitly set hub.enable, masking this conflict for those hosts.
  sources:
  - modules/nixos/services/lx-annotate-local/config.nix:2359
  - modules/nixos/services/lx-annotate-local/options/hub.nix:23
  - modules/nixos/profiles/endoreg-central-hub/default.nix:48
  - ansible/inventory/group_vars/endoreg_central_hub.yml:21
  impact: A reusable profile fails when applied to another hostname without an additional explicit hub
    setting.
  recommendation: Keep machine selection in canonical inventory and profile defaults. Remove the service-level
    hostname mkDefault; use a neutral service option default while retaining explicit hub declarations
    for existing hosts.
- id: multiple-database-endpoint-authorities
  priority: medium
  status: confirmed; precedence is intentional in existing clustered tests
  problem: roles.endoreg-client.database flows into the service, but runtime.externalServices.postgresHost
    and postgresPort independently override service database fields with mkForce.
  evidence:
  - A scoped override sets the role host to role-db.audit.invalid and the external endpoint to external-db.audit.invalid:6543;
    the effective service endpoint becomes the external one.
  - The role still reports its other endpoint. No consistency error is raised.
  - The existing clusteredShared test expects the external endpoint to win, so removing this override
    without migration would change supported behavior.
  sources:
  - modules/nixos/roles/endoreg-client/lx-annotate.nix:990
  - modules/nixos/services/lx-annotate-local/config.nix:2418
  - modules/nixos/services/lx-annotate-local/scripts/env.nix:116
  - tests/lx-annotate/test_lx_annotate_nix_eval_contract.py:2150
  impact: Operators can edit the central role endpoint while the running application continues using a
    different endpoint.
  recommendation: Choose one canonical connection endpoint and document its owner. Retain compatibility
    aliases with explicit conflict detection during migration instead of silently resolving inconsistent
    input with mkForce.
- id: local-postgres-enabled-despite-external-default
  priority: medium
  status: confirmed in gs-01 and s-04 configurations
  problem: The service tries to disable local PostgreSQL with mkDefault false when an external endpoint
    exists, but fleet inventory explicitly sets generic-settings.postgres.enable true.
  evidence:
  - The scoped external-endpoint probe retains services.postgresql.enable = true.
  - gs-01 and s-04 use the remote PostgreSQL endpoint and still enable local PostgreSQL and postgres-endoreg-setup.
  - An explicit inventory value has higher priority than the service mkDefault; this is normal module
    merging.
  sources:
  - ansible/inventory/group_vars/all/30-nix.yml:120
  - modules/nixos/services/lx-annotate-local/config.nix:2551
  - modules/nixos/luxnix/generic-settings/default.nix:346
  - modules/nixos/roles/postgres-default/default.nix:250
  impact: The service preference and fleet policy disagree. Local database provisioning continues even
    when this application uses a remote database; other local consumers may still require it.
  recommendation: Audit all PostgreSQL consumers before changing the fleet default. Keep machine-wide
    PostgreSQL enablement in inventory/profiles and application-specific local database ownership in one
    declared contract.
- id: direct-service-and-provisioned-database-diverge
  priority: medium
  status: confirmed by scoped direct-service evaluation; defaults are documented
  problem: Direct service defaults select lxAnnotateLocal on port 5433, while the automatically enabled
    PostgreSQL role provisions endoregDbLocal using its independent defaults.
  evidence:
  - With roles.endoreg-client disabled and the service explicitly enabled, database name/user are lxAnnotateLocal
    and port is 5433.
  - The local PostgreSQL role remains enabled and defaultDbName remains endoregDbLocal.
  - The central-hub profile also defaults application name/user to endoregDbCentral without changing roles.postgres.default.defaultDbName.
  - docs/database-ownership.md documents the direct-service default difference but does not make automatic
    local provisioning consistent.
  - The 5433/lxAnnotateLocal result belongs to the hypothetical direct-service probe. Current gc-02 evaluates
    to localhost:5432/endoregDbLocal, matching reported runtime metadata; do not change that working contract.
  sources:
  - modules/nixos/services/lx-annotate-local/options/database.nix:12
  - modules/nixos/roles/endoreg-client/database.nix:17
  - modules/nixos/roles/postgres-default/default.nix:228
  - modules/nixos/roles/postgres-default/default.nix:313
  - modules/nixos/profiles/endoreg-central-hub/default.nix:38
  - docs/database-ownership.md
  impact: Direct activation does not establish a matching local application database contract; local central-hub
    provisioning also needs explicit alignment.
  recommendation: For locally managed deployments, derive provisioned database name, user, port, and credential
    ownership from the canonical application database contract, or reject unsupported combinations with
    clear assertions.
healthy_patterns:
- Service-owned options may legitimately have defaults and derived mkDefault assignments; moving all defaults
  into inventory would remove reusable behavior.
- Vault secret-path defaults derive from the configured Vault client options; this inspection does not
  establish duplicate secret ownership.
- File mover paths derive from the protected runtime root and use mkDefault, allowing deliberate host
  overrides.
- Matching baseline gc-10 role and service database values show that the normal EndoReg client path is
  coherent.
recommended_sequence:
- Add scoped regression coverage for managed local, externally managed loopback, remote database, renamed
  hub, direct-service provisioning, and gc-02 enabled/disabled LLM gating.
- Remove hostname policy from the reusable service while preserving explicit canonical YAML hub assignments.
- Define one database ownership contract and migrate endpoint aliases without changing current host targets.
- Preserve gc-02 database and LLM contracts and distinguish import completion from queue drainage; retain
  storage limits and application runtime fallback.
- Align local provisioning with that contract; audit other PostgreSQL consumers before removing fleet-wide
  enablement.
- Regenerate only intended host outputs through Autoconf; run quality gates and targeted host evaluation
  before operator-controlled deployment.
