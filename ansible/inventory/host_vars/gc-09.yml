# inventory/host_vars/gc-09.yml
---
ansible_python_interpreter: "{{ luxnix_dev_repo }}/.devenv/state/venv/bin/python"
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  custom_packages.baseDevelopment: "true"
  endoreg-client.defaultCenterKey: "university_hospital_wuerzburg"
  endoreg-client.enable: "true"

host_services:
  # LX-Annotate receiver application
  luxnix.lxAnnotateLocal.enable: "true"
  luxnix.lxAnnotateLocal.runtime.deploymentRole: '"central_hub"'
  luxnix.lxAnnotateLocal.hub.enable: "true"

  # Local PostgreSQL and Redis are provided automatically by lxAnnotateLocal.
  luxnix.lxAnnotateLocal.database.port: "5432"

   # Public receiver identity for Nginx, TLS and inter-machine transfers.
  luxnix.lxAnnotateLocal.django.hostname: '"gc-09.intern"'
  # Keep lx-annotate.local valid for local access to gc-09.
  luxnix.lxSsl.extraDnsNames:
    - "gc-09"
    - "lx-annotate.local"

  # Secure hub-transfer receiver through Nginx and mTLS.
  luxnix.lxAnnotateLocal.hub.transferApi.enable: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireSecureTransport: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireMtls: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.mtlsMetaKey: '"HTTP_X_CLIENT_CERT_VERIFIED"'
  luxnix.lxAnnotateLocal.hub.transferApi.mtlsMetaValue: '"SUCCESS"'
  luxnix.lxAnnotateLocal.hub.transferApi.clientCaFile: '"/run/lx-annotate-transfer/client-ca.crt"'
  # Explicit compatibility setting for Django.
  'luxnix.lxAnnotateLocal.django.extraSettings."IS_CENTRAL_NODE"': "lib.mkForce true"

host_nixos:
  nix.settings.max_jobs: 1
  nix.settings.cores: 4
  networking.firewall.allowedTCPPorts: "lib.mkAfter [ 80 443 ]"

extra_secret_names: []

host_luxnix:
  generic_settings.configurationPathRelative: '"lx-production"'
  generic_settings.configurationPath: 'lib.mkForce "/home/admin/lx-production"'

  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'

  generic_settings.linux.cpuMicrocode: '"intel"'
  generic_settings.linux.kernelModules:
    - "kvm-intel"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
  generic_settings.linux.supportedFilesystems:
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []

  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.prime.enable: "true"
  generic_settings.gpu.nvidia.prime.nvidiaBusId: '"PCI:1:0:0"'
  generic_settings.gpu.nvidia.prime.onboardBusId: '"PCI:0:2:0"'
  generic_settings.gpu.nvidia.prime.onboardType: '"intel"'
  generic_settings.gpu.nvidia.driver: '"production"'
