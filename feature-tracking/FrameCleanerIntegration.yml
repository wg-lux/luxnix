schema_version: "1.0"
id: frame_cleaner_integration
name: FrameCleaner deployment integration
description: >-
  Deploy lx-anonymizer FrameCleaner with compatible lx-data-models contracts and
  an attempt-scoped runtime boundary without transferring persistence or
  publication authority away from endoreg-db.
owners:
  - LuxNix maintainers
production_critical: true
source_documents:
  - path: docs/system-feature-tracking.md
    disposition: reference
    note: Defines provider identity, immutable specifications, and deployed resolution.
  - path: modules/nixos/services/lx-annotate-local/Publishing.md
    disposition: reference
    note: Defines coordinated lx-dtypes, lx-anonymizer, and host-package publication.
invariants:
  - One deployed FrameCleaner invocation processes one immutable source into one unpublished attempt-owned candidate.
  - The deployed lx-anonymizer and lx-dtypes versions expose compatible typed video metadata contracts.
  - LuxNix configures runtime dependencies and acceleration but does not own durable attempts, retries, publication, or cleanup.
definition_of_done:
  - id: compatible_packages
    category: requirements
    title: FrameCleaner and its shared contracts are deployed as a compatible set
    acceptance:
      - The selected lx-anonymizer package contains the public FrameCleaner video entry point.
      - The selected lx-dtypes package contains the VideoMeta and frame-analysis contracts consumed by FrameCleaner.
      - Package updates that cross this boundary are pinned and evaluated together before host activation.
    required: true
    verification:
      kind: manual
      instructions: Evaluate the target host closure and inspect the resolved lx-anonymizer and lx-dtypes package versions.
      timeout_seconds: 600
  - id: runtime_capabilities
    category: operations
    title: The host supplies explicit video-processing capabilities
    acceptance:
      - FFmpeg and FFprobe are present in the FrameCleaner runtime environment.
      - Hardware acceleration is enabled only when the target host and packaged backend support it.
      - CPU execution remains an explicit supported deployment profile rather than an accidental fallback.
    required: true
    verification:
      kind: manual
      instructions: Inspect the evaluated service environment and run the packaged FrameCleaner smoke check on the target host.
      timeout_seconds: 600
  - id: ownership_boundary
    category: data_integrity
    title: Deployment preserves attempt ownership and fail-closed publication
    acceptance:
      - Each concurrent attempt constructs a separate FrameCleaner instance.
      - Caller-selected immutable input and attempt-owned candidate paths cross the service boundary unchanged.
      - A failed or cancelled invocation cannot publish a partial candidate as canonical media.
    required: true
    verification:
      kind: manual
      instructions: Review the deployed endoreg-db invocation path against the video import concurrency contract and its focused tests.
      timeout_seconds: 600
