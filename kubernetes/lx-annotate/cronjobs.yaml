apiVersion: batch/v1
kind: CronJob
metadata:
  name: lx-annotate-media-migration
spec:
  schedule: "0 2 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: media-migration
              image: ghcr.io/wg-lux/lx-annotate:0.5.1
              command:
                - /bin/sh
                - -lc
              args:
                - |
                  set -eu

                  marker="${LX_ANNOTATE_BOOTSTRAP_MARKER_DIR:-/var/lib/lx-annotate/data/.bootstrap}/release-${LX_ANNOTATE_RELEASE_ID}.ready"
                  until [ -f "$marker" ]; do
                    echo "waiting for lx-annotate bootstrap marker: $marker"
                    sleep 10
                  done

                  exec python -m django migrate_media_storage \
                    --settings=lx_annotate.settings.settings_prod \
                    --apply \
                    --repeat-until-empty \
                    --include-raw \
                    --include-processed \
                    --include-reports \
                    --include-streamable \
                    --json
              envFrom:
                - configMapRef:
                    name: lx-annotate-config
              env:
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lx-annotate-secret
                      key: DJANGO_SECRET_KEY
                - name: DJANGO_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lx-annotate-secret
                      key: DJANGO_DB_PASSWORD
                - name: OIDC_RP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: lx-annotate-secret
                      key: OIDC_RP_CLIENT_ID
                - name: OIDC_RP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: lx-annotate-secret
                      key: OIDC_RP_CLIENT_SECRET
              volumeMounts:
                - name: data
                  mountPath: /var/lib/lx-annotate/data
                - name: master-key
                  mountPath: /run/secrets/lx-annotate
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lx-annotate-data
            - name: master-key
              secret:
                secretName: lx-annotate-secret
                items:
                  - key: master-key
                    path: master-key
