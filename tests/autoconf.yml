# Canonical map for navigating Autoconf tests and shared test setup.
schema_version: 1
support: tests/autoconf_test_support.py
suites:
  - id: config
    path: tests/test_autoconf_config.py
    scope: Central option schema, path resolution, and validation.
  - id: cli
    path: tests/test_autoconf_cli.py
    scope: Command-line behavior, isolated render protection, and Vault bootstrap argument resolution.
  - id: errors
    path: tests/test_autoconf_errors.py
    scope: Public exception identities and secret-safe source failures.
  - id: imports
    path: tests/test_autoconf_imports.py
    scope: Inventory merging and atomic private intermediate artifacts.
  - id: layout
    path: tests/test_autoconf_layout.py
    scope: Central source, template, and generated-output path objects.
  - id: operations
    path: tests/test_autoconf_operations.py
    scope: Safe fact refresh and private redacted CMDB report generation.
  - id: pipeline
    path: tests/test_autoconf_pipeline.py
    scope: Pipeline dispatch, explicit inputs, logging, and stage signatures.
  - id: rendering
    path: tests/test_autoconf_rendering.py
    scope: Strict deterministic, nixfmt-normalized, atomic, and isolated Nix configuration rendering.
  - id: sources
    path: tests/test_autoconf_sources.py
    scope: Fact snapshots and inventory variable source loading.
  - id: nixos-integration
    path: tests/test_ansible_autoconf_nixos_config.py
    scope: Generated Autoconf data consumed by NixOS configuration.
