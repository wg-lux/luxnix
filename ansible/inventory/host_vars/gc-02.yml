# inventory/host_vars/gc-02.yml
---
luxnix_dev_repo: "/home/admin/dev/luxnix"
template_name: "main"

host_roles:
  custom_packages.videoEditing: "true"
  custom_packages.baseDevelopment: "true"
  custom_packages.visuals: "true"
  custom_packages.hardwareAcceleration: "true"
  endoreg_client.defaultCenterKey: '"university_hospital_wuerzburg"'

host_services:
  # Explicit legacy-default enrollment requested for the 1.3.1 upgrade.
  luxnix.lxAnnotateLocal.django.enrollLegacyDefaultSalt: "true"
  # Reporting needs narrative output; extraction supplies its own JSON prompt/format.
  # Both consumers currently share LLM_MODEL. See docs/guides/gc-02-reporting-llm.yml.
  luxnix.lxAnnotateLocal.runtime.llm.model: '"gemma4:e2b"'
  # Match ReportReader/FrameCleaner LLM_ENABLED gating for automatic queue consumption.
  # The worker's existing Requires/After dependencies start Ollama first.
  luxnix.lxAnnotateLocal.runtime.llmInferenceWorker.mode: 'lib.mkIf config.services.luxnix.lxAnnotateLocal.runtime.llm.enable "always"'
  luxnix.vllm.enable: "false"
  luxnix.vllm.gpuMemoryUtilization: 0.85
  luxnix.vllm.host: '"127.0.0.1"'
  luxnix.vllm.maxModelLen: 8192
  luxnix.vllm.model: '"Qwen/Qwen2.5-1.5B-Instruct"'
  luxnix.vllm.port: 8000
  luxnix.ollama.acceleration: '"cuda"'
  luxnix.ollama.enable: "true"
  luxnix.ollama.enableModelBootstrap: "true"
  luxnix.ollama.models: '[ "gemma4:e2b" ]'
  ollama.host: '"0.0.0.0"'

host_nixos:
  # Daily desktop stalls showed sustained memory pressure without oomd coverage.
  # Recovery can kill a whole session if its applications share one cgroup.
  # Policy and post-activation checks: docs/guides/gc-02-memory-protection.yml
  systemd.oomd.enable: "true"
  systemd.oomd.enableUserSlices: "true"
  systemd.slices.user.sliceConfig.ManagedOOMSwap: '"kill"'
  nix.settings.max_jobs: 1
  nix.settings.cores: 4
  # Prefer compressed RAM to additional disk swap on this nearly full laptop.
  # disks.nix owns the original 20% hardware setting; override it here.
  zramSwap.memoryPercent: "lib.mkForce 50"
  # Aggregate budget for opt-in development jobs, separate from editor scopes.
  systemd.user.slices.luxnix-batch.sliceConfig.MemoryHigh: '"4G"'
  systemd.user.slices.luxnix-batch.sliceConfig.MemoryMax: '"6G"'
  systemd.user.slices.luxnix-batch.sliceConfig.MemorySwapMax: '"2G"'
  systemd.user.slices.luxnix-batch.sliceConfig.CPUWeight: 25
  systemd.user.slices.luxnix-batch.sliceConfig.IOWeight: 25
  environment.systemPackages:
    - >-
      (pkgs.writeShellScriptBin "luxnix-batch" ''
      if [ "$#" -eq 0 ]; then echo 'usage: luxnix-batch <command> [args...]' >&2; exit 64; fi;
      exec ${pkgs.systemd}/bin/systemd-run --user --scope --collect --slice=luxnix-batch.slice -- "$@"
      '')
  # Daemon builds are outside user slices and need their own budget.
  systemd.services.nix-daemon.serviceConfig.MemoryHigh: '"4G"'
  systemd.services.nix-daemon.serviceConfig.MemoryMax: '"6G"'
  systemd.services.nix-daemon.serviceConfig.MemorySwapMax: '"2G"'
  systemd.services.nix-daemon.serviceConfig.CPUWeight: 25
  systemd.services.nix-daemon.serviceConfig.IOWeight: 25
  nixpkgs.config.cudaCapabilities:
    - '"8.6"'

extra_secret_names:
  - "SCRT_roles_system_password_postgres_host_test_password"

host_luxnix:
  # Enrolled sender: enable automatic certificate renewal and fail-closed startup.
  # Restore Vault authentication before activation; see the certificate-expiry
  # recovery procedure in docs/vault-hub-machine-enrollment.md.
  vault.client.auth.deferUntilProvisioned: "false"
  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'

  generic_settings.linux.cpuMicrocode: '"intel"'
  generic_settings.linux.kernelModules:
    - "kvm-intel"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
  generic_settings.linux.supportedFilesystems:
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []

  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.prime.enable: "true"
  generic_settings.gpu.nvidia.prime.nvidiaBusId: '"PCI:1:0:0"'
  generic_settings.gpu.nvidia.prime.onboardBusId: '"PCI:0:2:0"'
  generic_settings.gpu.nvidia.prime.onboardType: '"intel"'
  generic_settings.gpu.nvidia.driver: '"production"'
  maintenance.autoUpdates.enable: "false"
