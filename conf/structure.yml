version: 1
tier: domain
path: conf
parent: ../structure.yml
summary: Canonical rendering templates and controller-side configuration contracts.
responsibilities:
- Own generated NixOS and Home Manager structure
- Pin connectivity configuration and SSH host trust inputs
boundaries:
- Do not patch generated Nix output for template changes
- Do not weaken host identity verification
entrypoints:
- name: migration-loader
  file: migration-loader.nix
  purpose: Build the small UKI around the exact digest of a separately built runtime, without a recursive hash dependency.
- name: migration-payload-loader
  file: migration-load.sh
  purpose: Copy a bounded recovery payload to RAM and authenticate it before mounting or executing it.
- name: migration-environment
  file: migration-environment.nix
  purpose: Build the standalone RAM UKI with signed or console-confirmed boot admission; a host-kexec image offers a root terminal on its screen after a typed phrase; never import target filesystems.
- name: migration-environment-policy
  file: migration-environment.yml
  purpose: Canonical RAM, ESP and recovery SSH limits.
- name: secure-boot-public-certificate
  file: secure-boot/db.pem
  purpose: Public fleet signing certificate; adjacent auth files enroll firmware trust. Private signing keys stay outside the repository.
- name: system-template
  file: nix-templates/systems/x86_64-linux/main/default.nix.j2
  purpose: Inspect system template ownership and interfaces.
- name: home-template
  file: nix-templates/homes/x86_64-linux/default.nix.j2
  purpose: Inspect home template ownership and interfaces.
- name: connectivity
  file: connectivity-ansible.cfg
  purpose: Inspect connectivity ownership and interfaces.
dependencies:
  internal:
  - ansible
  - autoconf
  external:
  - Jinja2
  - SSH
submodules: []
contracts:
- name: readme
  doc: nix-templates/readme.md
tests:
  directory: ../tests
  command: python -m pytest -q tests/test_autoconf_rendering.py tests/test_boot_decryption_renderer.py
