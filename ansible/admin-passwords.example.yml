# Example mapping of admin passwords per inventory host.
#
# Copy this file to `ansible/secrets/admin-passwords.yml`, fill in the
# real passwords, and pass it to the bootstrap script via:
#   devenv run vault-bootstrap -- --admin-passwords ansible/secrets/admin-passwords.yml
#
# DO NOT commit the populated file to version control.
