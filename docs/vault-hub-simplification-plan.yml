schema_version: 1

objective: >-
  Reduce hub machine enrollment to one declarative machine entry, one hub
  reconciliation command, one encrypted bundle transfer, and one site install
  command while keeping unseal keys and machine credentials out of Git, Nix
  store paths, process arguments, environment dumps, and journals.

recommended_direction:
  now: manual_shamir_unseal_with_automated_reconciliation
  later: external_kms_hsm_or_independent_transit_auto_unseal
  reason: >-
    gs-02 currently has no independent key service. Saving its unseal key on
    the same machine would remove the security boundary rather than safely
    automate it.

target_operator_flow:
  - step: 1
    actor: repository_operator
    action: Add or enable one site in the canonical hub-sites YAML file.
  - step: 2
    actor: vault_owner
    action: >-
      If Vault is sealed, run one interactive unseal-and-reconcile command and
      enter the unseal key only at the hidden prompt.
  - step: 3
    actor: vault_owner
    action: Deliver the generated recipient-encrypted enrollment bundle.
  - step: 4
    actor: site_operator
    action: Run one install command, switch the NixOS configuration, and run one readiness command.

security_guardrails:
  - Never store an unseal key, root token, AppRole Secret ID, or node secret in Git or the Nix store.
  - Never pass AppRole values or unseal keys in process arguments.
  - Use hidden stdin prompts, systemd credentials, or root-only mode-0600 temporary files.
  - Use a short-lived scoped administrative token for reconciliation; do not persist a root token.
  - Keep enrollment bundles recipient-encrypted until they are installed on the intended site.
  - Make every command fail closed when Vault is sealed, TLS identity is wrong, or required files are absent.
  - Do not automate unseal by saving the Shamir key on gs-02.
  - Enroll a stable CA trust anchor, never a renewable or self-signed server leaf.
  - Never bypass TLS verification or fetch replacement trust from the unauthenticated Vault endpoint.

live_regression_2026_08_04:
  state: durable_fix_prepared_not_deployed
  affected_site: gc-02
  cause: >-
    gs-02 reused the LX-Annotate self-signed server leaf as Vault's client trust
    anchor. Leaf renewal changed that trust anchor and AppRole TLS verification
    failed closed.
  remediation:
    - Generate one persistent root-only Vault server CA on gs-02.
    - Renew only CA-signed server leaves with vault.endo-reg.net and gs-02.intern SANs.
    - Export the CA and its SHA-256 fingerprint in enrollment bundles.
    - Require authenticated delivery and fingerprint-pinned atomic installation on existing sites.
    - Expose enrollment-pending and tls-trust-failed without creating an empty vault.env.
  deployment_gate:
    - Review and build gs-02 and gc-02 configurations without switching either host.
    - Read the new CA fingerprint directly from trusted gs-02 local state.
    - Transfer the CA over the approved authenticated encrypted channel.
    - Verify the fingerprint on gc-02 before explicitly starting the Vault dependency chain.

implementation_phases:
  - id: P0
    name: stabilize_current_implementation
    priority: immediate
    outcome: Existing credentials can be safely replaced before further automation.
    tasks:
      - Deploy the argv-safe AppRole login implementation and its regression test.
      - Unseal Vault and run the existing hub PKI bootstrap.
      - Rotate every Secret ID that may have appeared in systemctl status or process listings.
      - Add the gs-02 ed25519 host key to the SSH host-key registry.
      - Verify the hub CA publisher and both current site clients.
    complete_when:
      - No AppRole value appears in generated ExecStart, ps output, systemctl status, or journals.
      - Vault reports initialized=true and sealed=false.
      - gc-02 and gc-10 use replacement credentials.

  - id: P1
    name: one_source_and_one_reconciler
    priority: next
    outcome: A machine is declared once and all non-secret configuration is generated from it.
    tasks:
      - id: canonical_registry
        action: >-
          Add conf/nix-configs/vault-hub-sites.yml as the canonical non-secret
          registry for hub address, enabled sites, FQDNs, expected SSH host
          keys, and bundle-recipient public keys.
        note: >-
          Do not reuse vault_clients.yml; it describes the legacy local
          LuxNix secret registry and has a different security model.
      - id: generate_both_sides
        action: >-
          Extend autoconf so the registry generates each site's client settings
          and gs-02's hub source-node list. Remove duplicate hand-edits from
          ansible host_vars.
      - id: hub_reconciler
        action: >-
          Add luxnix-vault-reconcile-hub-sites. It checks Vault readiness,
          bootstraps shared PKI idempotently, creates or updates policies and
          AppRoles, rotates only when requested, installs gs-02's receiver
          secret copy, and writes one recipient-encrypted site bundle.
      - id: site_installer
        action: >-
          Add luxnix-vault-install-hub-bundle. It validates the target hostname,
          bundle manifest, CA, permissions, and required filenames before an
          atomic installation into /etc/secrets/vault.
      - id: readiness
        action: >-
          Add luxnix-vault-hub-readiness with a non-secret summary of seal
          state, TLS identity, CA publication, AppRole login, certificate
          validity, managed-secret delivery, and hub receiver configuration.
    complete_when:
      - Adding a site requires one YAML entry rather than edits on both hub and site.
      - Re-running reconciliation makes no change when desired state already matches.
      - Rotation requires an explicit flag and invalidates the previous Secret ID.
      - The generated bundle is encrypted for exactly one site's declared recipient.

  - id: P2
    name: lifecycle_automation
    priority: after_P1
    outcome: Normal restarts recover without a sequence of manual service commands.
    tasks:
      - Add a Vault readiness unit or timer that distinguishes sealed, unavailable, and ready states.
      - Trigger CA publication and non-secret reconciliation only after Vault is unsealed.
      - Replace restart loops while sealed with bounded retry and actionable status output.
      - Add expiry warnings and planned certificate and AppRole rotation commands.
      - Add encrypted Raft snapshot backup and a tested restore drill.
    complete_when:
      - After an owner unseals Vault, dependent hub services converge automatically.
      - A sealed Vault produces one clear readiness failure without leaking credentials or restart-spamming.

  - id: P3
    name: auto_unseal_decision
    priority: optional
    outcome: Reboots can be unattended without placing the unseal capability on gs-02 itself.
    options:
      - id: external_cloud_kms_or_hsm
        recommendation: preferred_when_available
        requirements:
          - An independently administered KMS or HSM with narrowly scoped decrypt permission.
          - Workload identity or a protected systemd credential; no key credential in Nix or Git.
          - Backup, outage, revocation, migration, and recovery-key procedures tested before production.
      - id: independent_vault_transit
        recommendation: acceptable_when_operated_independently
        requirements:
          - A separate highly available Vault cluster outside gs-02's failure and trust boundary.
          - A renewable orphan token limited to encrypt and decrypt on one transit key.
          - No circular dependency between the hub Vault and the transit Vault.
      - id: local_saved_shamir_key
        recommendation: reject
        reason: Compromise of gs-02 would provide both encrypted Vault data and its unseal capability.
    migration_gate:
      - Take and verify a Raft snapshot before changing the seal.
      - Test the selected key service's outage and recovery behavior.
      - Use Vault's documented seal-migration procedure, including migrate-mode unseal.
      - Record and securely distribute the new recovery keys.

test_plan:
  - Validate the canonical YAML schema and reject duplicate hostnames, missing recipients, and unsafe paths.
  - Test generated hub and site configuration from one registry fixture.
  - Retain the regression test that rejects AppRole values in ExecStart and process arguments.
  - Test root-only permissions and atomic rollback for bundle installation.
  - Test reconciliation idempotency, explicit rotation, revocation, sealed behavior, and TLS mismatch.
  - Test readiness output for ready, sealed, unreachable, expired certificate, and missing secret states.

success_metrics:
  declarative_edits_per_new_site: 1
  privileged_commands_on_hub_normal_enrollment: 1
  secure_transfers_per_new_site: 1
  privileged_commands_on_site_before_nixos_switch: 1
  plaintext_secret_artifacts_in_repository_or_nix_store: 0
  credentials_visible_in_process_arguments_or_logs: 0

references:
  - title: HashiCorp Vault seal configuration
    url: https://developer.hashicorp.com/vault/docs/configuration/seal
  - title: HashiCorp Vault sealing best practices
    url: https://developer.hashicorp.com/vault/docs/configuration/seal/seal-best-practices
  - title: HashiCorp transit auto-unseal tutorial
    url: https://developer.hashicorp.com/vault/tutorials/auto-unseal/autounseal-transit
  - title: HashiCorp vault operator unseal command
    url: https://developer.hashicorp.com/vault/docs/commands/operator/unseal
