# inventory/host_vars/gc-09.yml
---
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  custom_packages.baseDevelopment: "true"
  endoreg-client.defaultCenterKey: "university_hospital_wuerzburg"

host_services:
  luxnix.lxAnnotateLocal.django.enrollLegacyDefaultSalt: "true"
  # Würzburg shares one center salt; differing local salts stay as historical keys.
  luxnix.lxAnnotateLocal.django.centerIdentitySalt: "true"

host_nixos:
  nix.settings.max_jobs: 1
  nix.settings.cores: 4

extra_secret_names: []

host_luxnix:
  # Vault enrollment verified by the operator (2026-10-23); the center identity
  # salt requires fail-closed machine authentication.
  vault.client.auth.deferUntilProvisioned: "false"
