---
group_roles:
  endoreg_client.enable: "true"
  aglnet.client.enable: "true"
  nextcloudClient.enable: "true"
group_services: {}
group_luxnix:
  generic_settings.enable: "true"
  # GPU Configuration (New Unified System)
  generic_settings.gpu.autoDetect: "true"
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.prime.enable: "true"
  generic_settings.gpu.nvidia.driver: '"production"'
  boot_decryption_stick.enable: "true"
  generic_settings.configurationPathRelative: '"lx-production"'

  maintenance.autoUpdates.enable: "false"
