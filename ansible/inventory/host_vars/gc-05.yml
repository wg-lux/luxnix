# inventory/host_vars/gc-05.yml
---
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  custom_packages.baseDevelopment: "true"
  endoreg_client.defaultCenterKey: '"rbk_stuttgart"'
  # Verified on gc-05: UUID 96c09eae-57cb-4e5c-95e1-9050a32abcc4, device 8:19.
  # A stale 8:3 mount remains an operator recovery blocker; never auto-remount it.
  endoreg_client.paths.storagePersistingDeviceId: '"usb-Seagate_Expansion_HDD_00000000NT197WLC-0:0"'
  endoreg_client.paths.storagePersistingDevicePart: '"part3"'

host_services:
  luxnix.lxAnnotateLocal.django.enrollLegacyDefaultSalt: "true"

host_nixos:
  nix.settings.max_jobs: 1
  nix.settings.cores: 4

ansible_roles:
  - "dev_access"

extra_secret_names:
  - "SCRT_roles_system_password_postgres_host_test_password"

host_luxnix:
  # This client has no legacy LUKS files; encrypt its existing Btrfs data in place.
  storage.operatorUnlocked.layout: '"boot-luks"'
  storage.operatorUnlocked.volumes: "{ }"
  storage.operatorUnlocked.bindMounts: "{ }"
  # gc-05 is enrolled and must retain fail-closed Vault authentication.
  vault.client.auth.deferUntilProvisioned: "false"
