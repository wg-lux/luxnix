group_roles:
  aglnet.client.enable: "true"
  base_server.enable: "true"
  gpu_server.enable: "true"
group_services:
  # Every GPU server receives the immutable application monitoring contract.
  luxnix.lxAnnotateLocal.runtime.monitoring.enable: "true"
  # New HLS reservations use the dedicated NVIDIA encoder whenever this
  # GPU-backed service role materializes HLS. Existing valid generations remain
  # playable. Runtime preflight fails closed if NVENC is unavailable instead of
  # silently changing the persisted artifact profile.
  luxnix.lxAnnotateLocal.runtime.hlsEncodingProfile: '"clinical_h264_nvenc_cq_v1"'
  luxnix.lxAnnotateLocal.runtime.ffmpegWorker.cudaVisibleDevices: '"0"'
  luxnix.lxAnnotateLocal.runtime.celeryBroker.secureTransportConfirmed: "true"
  luxnix.lxAnnotateLocal.database.ownership: '"external"'
  luxnix.lxAnnotateLocal.database.host: '"172.16.255.22"'
  luxnix.lxAnnotateLocal.database.port: 5432
  luxnix.lxAnnotateLocal.runtime.externalServices.redisUrl: '"redis://172.16.255.14:6380/1"'
  luxnix.lxAnnotateLocal.runtime.llmInferenceWorker.mode: '"always"'
  luxnix.lxAnnotateLocal.runtime.trainingWorker.cudaVisibleDevices: '"0"'
  luxnix.lxAnnotateLocal.runtime.trainingWorker.mode: '"manual"'
  luxnix.ollama.acceleration: '"cuda"'
  luxnix.ollama.enable: "true"
  luxnix.ollama.enableModelBootstrap: "false"
  luxnix.ollama.models: '[ "gemma4:e2b" ]'
  ollama.host: '"0.0.0.0"'
group_luxnix:
  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.driver: '"stable"'
  # Note: Servers typically don't need PRIME hybrid graphics
  # maintenance.autoUpdates.enable: "true"

group_nixos:
  hardware.nvidia.powerManagement.enable: "true"
  hardware.nvidia.powerManagement.finegrained: "false"
