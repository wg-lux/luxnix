schema_version: '1.3'
catalog_id: fleet_volume_encryption
title: Flottenverschlüsselung mit hostlokalem OpenBao und zentraler Identitätsprovisionierung im Hub
language: de
created_date: '2026-10-26'
revised_date: '2026-10-26'
status: proposed_not_verified
architecture: docs/openbao-architecture.md
implementation_update:
  date: '2026-10-26'
  selected_backend: OpenBao
  scope: Lokales OpenBao auf jedem Host für die Container-Entsperrung; separates zentrales OpenBao auf gs-02 für
    die Identitätsprovisionierung, die heute HashiCorp Vault übernimmt.
  requirement_change: Ersetzt die zentrale Freigabe jedes Volume-Schlüssels durch gs-02 (Schema 1.1). Die Ablösung
    von HashiCorp Vault ist Ziel nach abgenommener Migration.
  state: partially_implemented_not_deployed
  current_runtime: Fleet defaults remain unchanged. The working tree now includes an opt-in local OpenBao service,
    TPM-only credential validation, pre-switch checks and UUID-bound local unlock. Enrollment, installer gating,
    ordered lock, recovery and Vault migration remain incomplete; no fleet acceptance is claimed.
  implementation_reference: docs/openbao-local.md
purpose: Jeder Host betreibt ein unabhängiges lokales OpenBao mit Raft und TPM-gebundenem Auto-Unseal für die
  Container-Schlüssel. Ein zentrales OpenBao auf gs-02 übernimmt Maschinen-Enrollment, PKI und die Auslieferung
  gemeinsamer Center-Salts von HashiCorp Vault. Ein fehlendes oder unbrauchbares TPM blockiert Installation und
  Aktivierung; es gibt keinen Software-Rückfall.
acceptance_principle:
- Ein einziges Gruppenprofil gilt flottenweit. host_vars enthalten Hardwarefakten, keine schwächeren Ausnahmen.
- Jeder Host besitzt einen eigenen Raft-Speicher. Clients sind weder Voter noch Replikat im Raft des Hubs.
- Das TPM schützt den Seal-Vertrauensanker des lokalen OpenBao. OpenBao verschlüsselt die Container-Schlüssel
  in Raft. Das TPM ist kein Speicher-Backend.
- Das zentrale OpenBao provisioniert Maschinen- und Anwendungsidentitäten, Policies und PKI. Nach dem Enrollment
  verhindert ein Hub-Ausfall die lokale Entsperrung nicht.
- Ein fehlendes, deaktiviertes oder unbrauchbares TPM blockiert die Installation vor Plattenänderungen und die
  Aktivierung vor Dienständerungen. Ein automatischer Software-Rückfall ist unzulässig.
- Vorhandene Container, Recovery-Keyslots und Anwendungsschlüssel bleiben unverändert. Ein Start initialisiert
  nie einen Ersatzspeicher für OpenBao und formatiert nie fehlende Volumes. Fehlende deklarierte Container legt
  ausschließlich der katalogisierte Deploy-Befehl an, nachdem der Controller das Escrow geprüft hat (Eigentümerentscheidung
  2026-10-26).
- Regulärer Shutdown und explizites Sperren stoppen Schreiber, hängen Binds und Dateisysteme aus, schließen LUKS
  und stoppen erst danach das lokale OpenBao. Rebuilds lassen offene Volumes offen.
- Enrollment, Provisionierung und Migration laufen über katalogisierte, inventarbezogene Abläufe.
normative_note: Anforderungen und Zahlenwerte sind Vorschläge für dieses Vorhaben, keine Herstellerzusagen oder
  Industriestandards. Alle Kriterien mit required_for fleet_release sind MUSS-Kriterien. Nicht verfügbare Fähigkeiten
  dürfen nicht als erfüllt ausgewiesen werden.
evidence_policy:
  purpose: Verhindert, dass Kriterien durch Umformulierung, schwache Tests oder unpassende Evidenzklassen als erfüllt
    erscheinen. Gilt für Menschen und Agenten.
  criterion_changes: Anforderungen und Verifikationen ändern sich nur durch eine datierte Eigentümerentscheidung
    in architecture_decisions. Ein Kriterium wird nie an eine vorhandene Implementierung angepasst, damit sie besteht.
  evidence_classes:
  - id: static
    meaning: Lesen, Linting, Strukturprüfung, Textverträge
  - id: unit
    meaning: Python- oder Shell-Tests mit gemockten Systemaufrufen
  - id: eval
    meaning: Nix-Evaluierung und Build
  - id: vm
    meaning: NixOS-VM, swtpm oder vTPM, synthetische Daten
  - id: hardware
    meaning: Physischer Referenzhost je Hardwareklasse mit dokumentierter Firmware, NixOS-Revision und flake.lock
  rules:
  - Jede Verifikation nennt ihre Mindestklasse. Was Boot, TPM-Bindung, Kaltstart, Recovery oder Manipulation betrifft,
    verlangt die Klasse hardware. vm und unit belegen nur Logik und Protokoll.
  - Übersprungene, als xfail markierte oder abgewählte Tests sind kein Bestehen. Ergebnisse nennen passed, failed
    und skipped getrennt.
  - Tests, die Quelltext, Nix-Dateien oder Dokumentation nach Zeichenketten durchsuchen, sind nur Klasse static
    und nie Funktionsnachweis.
  - Jede Sicherheitsaussage braucht einen Negativtest, der ohne die Schutzmaßnahme fehlschlägt. Eine Mutationsprobe
    (Schutz entfernen, Test muss rot werden) wird für blocking-Befunde dokumentiert.
  - Ein Test, der einen bekannten Fehler als gewolltes Verhalten festschreibt, ist kein Nachweis und wird als Befund
    geführt.
  - Quality-Baselines werden nicht angehoben, Prüfungen nicht abgeschwächt und keine Flags wie --allow-partial,
    --force oder Mock-Umgebungsvariablen eingeführt, um ein Gate zu bestehen.
  - Status verified im Feature-Tracker setzt eine benannte menschliche Bewertungsperson voraus. Agenten setzen höchstens
    in_progress oder blocked und tragen Evidenz mit Klasse ein.
  - Ein Befund in repository_review wird nur mit Testreferenz und Evidenzklasse geschlossen, nie durch Löschen.
verification_note: Die gc-10-Bestandsaufnahme stammt vom Nutzer. Der ursprüngliche Review war statisch. Die
  OpenBao-Prüfung vom 2026-10-26 umfasst Nix-Evaluierung und einen isolierten NixOS-VM-Test (Klasse vm); Ergebnisse
  und Grenzen stehen in repository_review. Keine Host-Aktivierung und keine Hardware-Abnahme.
scope:
  fleet_group: operator_unlocked_secrets
  fleet_group_source: ansible/inventory/hosts.ini
  platform: NixOS mit LUKS2-Containern der Module operator-unlocked-storage und operator-storage-helper
  key_provider: Lokales OpenBao auf jedem Host; gs-02 ist zusätzlich zentrale Identitätsinstanz
  key_service_constraints:
  - Lokale und zentrale OpenBao-Instanz haben getrennten Zustand, Seal, Listener, Audit und Policies, auch auf gs-02.
  - Lokaler Zustand und Bootstrap-Material sind vor den Containern verfügbar, die sie entsperren. Kein Bootstrap-Geheimnis
    liegt in diesen Containern.
  - Der TPM-gebundene Auto-Unseal wird mit der gepinnten OpenBao-Version nachgewiesen. Kandidat ist der Static Seal
    mit einem Schlüssel aus einem TPM2-versiegelten systemd-Credential; PKCS#11 ist Alternative. Ein nur mit dem
    Host-Schlüssel verschlüsseltes Credential ist unzulässig, weil dieser Schlüssel auf der unverschlüsselten Root liegt.
  - Auf Clients läuft kein Enterprise-Feature von HashiCorp Vault oder OpenBao als Voraussetzung.
  - HashiCorp Vault bleibt nur während der gestuften Migration in Betrieb. Bestehende Anwendungsschnittstellen bleiben
    kompatibel, bis alle Konsumenten umgestellt sind.
  - Der verschlüsselte Ansible-Admin-Vault und der unabhängige Notfallexport bleiben Recovery-Verwahrung. Sie sind
    nicht der abzulösende Vault-Server.
  - Identity Salts bleiben quellenlokal gemäß secrets-management.yml (identity_salt). Das zentrale OpenBao übernimmt
    nur die heutige Vault-Aufgabe, Center-Salts für freigegebene gemeinsame Center auszuliefern.
  out_of_scope:
  - Windows/BitLocker- und macOS/FileVault-Adapter
  - Eigene Verwaltungsoberfläche oder Verwaltungsserver im Stil von GravityZone
  - Mandantenübergreifende Verwaltung
  - Datenmigration oder Neuformatierung vorhandener Volumes
  - Zentrale Hinterlegung von Machine Salts, Patienten- oder Untersuchungshashes
profiles:
- id: local_openbao_tpm
  applies_to: Alle Hosts in operator_unlocked_secrets, einschließlich gs-02 für seine eigenen Volumes
  description: Unabhängiges lokales OpenBao mit Raft, TPM-gebundenem Auto-Unseal, privatem Unix-Socket und an die
    LUKS-UUID gebundenen Container-Einträgen.
- id: hub_identity_authority
  applies_to: Rolle gs-02
  description: Zusätzliche zentrale OpenBao-Instanz für Maschinen- und Anwendungsidentitäten, PKI und Autorisierung.
    Keine Voraussetzung für den Kaltstart eines enrollten Hosts. Ihr Zustand liegt auf einem Volume von gs-02, das
    dessen lokales OpenBao öffnet.
- id: operator_recovery
  applies_to: Alle Hosts
  description: Expliziter Recovery-Befehl mit unabhängig verwahrtem Material für TPM-Verlust, Verlust des lokalen
    OpenBao und LUKS-Recovery. Nie ein automatischer Rückfall und kein wählbarer unlockMethod-Wert.
proposed_measurements:
  disclaimer: Vor Umsetzung im Abnahmeplan festlegen. Abweichungen werden mit Hardwareklasse und Begründung versioniert.
  reference_host_cold_boots_per_hardware_class: 5
  reference_host_normal_reboots_per_hardware_class: 3
  unattended_reboots_per_fleet_host: 1
  unlock_timeout_seconds: 90
  unlock_timeout_start: Sobald das TPM verfügbar ist. Die Grenze umfasst Start und Entsiegeln des lokalen OpenBao
    sowie das Öffnen aller Container.
  hub_revocation_effect_seconds: 300
  hub_restart_recovery_minutes: 30
  recovery_target_minutes: 30
  recovery_timer_start: Ab autorisierter Verfügbarkeit des Recovery-Materials und einer funktionsfähigen
    Wiederherstellungsumgebung. Ein separater Backup-Restore braucht eine eigene RTO/RPO.
  note: Die Zeitgrenze für die Volume-Entsperrung ist keine Zusage für Datenbank-Recovery oder vollständige
    Anwendungsbereitschaft.
user_reported_gc10_baseline:
  source: Bestandsaufnahme im Nutzerbeitrag vom 2026-10-26; hier nicht unabhängig auf dem Host verifiziert. gc-10
    dient nur als Referenzhost seiner Hardwareklasse, nicht als Pilotumfang.
  volumes:
  - luxnix-secrets
  - luxnix-app-storage
  approle_directory: /etc/secrets/vault/hub-pki/
  approle_storage: Bind-Mount aus luxnix-secrets
  secret_id_ttl: 0
  secret_id_num_uses: 0
  authentication_service: vault-auth-setup.service (Oneshot)
  token_ttl: 1h
  token_max_ttl: 4h
  application_secret_interfaces:
  - DJANGO_SECRET_KEY_FILE
  - DJANGO_DB_PASSWORD_FILE
  - LX_ANNOTATE_MASTER_KEY_FILE
  startup_ordering: operatorUnlocked.guardedServices
  missing_primary_capability: Unbeaufsichtigte Entsperrung der verschlüsselten Volumes
  secure_boot_enabled: false
  tpm2_hardware_present: unknown
  vault_host: gs-02
  vault_unseal: manual
  allow_offline: true
  migration_policy: disabled
  integration_hardening_note: Eine SecretID-CIDR-Bindung an die vom Vault-Server beobachtete VPN-Quelladresse ist
    ein separates Härtungsthema. Sie ersetzt weder Geräteidentität noch Volume-Freigabe.
acceptance_criteria:
- id: ENC-01
  category: Standardisierung
  title: Ein einheitliches, versioniertes Flottenprofil
  requirement: Die Lösung ist in den bestehenden Speichermodulen und einem OpenBao-Modul je Rolle umgesetzt und wird
    ausschließlich über group_vars der Gruppe operator_unlocked_secrets aktiviert. host_vars setzen nur Hardwarefakten
    wie Containerpfade oder Abhängigkeiten, weder Entsperrmethode noch Schutzprofil. Die Rolle hub_identity_authority
    ergibt sich aus der Inventarrolle, nicht aus einer Host-Ausnahme.
  verification:
  - (eval) Eine Nix-Evaluierung aller Hosts der Gruppe zeigt für jeden Host dasselbe Profil.
  - (eval) Ein Test schlägt fehl, sobald ein host_vars-Eintrag Entsperrmethode oder Schutzprofil überschreibt.
  - (static) Generierte Host-Dateien stimmen mit autoconf:generate überein; es gibt keine Handänderungen.
  required_for:
  - fleet_release
- id: ENC-02
  category: Standardisierung
  title: Explizite Fähigkeiten je Hardwareklasse
  requirement: Für jede Hardwareklasse der Flotte werden TPM 2.0, Secure Boot und unbeaufsichtigter Kaltstart vor
    der Ausrollung erfasst. Ein Host, der das Profil nicht erfüllt, bricht vor der Aktivierung mit Begründung ab.
    Es gibt keine stille Abschwächung und keinen Rückfall auf ein schwächeres Profil.
  verification:
  - (static) Jeder Host der Gruppe ist einer Hardwareklasse mit dokumentierten Fähigkeiten zugeordnet.
  - (eval) Fehlende oder ungetestete Fähigkeiten werden maschinenlesbar als unsupported, unavailable oder unverified
    gemeldet.
  - (hardware) Ein vorbereiteter Einzelneustart zählt nicht als Kaltstartnachweis.
  required_for:
  - fleet_release
- id: ENC-03
  category: Standardisierung
  title: Vorhandene Volumes übernehmen
  requirement: Bestehende LUKS2-Container werden ohne Entschlüsselung, Formatierung oder Datenmigration übernommen.
    LUKS-UUID und Keyslot-/Token-Bestand werden je Host erfasst. Hostnamen und Labels allein gelten nicht als sichere
    Identität.
  verification:
  - (vm) Ein Vorher-/Nachher-Abgleich bestätigt unveränderte Nutzdaten, LUKS-UUIDs und erhaltene Recovery-Keyslots
    mit echtem cryptsetup.
  - (unit) Jede Keyslot- oder Token-Änderung erscheint vor der Ausführung im Änderungsplan.
  - (vm) Ein fehlender deklarierter Container wird nur über den katalogisierten Deploy-Befehl angelegt, und erst
    nachdem die Recovery-Passphrase in Admin-Vault und Notfallexport authentisiert ist. Ein normaler Start, ein
    Rebuild und eine Aktivierung legen nie an.
  - (unit) Ein unerwarteter Container (andere UUID, kein LUKS, fremde Quittung) führt zu einem erklärten Abbruch.
  required_for:
  - fleet_release
- id: ENC-04
  category: Standardisierung
  title: Vorschau und Konfliktprüfung vor der Flottenänderung
  requirement: Vor jeder Ausrollung zeigt eine Vorschau den betroffenen Hostbestand, das Profil je Host, den Neustartbedarf
    und Hosts, die vor der Aktivierung abbrechen würden. Richtlinienversion und Ausrollwelle sind nachvollziehbar.
  verification:
  - (eval) Vorschau und tatsächlich ausgeführter Änderungsumfang stimmen überein.
  - (eval) Hosts außerhalb der gewählten Welle bleiben unverändert.
  - (unit) Nicht freigegebene Richtlinienversionen werden zurückgewiesen.
  required_for:
  - fleet_release
- id: ENC-05
  category: Lokale Schlüsselfreigabe
  title: Das lokale OpenBao verwaltet die Container-Freigabe
  requirement: Jeder Host liest seine je Container eindeutigen Schlüssel aus seinem eigenen OpenBao-Raft, gebunden
    an Host und native LUKS-UUID. Ein Hub-Ausfall verhindert die Entsperrung eines enrollten Hosts nicht. Im Profil
    existiert kein Keyslot oder Token, der den Container ohne das lokale OpenBao automatisch öffnet (zum Beispiel
    ein systemd-tpm2-Token).
  verification:
  - (vm) Ein echtes lokales OpenBao gibt nur den vorgesehenen Eintrag für Host, Volume und UUID frei. Falsche Identität,
    vertauschte UUID und fehlender Schlüssel schlagen geschlossen fehl.
  - (hardware) Ein enrollter Host startet kalt bei unerreichbarem Hub; weder ein zentrales Token noch ein zwischengespeicherter
    Klartext-Volume-Schlüssel wird benötigt.
  - (vm) Die Provisionierung speichert einen neuen Schlüssel dauerhaft im lokalen OpenBao und in der unabhängigen
    Recovery-Verwahrung und prüft beides, bevor ein neuer Container formatiert wird. Vorhandene Container werden
    ohne Formatierung übernommen.
  - (vm) luksDump zeigt nach Provisionierung und Übernahme keinen systemd-tpm2-Token und keinen anderen automatisch
    nutzbaren Keyslot außer dem OpenBao-Keyslot; der Recovery-Keyslot bleibt.
  - (eval) Kein Client tritt dem Raft des Hubs bei oder erhält Zugriff auf den Speicher eines anderen Hosts.
  required_for:
  - fleet_release
- id: ENC-06
  category: Lokale Schlüsselfreigabe
  title: Verpflichtendes nutzbares TPM und hardwaregebundener Bootstrap
  requirement: Jeder Host benötigt ein funktionsfähiges TPM 2.0. Das TPM schützt den Auto-Unseal des lokalen OpenBao
    und die hardwaregebundene Identität für das Hub-Enrollment. Eine Kopie der Platte allein liefert keine nutzbaren
    Bootstrap-Credentials.
  verification:
  - (vm) Der katalogisierte Installer bricht vor der Partitionierung ab, wenn das TPM fehlt, deaktiviert, unbrauchbar
    ist oder die deklarierte Policy nicht erfüllt.
  - (vm) Aktivierung und Bootstrap wiederholen die Live-Prüfung des TPM; Inventar-Assertions allein genügen nicht.
    Die Prüfung schlägt fehl und wird nie per Condition übersprungen.
  - (hardware) Ein kopierter lokaler Raft-Speicher samt Credential-Verzeichnis entsiegelt auf einem anderen TPM nicht.
  - (vm) Ein Seal-Credential, das nur mit dem Host-Schlüssel verschlüsselt ist, wird beim Start abgelehnt (Negativtest
    mit Mutationsprobe).
  - (hardware) Das Enrollment prüft die vorgesehene Hardware und lehnt Software-TPMs in Produktion ab. swtpm-Tests
    bleiben Testevidenz.
  - (vm) Die Hub-Identität ist gepinnt und das Maschinen-Enrollment authentisiert; kein TOFU und kein Klartext-Bootstrap-Geheimnis
    auf unverschlüsseltem Speicher.
  required_for:
  - fleet_release
- id: ENC-07
  category: Lokale Schlüsselfreigabe
  title: Kreisfreier lokaler Start und getrennte Hub-Rolle
  requirement: Zustand des lokalen OpenBao, TPM-Metadaten und Bootstrap-Credentials sind vor den operator-unlocked
    Containern verfügbar. Die zentrale Instanz auf dem Hub hat eigene Dienst-, Zustands- und Seal-Identitäten und
    nimmt nicht an der lokalen Kaltstart-Entsperrung teil.
  verification:
  - (eval) Der Abhängigkeitsgraph zeigt TPM -> lokales OpenBao -> entsiegelt -> LUKS -> Mounts -> Datenbank/Anwendung
    ohne Rückkante.
  - (eval) Lokale und zentrale Instanz auf gs-02 kollidieren weder bei Socket, Port, Datenverzeichnis noch Credential.
  - (vm) Ein Hub- oder VPN-Ausfall nach dem Enrollment verhindert die lokale Entsperrung nicht; die Identitätserneuerung
    meldet einen eigenen degradierten Zustand.
  required_for:
  - fleet_release
- id: ENC-08
  category: Lokale Schlüsselfreigabe
  title: Lokales und zentrales OpenBao unabhängig betreiben und wiederherstellen
  requirement: Lokaler Auto-Unseal und zentrale Identitätsverfügbarkeit haben getrennte Recovery-, Backup- und Audit-Verträge.
    Single-Node-Raft ist Persistenz, keine Redundanz. Der lokale Speicher ist ersetzbar, weil die Recovery-Verwahrung
    jeden Container öffnen kann.
  verification:
  - (vm) Ein Neustart des lokalen OpenBao entsiegelt über dasselbe TPM, erhält die Daten und braucht keinen zentralen
    Dienst. Die Entsperrung wartet auf sealed=false, nicht nur auf die Dienstbereitschaft.
  - (hardware) Nach einem TPM-Tausch wird das lokale OpenBao mit unabhängig verwahrtem Material neu aufgesetzt;
    Containerinhalte und UUIDs werden geprüft.
  - (vm) Die zentrale Identitätsprovisionierung und ihr Issuer-Zustand werden getrennt wiederhergestellt; ein Single-Node-SLA
    ist dokumentiert oder ein Quorum-Ausfall getestet.
  - (vm) Audit-Ausfall, volle Platte, verschlüsselte Aufbewahrung außerhalb des Hosts und Wiederherstellung sind
    für beide Rollen geprüft. Ein volles Audit-Device auf dem Client wird überwacht, weil es den Boot blockiert.
  - (vm) Explizites Sperren und Shutdown stoppen Konsumenten, hängen Dateisysteme aus und schließen Mappings, bevor
    das lokale OpenBao stoppt. Belegte Mappings führen ohne erzwungenes Aushängen zu einem Fehler.
  - (vm) Rebuilds lassen Mounts offen. Ein versiegeltes OpenBao wird nie als gesperrtes LUKS gemeldet.
  required_for:
  - fleet_release
- id: ENC-09
  category: Schutz
  title: Integrität der ausgeführten Entsperr- und Folgekomponenten
  requirement: Der Code, der den lokalen Seal-Schlüssel erhält und danach auf Secrets oder Nutzdaten zugreift, ist
    gegen Offline-Manipulation der unverschlüsselten Root geschützt. Alternativ ist das Restrisiko für das Standardprofil
    ausdrücklich bewertet und vom Eigentümer freigegeben. Signierte UKIs oder PCR 7 allein gelten nicht als Nachweis
    für die Integrität beliebiger Root- oder Nix-Store-Inhalte. Weil die Entsperrung lokal und unbeaufsichtigt erfolgt,
    trägt dieses Kriterium den gesamten Schutz eines ausgeschalteten gestohlenen Geräts.
  verification:
  - (hardware) Manipulationen an Bootimage, Startparametern, OpenBao-Binary, Entsperrlogik und relevanten Nix-Store-Pfaden
    verhindern das Entsiegeln oder nachweislich die Ausführung des manipulierten Codes.
  - (static) Ein schwächeres Profil wird als eingeschränkt gekennzeichnet und erfüllt dieses Kriterium nicht stillschweigend.
  - (static) Das Prüfprotokoll unterscheidet ruhende Daten von einem bereits entsperrten, laufend kompromittierten
    System.
  required_for:
  - fleet_release
- id: ENC-10
  category: Schutz
  title: Secrets im Betrieb und in persistenten Kopien schützen
  requirement: Entsperrschlüssel, Seal-Schlüssel, SecretIDs und vollständige Tokens erscheinen nicht in Versionsverwaltung,
    Nix-Store, Kommandozeilen, normalen Logs, Ansible-Ausgaben oder Diagnoseexporten. Secure-Boot-Signierschlüssel
    liegen nicht auf einem Volume, das ohne Operator automatisch geöffnet wird.
  verification:
  - (vm) Diagnose-, Prozessargument-, Build-, Log- und Ansible-Ausgabeprüfungen mit synthetischen Test-Secrets finden
    keine Werte.
  - (vm) Ein unberechtigter lokaler Benutzer kann den OpenBao-Socket, die Credentials und Test-Secrets weder auf
    dem Client noch auf gs-02 lesen.
  - (static) Der Ablageort der Signierschlüssel ist dokumentiert und vom automatisch entsperrten Volume getrennt.
  - (static) Secure-Boot-Signierschlüssel bilden eine eigene Schlüsselklasse mit eigenem Signiervorgang und eigenen
    Berechtigungen. Clients erhalten nur signierte Artefakte und öffentliche Prüfgrundlagen.
  required_for:
  - fleet_release
- id: ENC-11
  category: Start und Betrieb
  title: Echte unbeaufsichtigte Startfälle
  requirement: Ein Host im Profil local_openbao_tpm öffnet alle erforderlichen Volumes ohne Benutzeranmeldung,
    PIN-Eingabe, SSH-Eingriff oder vorbereiteten Einzelneustart, auch wenn gs-02 nicht erreichbar ist.
  verification:
  - (hardware) Je Hardwareklasse bestehen am Referenzhost fünf Kaltstarts nach vollständigem Ausschalten und drei
    normale Neustarts, davon mindestens einer bei unerreichbarem Hub.
  - (hardware) Jeder Host der Gruppe besteht nach der Ausrollung mindestens einen unbeaufsichtigten Neustart.
  - (vm) Ein isolierter Test mit synthetischen Daten prüft das Verhalten nach ungeplantem Stromverlust, einschließlich
    Raft-Konsistenz des lokalen OpenBao; kein produktiver Datenbestand wird absichtlich gefährdet.
  - (static) Ein Erfolg beim Rebuild, Resume oder einmalig authentisierten Neustart ersetzt keinen Kaltstarttest.
  required_for:
  - fleet_release
- id: ENC-12
  category: Start und Betrieb
  title: Bereitschaft anhand der richtigen persistenten Daten
  requirement: Abhängige Dienste starten erst, wenn die erwarteten Volumes entsperrt, anhand ihrer LUKS-UUID verifiziert,
    korrekt gemountet und die erforderlichen Secrets verfügbar sind. Ein vorhandenes leeres Verzeichnis genügt nicht
    als Mountnachweis.
  verification:
  - (vm) Bei gesperrtem, fehlendem oder falsch zugeordnetem Volume starten PostgreSQL, Vault, das zentrale OpenBao
    und LX-Annotate nicht auf Ersatzverzeichnissen.
  - (vm) Nach erfolgreichem Start werden der bestehende Datenbestand und die bestehenden Anwendungsdaten verwendet.
  required_for:
  - fleet_release
- id: ENC-13
  category: Start und Betrieb
  title: Definierter Fehlerzustand mit begrenzter Wartezeit
  requirement: Fehlendes TPM, abgelehntes Seal-Credential, versiegeltes oder fehlendes lokales OpenBao, fehlender
    Eintrag, abgelehnter Keyslot, falsche Policy und fehlendes Volume erzeugen unterscheidbare Fehler. Die Daten bleiben
    gesperrt und abhängige Dienste blockiert. Die Startsequenz wartet nur bis zur konfigurierten Grenze. Es gibt
    keine Passwortabfrage und keinen anderen Rückfall.
  verification:
  - (vm) Jedes Fehlerszenario ergibt innerhalb von unlock_timeout_seconds einen maschinenlesbaren Zustand mit Ursache.
  - (vm) Es werden weder leere Schlüssel noch Klartext-Ersatzspeicher, Passwortabfragen oder still abgeschwächte
    Profile verwendet.
  - (vm) Nach Behebung der Ursache öffnet ein dokumentierter Wiederholungsweg die Volumes ohne Neustart.
  required_for:
  - fleet_release
- id: ENC-14
  category: Start und Betrieb
  title: Rebuilds, Updates und Rollback beherrschen
  requirement: rebuild-host-switch und rebuild-host-boot halten bereits geöffnete Volumes offen und starten das lokale
    OpenBao nicht ungeplant neu. System-, Firmware-, OpenBao- und Boot-Updates haben einen freigegebenen Ablauf für
    TPM-Bindung, Neustart und Recovery. Ein nicht autorisierter Rollback oder eine manipulierte Version erhält keinen
    Seal-Schlüssel.
  verification:
  - (vm) Ein unveränderter und ein üblicher Rebuild schließen die Datenvolumes nicht.
  - (hardware) Ein freigegebenes Update samt Änderung der PCR-Werte und sein genehmigter Rollback funktionieren gemäß
    Policy oder erreichen den vorgesehenen Recovery-Zustand.
  - (vm) Ein OpenBao-Versionswechsel erhält den Raft-Bestand oder bricht vor der Aktivierung ab.
  - (static) Eine erforderliche vorübergehende Schutz-Aussetzung ist sichtbar, auf einen Neustart begrenzt und wird
    nachweislich beendet.
  required_for:
  - fleet_release
- id: ENC-15
  category: Widerruf und Offline
  title: Hub-Widerruf und lokales Sperren sind getrennt
  requirement: Der Hub widerruft zentrale Identitätsausstellung und Autorisierung. Die lokale Schlüsselfreigabe ist
    davon unabhängig. Für ein ausgeschaltetes oder offline betriebenes Gerät gibt es keinen sofortigen Fernwiderruf
    der Volume-Schlüssel; das ist eine akzeptierte Grenze dieses Profils.
  verification:
  - (vm) Widerrufene zentrale Identitäten und ihre bestehenden Tokens werden innerhalb von hub_revocation_effect_seconds
    abgelehnt.
  - (vm) Zustellung und Bestätigung eines Widerrufs werden je Host gemeldet; offline Hosts bleiben ausstehend und
    werden nicht fälschlich als gesperrt angezeigt.
  - (vm) Ein lokaler Sperrbefehl stoppt Schreiber und schließt LUKS. Bereits gelesene Daten und unabhängige Recovery-Keyslots
    liegen ausdrücklich außerhalb eines rückwirkenden Widerrufs.
  - (static) Es wird nicht behauptet, dass das Löschen einer Cert-Rolle allein ausgestellte Tokens widerruft oder
    entfernte Volumes schließt.
  required_for:
  - fleet_release
- id: ENC-16
  category: Widerruf und Offline
  title: Lokale Entsperrung und Identitätserneuerung getrennt
  requirement: Das lokale OpenBao entsperrt einen enrollten Host ohne Hub. Der Anwendungsstart mit vorhandenen Secrets
    und die Gültigkeit von Identitätszertifikaten werden getrennt bewertet; fehlgeschlagene Hub-Erneuerungen haben
    eigene Zustände degraded oder expired.
  verification:
  - (vm) Nur-Hub-Ausfall, Ausfall des lokalen OpenBao und kombinierter Ausfall werden getestet; lokale Schlüssel
    werden nie aus einem Klartext-Cache ersetzt.
  - (vm) Eine frische Identitätsausstellung wird bei offline Hub nicht als erfolgreich gemeldet; abgelaufene Identitäten
    verlängern ihr Vertrauen nicht stillschweigend.
  required_for:
  - fleet_release
- id: ENC-17
  category: Widerruf und Offline
  title: Anwendungstokens über beide OpenBao-Rollen
  requirement: Anwendungszugriffe auf lokales oder zentrales OpenBao bleiben über initiale und maximale Token-TTL
    hinaus durch begrenzte Erneuerung oder Re-Authentisierung autorisiert.
  verification:
  - (vm) Verkürzte TTL und Max-TTL werden mit den echten Konsumenten und mindestens zwei Erneuerungszyklen geprüft.
  - (vm) Volume-Entsperrung und Anwendungstokens haben getrennte Least-Privilege-Policies; es gibt kein dauerhaftes
    gemeinsames Flotten-Token.
  - (vm) Anwendungs-Dateischnittstellen und Schlüsselbytes bleiben bei der Migration erhalten; ein Backend-Wechsel
    ist keine Schlüsselrotation.
  required_for:
  - application_secret_lifecycle
- id: ENC-18
  category: Recovery
  title: Recovery ohne gs-02, ohne Vault und ohne lokales OpenBao praktisch nachweisen
  requirement: Für jedes Volume jedes Flottenhosts existiert ein geprüfter, autorisierter Recovery-Weg, der weder
    gs-02, Vault, das lokale OpenBao noch die devenv-Umgebung voraussetzt. Vorhandene Passphrase-Keyslots bleiben
    erhalten.
  verification:
  - (hardware) Je Hardwareklasse werden die Testvolumes bei gelöschtem TPM und fehlendem lokalem OpenBao mit nativen
    cryptsetup-Werkzeugen über den Recovery-Weg geöffnet.
  - (static) Berechtigte Personen beziehen das Recovery-Material über einen von gs-02 unabhängigen Notfallweg.
  - (vm) Ein Re-Seed-Befehl baut nach der Recovery ein neues lokales OpenBao und neue Keyslots auf und entfernt den
    alten OpenBao-Keyslot erst nach erfolgreicher Testöffnung.
  - (static) Der Wiederherstellungsplan berücksichtigt beschädigte LUKS-Header (header-backup).
  - (vm) Es gibt drei getrennte Recovery-Wege. (1) Zentrales OpenBao mit Seal-Material, Datenbestand, Audit und Policies
    auf Ersatzhardware. (2) Lokales OpenBao per Re-Seed. (3) LUKS-Recovery je Volume. Das Material für Weg 3 liegt
    nicht als automatischer Rückfall auf dem Client.
  required_for:
  - fleet_release
- id: ENC-19
  category: Recovery
  title: Recovery-Material geschützt hinterlegen
  requirement: Recovery-Material ist eindeutig Inventarhost, LUKS-UUID und Keyslot zugeordnet; die machine-id ist
    nur ein zusätzliches Merkmal, weil sie sich bei Neuinstallation ändert. secrets-management.yml und die Feature-Tracker
    speichern nur Referenzen und Prüfstatus, keine Werte. Der Notfallbestand wird nach jeder Änderung aktualisiert.
  verification:
  - (vm) Zentrale Hinterlegung und Notfallweg enthalten nachweislich aktuelles Material und sind nach einer simulierten
    Neuinstallation auffindbar.
  - (vm) Unberechtigte Rollen können das Material weder lesen noch exportieren.
  required_for:
  - fleet_release
- id: ENC-20
  category: Recovery
  title: Provisionierung, Enrollment und Rotation idempotent und unterbrechungssicher
  requirement: Provisionierung, lokale OpenBao-Initialisierung, Hub-Enrollment, Wechsel der Hardwarebindung und Rotation
    sind wiederholbar und nach einem Abbruch an jeder Phasengrenze fortsetzbar. Ein geprüfter Zugangs- oder Recovery-Weg
    wird erst entfernt, wenn der neue Zustand und die Hinterlegung gesichert sind.
  verification:
  - (vm) Dreifaches Ausführen desselben Vorgangs erzeugt keine zusätzlichen Keyslots, Einträge oder Tokens und keine
    Datenänderung.
  - (vm) Unterbrechungen an jeder dokumentierten Phasengrenze führen beim nächsten Lauf zu einem validierten Endzustand;
    ein dauerhaftes Steckenbleiben gilt als Fehler.
  - (vm) Zwei gleichzeitig gestartete Mutationen desselben Volumes werden serialisiert oder mit eindeutigem Konflikt
    abgewiesen.
  - (vm) Kein Lauf entfernt den letzten nutzbaren Zugang.
  - '(vm) Drei Rotationen sind getrennt beschrieben und geprüft: (1) Rotation des lokalen Seal-Schlüssels per Seal-Migration
    ohne Änderung an LUKS; (2) Ersatz des LUKS-Keyslot-Geheimnisses, wobei das alte Geheimnis danach am Volume ungültig
    ist; (3) Wechsel des Volume-Masterkeys als eigener, separat freigegebener Vorgang.'
  required_for:
  - fleet_release
- id: ENC-21
  category: Deployment-Integration
  title: Ausrollung ausschließlich über bestehende Deploymentbefehle
  requirement: 'Konfiguration und Ausrollung verwenden den dokumentierten Ablauf: Inventar, autoconf:check, autoconf:generate,
    Nix-Build, check-connectivity, TPM-Preflight, danach rebuild-host-boot beziehungsweise rebuild-host-switch oder
    run-ansible --limit. Es gibt keine host-spezifischen Befehlsvarianten für die Verschlüsselung.'
  verification:
  - (static) Der vollständige Ausrollablauf einer Welle ist mit den Befehls-IDs aus devenv/commands.yml dokumentiert
    und reproduzierbar.
  - (static) devenv/commands.yml enthält für die Verschlüsselung keine hostnamensgebundenen Varianten.
  - (vm) Hosts, deren Voraussetzungen fehlen (TPM, Secure Boot, initialisiertes lokales OpenBao), brechen vor der
    Aktivierung ab, nicht erst beim nächsten Boot.
  required_for:
  - fleet_release
- id: ENC-22
  category: Deployment-Integration
  title: Betriebsschritte als katalogisierte Befehle
  requirement: Jeder Betriebsschritt ist als Eintrag in devenv/commands.yml mit Risikoklasse aus luxnix.yml, operator_confirmation_required,
    Implementierung und Dokumentation erfasst und auf einen Host oder eine Inventargruppe anwendbar. Das betrifft
    TPM-Preflight, Initialisierung des lokalen OpenBao, Hub-Enrollment, Container-Provisionierung und -Übernahme,
    flottenweite Statusabfrage, Rotation, Widerruf, Recovery und Re-Seed.
  verification:
  - (vm) Jeder Schritt lässt sich mit --limit für einen einzelnen Host und für die Gruppe operator_unlocked_secrets
    ausführen.
  - (vm) Sensible Schritte nutzen die bestehenden Schutzmechanismen (Operatorbestätigung, gepinntes SSH, privates
    tmpfs auf dem Controller) und geben keine Schlüsselwerte aus.
  - (vm) Die flottenweite Statusabfrage zeigt je Host Profil, Seal-Zustand des lokalen OpenBao, Enrollment-Zustand
    am Hub, Sperr-/Mountzustand, Recovery-Prüfstatus und Alter des letzten Nachweises.
  required_for:
  - fleet_release
- id: ENC-23
  category: Deployment-Integration
  title: Entsperrung und Datenmigration unabhängig
  requirement: Aktivierung, Änderung, Ausfall oder Recovery der Entsperrung lösen keine Datenmigration, keine Neuinitialisierung
    einer Datenbank, keine Formatierung und keine Ersatzschlüsselerzeugung aus. Datenmigration und Identity-Salt-Migration
    haben eigene Schalter und eigene Freigaben.
  verification:
  - (vm) Alle Start-, Update-, Fehler- und Recovery-Fälle belegen, dass kein Migrationsauftrag gestartet wurde.
  - (vm) Ein nicht gemountetes Datenverzeichnis führt zu einem blockierten Dienst und nicht zu einer neuen leeren
    Installation.
  - (vm) Die automatische Identity-Salt-Migration startet nur, wenn die aktive Generation in mindestens zwei getrennten
    Fehlerdomänen dauerhaft verwahrt und geprüft ist.
  - (vm) Die Datenmigration in neu angelegte Container läuft als eigener Auftrag. Sie kopiert im Hintergrund vor,
    während die Schreiber laufen, und schaltet erst nach einem Stopp aller Schreiber mit exakter Abschlusskopie,
    leerer Prüf-Differenz und Quittung um. Die Quelle bleibt unverändert; die Stoppdauer wird je Host protokolliert.
  - (vm) Scheitert die Abschlusskopie, bleiben die Binds inaktiv und die Schreiber laufen wieder auf der unveränderten
    Quelle.
  required_for:
  - fleet_release
- id: ENC-24
  category: Deployment-Integration
  title: Bestehende Secret-Provider und Dateischnittstellen weiterverwenden
  requirement: Die Lösung erfordert keine Anwendungsänderung. Bis zur Migration bleiben AppRole-Dateien, vault-auth-setup
    und die *_FILE-Schnittstellen nach dem Volume-Mount unverändert nutzbar; danach liefert das zentrale OpenBao
    dieselben Dateischnittstellen.
  verification:
  - (vm) Ein Integrationstest startet vault-auth-setup und LX-Annotate nach der lokalen Entsperrung mit den bestehenden
    Dateischnittstellen.
  required_for:
  - fleet_release
- id: ENC-25
  category: Nachweise
  title: Reale Tests je Hardwareklasse
  requirement: Jede zugesagte Fähigkeit hat ein reproduzierbares Prüfprotokoll mit Hardwareklasse, Firmware, NixOS-Revision,
    flake.lock, OpenBao-Version und Policy-Version sowie einem positiven und einem negativen Fall, nach evidence_policy.
  verification:
  - (static) Eine VM mit vTPM oder swtpm belegt nur ihren Gastpfad und nicht den Schutz physischer Hosts.
  - (static) Linting und statische Tests werden ergänzend ausgewiesen und nicht als Boot- oder Recovery-Nachweis gezählt.
  required_for:
  - fleet_release
- id: ENC-26
  category: Nachweise
  title: Bedienbare Runbooks und konsistente Dokumentation
  requirement: Ausrollung, TPM-Preflight, Initialisierung des lokalen OpenBao, Hub-Enrollment, Statusprüfung, Kaltstart,
    Hub-Ausfall, Recovery, Re-Seed, Rotation, Widerruf, Update/Rollback und Außerbetriebnahme sind in docs/operator-unlocked-storage.md,
    docs/openbao.md und docs/deployment-guide.md beschrieben. Dabei werden die Befehls-IDs aus devenv/commands.yml
    verwendet.
  verification:
  - (hardware) Eine zweite, mit dem Verfahren vertraute Person führt Recovery und Re-Seed auf einem Testsystem ohne
    improvisierte Zusatzschritte aus.
  - (static) secrets-management.yml enthält nur Referenzen; structure.yml-Dateien sind bei geänderten Zuständigkeitsgrenzen
    angepasst; python scripts/lint_structure.py und docs:check laufen erfolgreich.
  required_for:
  - fleet_release
fleet_checks:
- id: FL-01
  title: Flottenprofil und Hardwareklassen
  criteria:
  - ENC-01
  - ENC-02
  - ENC-04
  pass_condition: Alle Hosts der Gruppe evaluieren mit demselben Profil; jede Hardwareklasse ist erfasst; die Vorschau
    stimmt mit der Ausführung überein.
- id: FL-02
  title: Lokale Freigabe, TPM-Pflicht und Hub-Trennung
  criteria:
  - ENC-05
  - ENC-06
  - ENC-07
  - ENC-08
  pass_condition: Container öffnen nur über das lokale OpenBao; kein TPM-Token oder anderer automatischer Umweg existiert;
    Plattenkopien und fremde TPMs entsiegeln nicht; der Startgraph ist kreisfrei; Neustart und Recovery beider Rollen
    sind geprobt.
- id: FL-03
  title: Unbeaufsichtigter Start und Bereitschaft
  criteria:
  - ENC-11
  - ENC-12
  pass_condition: Die Referenzhosts bestehen die Kaltstart- und Neustartzahlen, auch bei unerreichbarem Hub; jeder
    Flottenhost besteht mindestens einen unbeaufsichtigten Neustart mit unveränderten persistenten Daten.
- id: FL-04
  title: Fehler, Manipulation und Secrets
  criteria:
  - ENC-09
  - ENC-10
  - ENC-13
  pass_condition: Manipulation, fehlendes TPM, abgelehntes Credential und versiegeltes OpenBao erzeugen den erwarteten
    gesperrten Zustand ohne Rückfall; keine Test-Secrets in Logs oder Artefakten.
- id: FL-05
  title: Updates, Widerruf und Offlinebetrieb
  criteria:
  - ENC-14
  - ENC-15
  - ENC-16
  pass_condition: Rebuilds halten Volumes offen; Updates mit PCR-Änderung folgen dem freigegebenen Ablauf; ein Hub-Widerruf
    wirkt innerhalb des Zeitlimits; Offlinezustände sind ehrlich gemeldet.
- id: FL-06
  title: Recovery und Rotation
  criteria:
  - ENC-18
  - ENC-19
  - ENC-20
  pass_condition: Recovery gelingt ohne gs-02, Vault und lokales OpenBao; Re-Seed und wiederholte Abläufe sind idempotent
    und fortsetzbar; der Notfallbestand ist aktuell.
- id: FL-07
  title: Deployment-Integration und Bestand
  criteria:
  - ENC-03
  - ENC-21
  - ENC-22
  - ENC-23
  - ENC-24
  pass_condition: Die Ausrollung läuft ausschließlich über katalogisierte Befehle; Daten, Keyslots und AppRole-Dateien
    bleiben erhalten; es wird keine Migration gestartet.
- id: FL-08
  title: Dokumentation und Nachweise
  criteria:
  - ENC-25
  - ENC-26
  pass_condition: Jeder MUSS-Punkt ist mit einem reproduzierbaren Nachweis der verlangten Evidenzklasse verknüpft;
    unbekannte Eigenschaften bleiben offen.
