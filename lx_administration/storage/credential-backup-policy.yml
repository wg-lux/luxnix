schema_version: 1
max_bytes: 67108864
max_files: 8192
# Absent optional paths are recorded, never silently forgotten at verification.
optional_paths:
  - /etc/luks-keys
  - /var/lib/postgresql/endoregDbLocal.password
  - /var/lib/lx-annotate-identity-salts
  - /var/lib/lx-annotate/data/.identity-salt-recovery
  - /var/endoreg-service-user/lx-annotate-wheel/conf
# These are NOT deletion rules. Active evaluated consumers always take precedence.
retirement_candidates:
  - /etc/user-passwords
  - SCRT_client_user_password
  - SCRT_groups_system_password_*
  - SCRT_roles_system_password_postgres_host_test_password
  - SCRT_roles_system_password_postgres_host_main_password
  - SCRT_roles_system_password_nginx_host_password
  - SCRT_roles_system_password_nextcloud_host_minio_credentials
