name: Nix quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Ratcheted source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run fast Nix quality checks
        run: nix develop .#default --command python3 scripts/nix-quality.py --json > nix-quality-report.json
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-quality-fast
          path: nix-quality-report.json
          if-no-files-found: ignore

  generators:
    name: Generated Nix renderer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run non-evaluating generator contracts
        run: >-
          nix develop .#default --command uv run pytest -q
          --junitxml=nix-quality-generators-junit.xml
          tests/test_autoconf_rendering.py
          tests/test_ansible_autoconf_nixos_config.py
          tests/test_autoconf_cli.py
          tests/test_boot_decryption_renderer.py
      - name: Upload generator JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-quality-generators-junit
          path: nix-quality-generators-junit.xml
          if-no-files-found: warn

  full:
    name: Full flake evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run full Nix quality checks
        run: nix develop .#default --command python3 scripts/nix-quality.py --full --json > nix-quality-report.json
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-quality-full
          path: nix-quality-report.json
          if-no-files-found: ignore

  python:
    name: Python correctness and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run repository and tracker contracts with locked dependencies
        run: >-
          nix develop .#default --command uv run --locked pytest -q
          tests feature-tracking/test_tracker.py
          --junitxml=luxnix-python-junit.xml
      - name: Upload Python JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxnix-python-junit
          path: luxnix-python-junit.xml
          if-no-files-found: warn

  mcp:
    name: MCP integration and provenance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run the independent MCP suite with its own dependency lock
        working-directory: wg-lux-mcp
        run: >-
          nix develop ..#default --command uv run --locked --extra dev pytest -q
          --junitxml=mcp-junit.xml
      - name: Upload MCP JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxnix-mcp-junit
          path: wg-lux-mcp/mcp-junit.xml
          if-no-files-found: warn
