# These are human assessments, never automatic proof or permission to erase.
console_boot_tested: At the selected host, test the physical console, keyboard and firmware boot menu. Confirm you can select recovery media without relying on SSH.
trusted_installer_tested: Boot trusted NixOS installer media on this machine without starting installation. Confirm it sees the system disk and recovery drive, then return to the known-working installed generation to record the result. Rerun setup-media after reboot to remount the recovery drive.
independent_credentials_tested: Test administrator login and sudo. Confirm required recovery credentials are accessible independently of the system disk being encrypted; do not put passwords in the evidence notes.
vault_recovery_tested: STOP if the only vault or its unlocking key is on a selected disk. Run boot-storage-setup preflight first; review refuses to continue without its receipt, and it covers only the secrets this host needs. Follow the Vault recovery section in docs/boot-storage-migration.md. From independent protected recovery storage, test access to the original administrator password/hash pair and required application keys/salts. Preserve local Vault files, controller Ansible Vault and its unlock key, and HashiCorp Vault recovery/access material where applicable; a remote Vault address or a copied encrypted file alone is not proof. Record the applicable stores, recovery locations and actual recovery test results without secret contents. Keep the original password hash to preserve login; do not bootstrap or rotate passwords to pass this check.
in_place_backup_acknowledged: Make and test a backup of the data before encrypting. The conversion keeps files in place and can resume after a power cut, but bad RAM or a failing disk during it can damage data. Write where the backup is and how it was tested; if you decide to go without one, name who accepted that risk.
plaintext_remnants_reviewed: Old unencrypted copies can stay physically readable on SSD flash after in-place encryption. Confirm patient data was only ever stored in encrypted containers on this host, not on the plaintext root, in home folders, logs or temp files. If it was on the plaintext root, stop for a separate data-remanence review. This workflow does not erase old flash contents and offers no formatting fallback.
container_data_consolidated: Confirm the data from every old container is at its normal path on the encrypted root and that the old container files are still present and untouched. Do not delete them yet; retire-containers is available only after physical acceptance.
selected_disks_disposal_authorized: Historical evidence only. Disposable plans are retired and cannot execute; preserve the journal and data instead of approving erasure.
machine_and_application_credentials_preserved_or_reenrolled: Preserve required machine identities, administrator credentials and application keys/salts outside the system disk, or document and test their explicit re-enrollment procedure. Existing encrypted data still needs its original keys.
new_disks_verified: Historical evidence only. Fresh disk installation is retired; the supported workflow preserves an existing Btrfs root in place.
headers_preserved: Preserve the original LUKS headers and verify independent recovery copies before replacing any disk layout.
archives_authenticated: Authenticate the backup archives with the intended recovery identities; record the actual verification results.
independent_copy_verified: Verify the backup copy is readable independently of all disks selected for replacement.
source_retained: Confirm the original source disks or approved whole-disk images are retained and can be restored.
whole_disk_image_verified: Verify the complete disk image and demonstrate its restoration on an isolated target.
isolated_restore_verified: Restore the required dataset to an isolated target and verify its contents.
database_verified: Verify the restored database is consistent and usable by the application.
historical_media_decrypted: Decrypt and open historical protected media using the restored original keys.
identities_preserved: Verify original machine and application identities, keys and retained salts are preserved.
target_layout_reviewed: Review every prepared mount, filesystem and selected disk against the saved plan.
recovery_slots_tested: Test the independent LUKS recovery credentials for the newly prepared volumes.
identities_restored: Verify original machine and application identities and keys were restored to protected target storage.
database_restored: Restore and verify the database on the prepared target, preserving its required identities.
initial_credentials_staged: Stage and verify administrator and application credentials on the encrypted target; test the intended recovery or re-enrollment procedure.
boot_artifacts_reviewed: Review the bootloader, initrd, root unlock configuration and boot-password receipt for this exact target.
offline_cold_boot_passed: Cold-boot the installed machine without network-dependent root unlock and test local disk unlock and account selection/login.
secondary_unlock_passed: Verify every configured secondary encrypted volume unlocks and mounts correctly after boot.
application_verified: Verify application startup, authenticated access and decryption of required existing data.
failure_tests_passed: Verify required missing-key, missing-storage and unavailable-secret scenarios stop affected consumers safely.
recovery_test_passed: Demonstrate recovery using the independent media and credentials, retaining the recovery copies afterward.
partial_install_reviewed: Inspect the actual partial installation, boot files and prepared mounts; record what completed and what failed.
safe_to_retry_install_only: Confirm only the pinned install-only operation can safely be repeated; no repartitioning or formatting is permitted.
