---
- name: Set role managed for managed hosts
  hosts: managed
  become: true
  roles:
    - managed

- name: Set role postgres_host_main for host "s-02"
  hosts: s-02
  become: true
  roles:
    - postgres_host_main

- name: Set role Dev-Access
  hosts: gs-01, gs-02, gc-05, s-04
  become: true
  roles:
    - dev_access

- name: Set role nginx_host for nginx_host
  gather_facts: false
  hosts: nginx_host
  become: true
  roles:
    - nginx_host

- name: Set role keycloak_host for keycloak_host
  gather_facts: false
  hosts: keycloak_host
  become: true
  roles:
    - keycloak_host

- name: Set nextcloud role for nextcloud_host
  hosts: nextcloud_host
  gather_facts: false
  become: true
  roles:
    - nextcloud_host
