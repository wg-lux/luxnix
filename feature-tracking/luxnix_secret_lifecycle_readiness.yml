- id: requirements_complete
  category: requirements
  title: Credential ownership and migration contracts are explicit
  acceptance:
  - secrets-management.yml is the single cross-repository rotation catalog; a read-only checker rejects
    missing source contracts and invalid gate order without reading credentials or executing steps.
  - Application signing manifests propagate through the shared host environment to Django signing fallbacks;
    focused tests prove planned overlap and rejection after retirement. Identity and media rotation retain
    their existing backend migration ownership and separate retirement gates.
  - Each credential class identifies canonical inputs, consumers, revocation boundaries and migration
    rules.
  required: true
  verification:
    kind: manual
    instructions: Review secrets-management.yml and canonical operator guides against the final implementation.
    timeout_seconds: 300
  assessment:
