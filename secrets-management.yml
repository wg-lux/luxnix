---
schema_version: 1
# Canonical coordination only: no secret values, private file locations or readiness copies.
readiness: feature-tracking/luxnix_secret_lifecycle_readiness.yaml
runbook: docs/secret-rotation.md
repositories:
  luxnix: luxnix.yml
  endoreg_db: structure.yml
  lx_annotate: structure.yml
phases:
  - inventory
  - prepare
  - activate
  - verify
  - retire
families:
  secrets_backend_migration:
    owner: LuxNix secrets custodian and application maintainer
    routine: false
    contracts:
      luxnix:
        - docs/openbao.md
        - docs/openbao-architecture.md
        - modules/nixos/luxnix/vault/default.nix
        - modules/nixos/luxnix/openbao/default.nix
        - boot-encryption-acceptance.yml
    inventory: Record live versions, engines, auth methods, policies, identities, KV history, PKI exportability, leases and all consumers; the local Ansible
      admin vault is separate.
    prepare: Rehearse independent encrypted backup restore and logical transfer to isolated OpenBao; exact-version compatibility and client lifecycle tests gate
      cutover.
    activate: Freeze namespace writers, verify the final delta, and switch endpoint, pinned CA and fresh authentication generation together through
      inventory-scoped waves.
    verify: Preserve application encryption key bytes and IDs; verify TTL reauthentication, cold starts, database access, PKI, hub transfer and independent
      recovery for every consumer.
    retire: Require complete fleet accounting and the longest relevant lease and offline interval before revoking old credentials; deletion is a separate
      approved operation.
    incident: After target writes, freeze and reconcile deltas and external credential effects before rollback; never permit two authoritative rotating
      backends.
  local_openbao_seal:
    owner: LuxNix storage custodian
    routine: false
    contracts:
      luxnix: [docs/openbao-architecture.md, boot-encryption-acceptance.yml, modules/nixos/luxnix/openbao/default.nix]
    inventory: One static seal key per host for its local OpenBao; bound to the inventory host name and its TPM. Not implemented yet.
    prepare: Generate the key in the admin workflow and authenticate its admin-vault record and independent emergency export before first initialization.
    activate: Install it only as a systemd credential sealed with systemd-creds --with-key=tpm2 and an explicit PCR policy; host-key-only credentials are
      rejected before OpenBao starts.
    verify: A disk copy on another TPM must not unseal; an updated PCR policy follows the approved update flow. Hardware evidence is required.
    retire: Rotate only through OpenBao seal migration with both keys escrowed; volumes keep their recovery keyslots. No automatic deletion.
    incident: Treat the local store as disposable; open volumes with the escrowed recovery passphrase and re-seed a new store and keyslots.
  filesystem_recovery:
    owner: LuxNix storage custodian
    routine: false
    contracts:
      luxnix: [boot-encryption-acceptance.yml, lx_administration/storage/provision.py, docs/operator-unlocked-storage.md]
    inventory: Bind each reference to the device identity, native LUKS UUID, volume name and recovery protector; never use a shared fleet password.
    prepare: Generate new-volume credentials only in the admin workflow; authenticate the encrypted admin-vault record and independent encrypted emergency
      export before provisioning.
    activate: Use storage-provision for explicit creation; normal unlock never creates containers. Existing volumes retain their current recovery slots and
      require a tested credential for escrow.
    verify: Authenticate both custody copies and test native recovery separately from normal local OpenBao unlock; physical cold-boot and replacement-hardware
      evidence remain required.
    retire: Keep recovery and header backups current; no automatic deletion or rotation of existing slots.
    incident: Use the independently accessible export with the custodian-held admin vault key; export ciphertext must not be stored with a plaintext copy of
      that key.
  secure_boot_pki:
    owner: LuxNix storage custodian
    routine: false
    contracts:
      luxnix: [modules/nixos/system/boot/default.nix, modules/nixos/luxnix/operator-storage-helper/default.nix, docs/secure-boot.md]
    inventory: Record per host whether owner keys are enrolled in firmware and that the keyring is the encrypted secure-boot-pki bind.
    prepare: Create keys only with luxnix-operator-storage create-secure-boot-keys inside the verified encrypted keyring; never generate on root.
    activate: Rebuild to sign the boot chain, enroll keys in firmware setup mode with Microsoft certificates, then enroll TPM slots.
    verify: Confirm sbctl verify, Secure Boot enabled (user) and TPM unlock after a cold boot; recovery passphrases stay tested.
    retire: Key replacement changes PCR 7; re-enroll firmware keys and TPM slots together and keep recovery credentials current.
    incident: Treat a leaked db key as a bypass of TPM unlock; replace firmware keys, re-enroll TPM slots and rotate the volume credentials.
  django_signing:
    owner: LuxNix operator and LX-Annotate maintainer
    routine: true
    contracts:
      luxnix: [modules/nixos/services/lx-annotate-local/scripts/env.nix]
      lx_annotate: [lx_annotate/settings/config.py, lx_annotate/settings/settings_base.py, nix/runtime-environment.nix, secretspec.toml]
      endoreg_db: [endoreg_db/config/secret_keyring.py, docs/key_rotation.md]
    inventory: Identify every web and worker process and the loaded signing generation.
    prepare: >-
      Provision immutable private files. Prepare the replacement without enabling old signing credentials as fallbacks; coordinate consumer
      restart and session invalidation.
    activate: Set DJANGO_SIGNING_KEYRING_FILE via runtime.extraEnvironment; publish the manifest atomically and restart all consumers in a coordinated rollout.
    verify: Verify new signatures and rejection of retired signatures in every consumer; replacing a file does not reload Django settings.
    retire: Reject every retired signing generation and invalidate affected sessions/tokens at the coordinated cutover.
    incident: Omit compromised signing keys from all fallbacks and invalidate affected sessions/tokens; routine overlap is forbidden.
  media_master:
    owner: Local storage custodian and endoreg-db maintainer
    routine: false
    contracts:
      luxnix: [docs/lx-annotate-encrypted-data.md]
      lx_annotate: [nix/runtime-environment.nix, secretspec.toml]
      endoreg_db: [endoreg_db/management/commands/rotate_storage_secrets.py, endoreg_db/services/secret_rotation/storage.py, docs/key_rotation.md]
    inventory: Inventory registered encrypted artifacts, readers, backups, replicas, leases and staging files.
    prepare: Keep the master key local; prepare private immutable generations and a protected recoverable snapshot. Roll out readers before writers.
    activate: >-
      Set LX_ANNOTATE_MASTER_KEYRING_FILE via runtime.extraEnvironment; publish atomically, preview rotate_storage_secrets --include-hls in
      the installed service context, then explicitly apply.
    verify: >-
      Authenticate migrated content and unchanged hashes; verify streaming and HTTP Live Streaming, retry deferred leases and reconcile
      unregistered files.
    retire: Require complete artifact, backup and replica coverage; preserve the previous master until all retirement gates pass. No automatic deletion.
    incident: Isolate exposure and perform reviewed re-encryption; rotation cannot protect previously stolen ciphertext from a stolen key.
  identity_salt:
    owner: Center identity custodian and endoreg-db maintainer
    routine: false
    contracts:
      luxnix:
        - modules/nixos/services/lx-annotate-local/options/django.nix
        - scripts/provision-identity-salts.py
        - modules/nixos/services/lx-annotate-local/subservices/lx-annotate-identity-salts.nix
        - modules/nixos/luxnix/vault/default.nix
      lx_annotate: [nix/runtime-environment.nix, secretspec.identity.toml]
      endoreg_db: [endoreg_db/management/commands/rotate_identity_salt.py, docs/identity_ring_enrollment.md, docs/key_rotation.md]
    inventory: >-
      Identity salts are source-local secrets unless the center is listed in luxnix.vault.server.hubPki.sharedIdentityCenters (currently
      university_hospital_wuerzburg only); patient and examination hashes never leave their source node. Preserve existing local generations
      and identities. The planned hub OpenBao inherits only the allowlisted center salt delivery from Vault; machine salts are never
      centralized (docs/openbao-architecture.md). All local copies currently share the luxnix-secrets failure domain; automatic migration
      to a new generation requires verified copies in two failure domains.
    prepare: >-
      Review established local encrypted keyrings and retained hash links before opting a machine in; never replace missing material
      automatically. File-free SecretSpec delivery remains disabled.
    activate: >-
      Run luxnix-vault-reconcile-hub-sites on the Vault host first, then enable centerIdentitySalt only for hosts of an allowlisted center.
      identitySaltViaSecretSpec still fails evaluation. Coordinate application and infrastructure releases without rotating local
      identities.
    verify: >-
      Confirm no identity hashes enter outbound registration, that Vault generates and grants center salts only for allowlisted centers and
      that other centers' policies lack centers/ paths. Existing local import and historical recognition must retain their original keys.
    retire: Preserve historical source salts and clinical links. No automatic deletion, rotation or revocation is authorized by this source change.
    incident: >-
      Previously delivered secrets and transferred hashes require separate reviewed containment and migration; this source policy does not
      erase past disclosures.
  hub_enrollment:
    owner: Vault custodian and site operator
    routine: true
    contracts:
      luxnix: [devenv/commands.yml, ansible/playbooks/rotate_hub_enrollment.yml, docs/vault-hub-machine-enrollment.md]
    inventory: Select one inventory host, pinned SSH identity and independently verified Vault certificate authority; retain restricted accessor inventory.
    prepare: Custodian prepares the replacement enrollment bundle while preserving the node shared secret and recipient identity.
    activate: Use devenv shell rotate-hub-enrollment with the named host and verified certificate authority fingerprint; existing interactive gates apply.
    verify: Require ready authentication, renewed client certificate and receiver acceptance before retirement.
    retire: Explicitly revoke superseded Secret IDs and tokens, account for issued certificates and remove protected staging after acceptance.
    incident: Contain the site first; re-enrollment alone does not revoke tokens, certificates or node shared secrets. Follow the incident runbook.
  keycloak_client:
    owner: Keycloak administrator and Vault custodian
    routine: true
    contracts:
      luxnix: [modules/nixos/luxnix/vault/default.nix, modules/nixos/services/lx-annotate-local/options/django.nix, docs/vault-hub-machine-enrollment.md]
      lx_annotate: [lx_annotate/settings/config.py]
    inventory: List every site with django.keycloakSecretViaVault and every site still supplying keycloak.env by hand; all share one client.
    prepare: Regenerate the endoregdb-api client secret in Keycloak; the old secret stops working there immediately.
    activate: >-
      Publish with luxnix-vault-publish-oidc-client-secret and LUXNIX_VAULT_ALLOW_OIDC_CLIENT_SECRET_ROTATION=1, then restart
      managed-secrets-setup, lx-annotate-runtime-env and lx-annotate on every site.
    verify: Confirm OIDC login on every site; a failed fetch keeps the previous file and fails managed-secrets-setup.
    retire: Replace hand-supplied keycloak.env copies on sites that do not fetch from Vault.
    incident: A shared secret means one exposed site requires rotation for all sites; AppRole revocation does not invalidate fetched values.
  admin_password:
    owner: LuxNix operator with independent recovery access
    routine: true
    contracts:
      luxnix: [devenv/commands.yml, ansible/playbooks/rotate_admin_passwords.yml, docs/admin-passwords.md]
    inventory: Select exactly one canonical host and confirm independent recovery access.
    prepare: Use scoped vault-bootstrap --skip-sync --admin-host and validate the password/hash pair before scoped export.
    activate: Use devenv shell rotate-admin-passwords through the existing interactive terminal confirmation.
    verify: Verify new account authentication, rejection of the previous credential and subsequent sudo access without logging passwords.
    retire: Reconcile the canonical encrypted vault and host consumer; preserve unrelated fleet credentials.
    incident: Revoke compromised access and review SSH keys and sessions separately; password rotation alone does not revoke them.
  external_credentials:
    owner: Respective database, identity-provider, PKI or storage custodian
    routine: false
    contracts:
      luxnix: [docs/vault-hub-machine-enrollment.md, docs/vault-setup.md, docs/database-ownership.md]
    inventory: >-
      Classify database and OpenID Connect credentials, node shared secrets, recipient keys, certificate authorities, local vault keys and
      disk-encryption keys separately.
    prepare: Require a provider-specific reviewed procedure and recovery evidence; no generic bulk replacement is supported.
    activate: Use the owning provider procedure and coordinate every consumer; application media rotation does not rotate disk-encryption keys.
    verify: Prove new consumer authentication or decryption and fail-closed rejection of retired credentials at the owning boundary.
    retire: Account for pending transfers, backups, certificates and recovery material before removing an old generation.
    incident: >-
      Contain compromised identities and revoke at each authority; never reuse a node request secret for payload encryption or transmit the
      application master key.
