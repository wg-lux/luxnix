---
- name: Preserve a dedicated age backup identity on operator-selected encrypted recovery storage
  hosts: all
  gather_facts: false
  become: true
  become_user: root
  vars:
    recovery_directory: '{{ recovery_mount }}/storage-recovery/{{ backup_custody_id }}'
    recovery_target: '{{ recovery_directory }}/identity.agekey'
    ansible_remote_tmp: /run/user/1000/luxnix-ansible-recovery
  tasks:
    - name: Require the selected recovery host and explicit backup identity scope
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_play_hosts_all | length == 1
          - recovery_expected_host == inventory_hostname
          - backup_custody_id is match('^[a-z0-9][a-z0-9-]{2,60}$')
          - backup_identity_source is match('^/')
          - backup_identity_recipient is match('^age1[0-9a-z]{58}$')
          - recovery_mount is match('^/[A-Za-z0-9/_-]+$')

    - name: Verify protected source destination and temporary staging
      ansible.builtin.include_tasks: tasks/verify_secret_storage.yml
      vars:
        secret_controller_paths: ['{{ backup_identity_source }}']
        secret_remote_paths: ['{{ recovery_directory }}']

    - name: Reject SSH login keys and authenticate the selected native age identity
      ansible.builtin.command:
        argv: [age-keygen, -y, '{{ backup_identity_source }}']
      delegate_to: localhost
      become: false
      register: source_recipient
      changed_when: false
      no_log: true

    - name: Require the independently selected public identity
      ansible.builtin.assert:
        that: source_recipient.stdout | trim == backup_identity_recipient
      no_log: true

    - name: Require the selected encrypted recovery mount
      ansible.builtin.command:
        argv: [findmnt, --mountpoint, '{{ recovery_mount }}', --noheadings]
      changed_when: false

    - name: Create a root-only recovery directory within protected storage
      ansible.builtin.file:
        path: '{{ recovery_directory }}'
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Inspect source without reading it into logs
      ansible.builtin.stat:
        path: '{{ backup_identity_source }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: recovery_local
      no_log: true

    - name: Inspect any existing recovery destination
      ansible.builtin.stat:
        path: '{{ recovery_target }}'
        checksum_algorithm: sha256
      register: recovery_remote
      no_log: true

    - name: Refuse symlinks or different existing material
      ansible.builtin.assert:
        that:
          - recovery_local.stat.isreg | default(false)
          - recovery_local.stat.mode in ['0400', '0600']
          - not (recovery_local.stat.islnk | default(false))
          - not (recovery_remote.stat.islnk | default(false))
          - not recovery_remote.stat.exists or recovery_remote.stat.checksum == recovery_local.stat.checksum
      no_log: true

    - name: Preserve the dedicated backup identity without replacing material
      ansible.builtin.copy:
        src: '{{ backup_identity_source }}'
        dest: '{{ recovery_target }}'
        force: false
        owner: root
        group: root
        mode: '0400'
      no_log: true

    - name: Verify the stored private identity is usable
      ansible.builtin.command:
        argv: [age-keygen, -y, '{{ recovery_target }}']
      register: recovery_recipient
      changed_when: false
      no_log: true

    - name: Authenticate the stored recovery copy
      ansible.builtin.stat:
        path: '{{ recovery_target }}'
        checksum_algorithm: sha256
      register: recovery_verified
      no_log: true

    - name: Require exact bytes private ownership and the intended public recipient
      ansible.builtin.assert:
        that:
          - recovery_verified.stat.checksum == recovery_local.stat.checksum
          - recovery_verified.stat.uid == 0
          - recovery_verified.stat.mode == '0400'
          - recovery_recipient.stdout | trim == backup_identity_recipient
      no_log: true

    - name: Report dedicated identity custody without credentials
      ansible.builtin.debug:
        msg: Dedicated age identity verified; existing legacy SSH-key custody was not changed. Independent offline custody remains required.
