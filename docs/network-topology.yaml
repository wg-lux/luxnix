# Navigation map only. Runtime network data belongs to the canonical sources
# below; do not copy host addresses into this file.
schema_version: 1
status: derived-source-map

canonical_sources:
  hosts_groups_and_vpn_addresses: ansible/inventory/hosts.ini
  shared_openvpn_metadata: ansible/inventory/group_vars/all/20-network.yml
  generated_nix_network_metadata: ansible/inventory/group_vars/all/30-nix.yml
  host_overrides: ansible/inventory/host_vars
  autoconf_options: autoconf/config.yml
  nixos_resolution_policy: modules/nixos/luxnix/generic-settings/network/default.nix

generated_consumers:
  - systems/x86_64-linux/<host>/default.nix
  - networking.hosts

visualization:
  entrypoint: topology/default.nix
  source: flake.nix nixosConfigurations
  rule: Do not duplicate static hosts or networks in the topology module.

operator_guides:
  architecture: docs/network-architecture.md
  resolution_and_troubleshooting: docs/network-resolution.md

invariants:
  - VPN addresses come from inventory ansible_host values.
  - Public DNS suffixes are not emitted into shared generated hosts entries.
  - Local-only aliases are emitted only for the current host.
  - Service-specific pins do not replace TLS authentication.
