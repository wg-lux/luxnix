group_roles:
  aglnet.client.enable: "true"
  base_server.enable: "true"
  gpu_server.enable: "true"
group_services: {}
group_luxnix:
  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.driver: '"stable"'
  # Note: Servers typically don't need PRIME hybrid graphics
  maintenance.autoUpdates.enable: "true"
  maintenance.autoUpdates.operation: '"switch"'
  maintenance.autoUpdates.flake: '"github:wg-lux/luxnix"'
  maintenance.autoUpdates.dates: '"06:00"'
