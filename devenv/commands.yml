# Human- and machine-readable catalog for Devenv shell wrappers and tasks.
# Run these from the repository root. Inside an active shell, shell-wrapper
# names can be used directly; tasks keep their explicit `devenv tasks run`
# prefix so their execution mode remains unambiguous.
schema_version: 1
canonical_invocation: devenv shell <command> [arguments...]
task_invocation: devenv tasks run <task> [arguments...]
risk_levels_source: ../luxnix.yml#risk_levels

# Frontends should require an explicit operator confirmation before entries
# marked operator_confirmation_required. The field does not imply that the
# underlying wrapper implements its own prompt.
commands:
  - id: check-secret-rotation
    summary: Validate the central rotation catalog against three source checkouts and display ordered gates.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv shell check-secret-rotation --endoreg-db <checkout> --lx-annotate <checkout> [--family <family>]
    implementation: scripts/check-secret-rotation.py
    documentation: docs/secret-rotation.md

  - id: rebuild-host-switch
    summary: Persist and activate the reviewed configuration using native NixOS switching.
    risk: remote-state
    operator_confirmation_required: true
    usage: sudo nixos-rebuild switch --flake '<checkout>#<host>'
    implementation: modules/home/cli/shells/shared/default.nix
    documentation: docs/deployment-guide.md
    prerequisites:
      - Explicit checkout and host; reviewed revision and locked inputs; successful build and connectivity checks.
      - Retain SSH session and verify fresh access after activation; console recovery for access-affecting changes.
    effects:
      - Updates the persistent system profile and boot default and activates services.
      - The nho alias uses LUXNIX_FLAKE and LUXNIX_HOST; no intermediate test activation.

  - id: rebuild-host-boot
    summary: Stage the reviewed configuration for the next boot without live activation.
    risk: remote-state
    operator_confirmation_required: true
    usage: sudo nixos-rebuild boot --flake '<checkout>#<host>'
    implementation: modules/home/cli/shells/shared/default.nix
    documentation: docs/deployment-guide.md
    effects:
      - Updates the system profile and boot default; running services retain their configuration.
      - The nhb alias uses LUXNIX_FLAKE and LUXNIX_HOST; reboot is a separate authorized action.

  - id: enroll-reachable-hub-sites
    summary: Prompt once for a Vault enrollment token and reconcile enrollment on reachable configured sites.
    risk: sensitive-remote-state
    operator_confirmation_required: true
    usage: devenv shell enroll-reachable-hub-sites [--site gc-09] [--ask-sudo-password]
    implementation: scripts/enroll-reachable-hub-sites.sh
    playbook: ansible/playbooks/enroll_reachable_hub_sites.yml
    documentation: docs/vault-hub-machine-enrollment.md
    prerequisites:
      - Clean reviewed durable checkout, configured receiver identities and pinned SSH keys.
      - Initialized unsealed Vault on gs-02; existing hub enrollment commands deployed.
      - >-
        SSH from this controller and root sudo access (use --ask-sudo-password for separate host passwords; legacy --ask-become-pass asks
        once for a shared password); private controller tmpfs; encrypted or disabled swap.
    effects:
      - Token entry authorizes the displayed reachable fleet; token is not saved or printed.
      - Reuses valid installed or saved credentials; creates missing initial enrollment.
      - Preserves node secrets and hub recipient identity; refuses contained or conflicting identities.
      - Installs credentials, recipient public keys and receiver secret copies, then verifies authentication and certificates.
      - Refreshes receiver and sender database identities, then starts the site application and transfer worker; existing queued work may run.
      - Reports unreachable sites, fails when no site enrolls or a reachable site fails, and retains protected hub bundles for retry.

  - id: rotate-hub-enrollment
    summary: Interactively deliver a prepared routine AppRole replacement and renew the site client certificate.
    risk: sensitive-remote-state
    operator_confirmation_required: true
    usage: >-
      devenv shell rotate-hub-enrollment --limit <host>
      -e enrollment_expected_ca_sha256=<independently-verified-fingerprint>
    implementation: scripts/run-secret-playbook.sh
    playbook: ansible/playbooks/rotate_hub_enrollment.yml
    documentation: docs/vault-hub-machine-enrollment.md
    prerequisites:
      - Fresh enrollment bundle prepared by the custodian on gs-02; node shared secret unchanged.
      - Clean reviewed checkout, pinned SSH identities, and independently verified Vault CA fingerprint.
      - Interactive terminal and explicit host confirmation after preflight and connectivity checks.
    effects:
      - Delivers through the existing private tmpfs enrollment workflow.
      - Restarts authentication, requires ready, restarts managed secrets, and forces certificate reissuance.
      - Stops on failure with classified authentication recovery guidance.
      - Leaves receiver acceptance, retiring credential revocation and staging cleanup to the operator.

  - id: rotate-admin-passwords
    summary: Show one validated admin replacement on the terminal and require y/n before live activation.
    risk: sensitive-remote-state
    operator_confirmation_required: true
    usage: >-
      devenv shell rotate-admin-passwords --limit <host>
      -e admin_rotation_recovery_confirmed=true [ansible-playbook arguments...]
    implementation: scripts/run-secret-playbook.sh
    playbook: ansible/playbooks/rotate_admin_passwords.yml
    documentation: docs/admin-passwords.md
    local_activation:
      transport: ansible_connection=local
      inventory: Use the canonical inventory plus a private managed-group overlay for the selected host.
      privilege: --ask-become-pass requests the current sudo password.
      recovery: Keep a separately verified root shell open until new-password authentication and hash readback pass.
      verification: After updating admin, subsequent sudo tasks use the approved replacement only when the connection account is admin.
      documentation: docs/admin-passwords.md#activate-on-the-same-machine

  - id: deliver-hub-enrollment
    summary: Deliver one gs-02 enrollment bundle using private controller tmpfs and pinned SSH.
    risk: sensitive-remote-state
    operator_confirmation_required: true
    usage: >-
      devenv shell deliver-hub-enrollment --limit <host>
      -e enrollment_expected_ca_sha256=<independently-verified-fingerprint>
    implementation: scripts/run-secret-playbook.sh
    playbook: ansible/playbooks/deliver_hub_enrollment.yml
    documentation: docs/vault-hub-machine-enrollment.md

  - id: vault-migrate-local-key
    summary: Create one explicitly migrated master-encrypted copy without replacing the legacy source.
    risk: sensitive-local-state
    operator_confirmation_required: true
    usage: >-
      devenv shell vault-migrate-local-key --source <old> --output <new>
      --legacy-key <key-file> --legacy-id <label>
      --master-key <key-file> --confirm-migration
    implementation: scripts/vault/migrate_local_key.py
    documentation: docs/vault-setup.md

  - id: manage
    summary: Prepare the local environment or select its development mode.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv shell manage [setup|dev|prod|deploy|help]
    implementation: devenv/management.nix
    documentation: docs/development.md

  - id: bnsc
    summary: Generate canonical Autoconf outputs.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv shell bnsc
    alias_for: autoconf:generate
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: vault-bootstrap
    summary: Create or update the encrypted LuxNix vault and host exports.
    risk: sensitive-local-state
    operator_confirmation_required: true
    usage: devenv shell vault-bootstrap [bootstrap arguments...]
    implementation: scripts/bootstrap-lx-vault.py
    documentation: docs/admin-passwords.md
    scoped_admin_rotation:
      usage: >-
        devenv shell vault-bootstrap --skip-sync --admin-host <host>
        [--admin-passwords <private-input.yml>] [--export]
      prerequisites:
        - Existing canonical admin pair and registered host PSK.
        - All local ciphertext migrated to the explicit master key.
      effects:
        - Validates expiry and password/hash agreement only for the selected admin pair.
        - Preserves unrelated credentials and their expiry metadata.
        - Exports only the pair under <vault-dir>/admin-rotations/<host>/deploy/<host>.
        - Leaves the ordinary fleet export unchanged.

  - id: validate-admin-passwords
    summary: Validate inventory admin passwords against the encrypted vault.
    risk: sensitive-read-only
    operator_confirmation_required: false
    usage: devenv shell validate-admin-passwords [validation arguments...]
    implementation: scripts/validate-admin-passwords.py
    documentation: docs/admin-passwords.md

  - id: vault-site-preflight
    summary: Validate non-secret prerequisites for one Vault site enrollment.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv shell vault-site-preflight <host> [--json]
    implementation: scripts/vault/site_enrollment_preflight.py
    documentation: docs/vault-hub-machine-enrollment.md

  - id: check-connectivity
    summary: Check SSH connectivity to a selected inventory host or group.
    risk: remote-read-only
    operator_confirmation_required: false
    usage: devenv shell check-connectivity <host-or-group>
    implementation: scripts/check-connectivity.sh
    documentation: ansible/playbooks/readme.md

  - id: lx-annotate-streamable-migration
    summary: Run the deployed LX-Annotate streamable-storage migration helper.
    risk: remote-state
    operator_confirmation_required: true
    usage: devenv shell lx-annotate-streamable-migration <host> [migration arguments...]
    implementation: scripts/lx-annotate-streamable-migration.sh
    documentation: modules/nixos/services/lx-annotate-local/README.md

  - id: run-ansible
    summary: Apply the main Ansible playbook to configured hosts.
    risk: remote-state
    operator_confirmation_required: true
    usage: >-
      devenv shell run-ansible --limit <host-or-group>
      [ansible-playbook arguments...]
    implementation: scripts/run-ansible-playbook.sh
    playbook: ansible/site.yml
    documentation: ansible/playbooks/readme.md

  - id: ssh-all
    summary: Open inventory-selected hosts in repository shells within Tmux.
    risk: remote-read-only
    operator_confirmation_required: false
    usage: devenv shell ssh-all [--group <inventory-group>] [--dry-run]
    implementation: scripts/tmux-inventory-session.py
    documentation: tmux/README.md

  - id: init-server-ssh
    summary: Open inventory-selected hosts with htop within Tmux.
    risk: remote-read-only
    operator_confirmation_required: false
    usage: devenv shell init-server-ssh [--group <inventory-group>] [--dry-run]
    implementation: scripts/tmux-inventory-session.py
    documentation: tmux/README.md

  - id: kill-server-ssh
    summary: Stop the local ssh-servers tmux session.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv shell kill-server-ssh
    implementation: devenv/scripts.nix
    documentation: tmux/README.md

  - id: conn-server-ssh
    summary: Attach to the local ssh-servers tmux session.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv shell conn-server-ssh
    implementation: devenv/scripts.nix
    documentation: tmux/README.md

  - id: sync-secrets
    summary: Deploy managed secrets with the dedicated Ansible playbook.
    risk: sensitive-remote-state
    operator_confirmation_required: true
    usage: >-
      devenv shell sync-secrets --limit <host-or-group>
      [ansible-playbook arguments...]
    implementation: scripts/run-ansible-playbook.sh
    playbook: ansible/playbooks/deploy_secrets.yml
    documentation: ansible/playbooks/readme.md

  - id: mount-persisting-storage
    summary: Mount persistent storage using secrets from the configured provider.
    risk: sensitive-local-state
    operator_confirmation_required: true
    usage: devenv shell mount-persisting-storage
    implementation: scripts/storage/mount_persisting_storage.py
    documentation: docs/hardware-setup.md

# Tasks are listed separately because they are invoked through `devenv tasks`
# rather than the shell-wrapper namespace above.
tasks:
  - id: context:check
    summary: Validate hierarchical context manifests and all declared local references.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run context:check
    implementation: scripts/lint_structure.py
    documentation: docs/agent_context.md

  - id: nix-quality:check
    summary: Run ratcheted parse, deadnix, statix, nixfmt, and flake-checker checks without modifying files.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run nix-quality:check
    implementation: scripts/nix-quality.py
    policy: nix-quality.yml
    documentation: docs/nix-quality.md

  - id: nix-quality:generators
    summary: Run 61 non-evaluating Autoconf render, isolated-output, and boot-renderer contracts.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run nix-quality:generators
    implementation: devenv/tasks.nix
    policy: nix-quality.yml
    documentation: docs/nix-quality.md

  - id: nix-quality:full
    summary: Add full flake evaluation to the Nix quality checks.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run nix-quality:full
    implementation: scripts/nix-quality.py
    policy: nix-quality.yml
    documentation: docs/nix-quality.md

  - id: env:setup
    summary: Prepare the development shell and probe optional CUDA support.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv tasks run env:setup
    implementation: devenv/management.nix
    documentation: docs/development.md

  - id: env:setup-cuda
    summary: Probe optional CUDA support without blocking shell setup.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run env:setup-cuda
    implementation: devenv/management.nix
    documentation: docs/development.md

  - id: initialize-environment:endoreg-db
    summary: Initialize and migrate the EndoReg database.
    risk: local-state
    operator_confirmation_required: true
    usage: devenv tasks run initialize-environment:endoreg-db
    implementation: devenv/management.nix
    documentation: docs/development.md

  - id: initialize-environment:finished
    summary: Confirm that development environment initialization finished.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run initialize-environment:finished
    implementation: devenv/management.nix
    documentation: docs/development.md

  - id: autoconf:check
    summary: Validate and show resolved Autoconf options without generating files.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run autoconf:check
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: autoconf:refresh-facts
    summary: Refresh local facts while retaining last-known-good snapshots for failures.
    risk: remote-read-only
    operator_confirmation_required: false
    usage: devenv tasks run autoconf:refresh-facts
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: autoconf:refresh-facts-strict
    summary: Refresh local facts and fail if any inventory host remains stale.
    risk: remote-read-only
    operator_confirmation_required: false
    usage: devenv tasks run autoconf:refresh-facts-strict
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: autoconf:generate-report
    summary: Generate a private, redacted HTML inventory report from local facts.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv tasks run autoconf:generate-report
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: autoconf:initialize-vault
    summary: Initialize the Autoconf vault.
    risk: sensitive-local-state
    operator_confirmation_required: true
    usage: devenv tasks run autoconf:initialize-vault
    implementation: devenv/tasks.nix
    documentation: docs/vault-setup.md

  - id: autoconf:generate
    summary: Validate Autoconf options and generate NixOS and Home Manager configs.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv tasks run autoconf:generate
    implementation: devenv/tasks.nix
    documentation: docs/autoconf.md

  - id: docs:toc-generator
    summary: Regenerate the documentation table of contents.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv tasks run docs:toc-generator
    implementation: devenv/tasks.nix
    documentation: docs/index.md

  - id: docs:check
    summary: Validate documentation navigation and portable local links.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run docs:check
    implementation: devenv/tasks.nix
    documentation: docs/index.md

  - id: tests:pytest
    summary: Run the repository Python test suite with root-scoped discovery.
    risk: read-only
    operator_confirmation_required: false
    usage: devenv tasks run tests:pytest
    implementation: devenv/tasks.nix
    documentation: docs/testing-nixtests.md

  - id: repo:state-summary
    summary: Run the repository checks and write a JSON state snapshot for before/after comparison.
    risk: local-state
    operator_confirmation_required: false
    usage: devenv tasks run repo:state-summary
    implementation: scripts/repo-state-summary.py
    documentation: docs/nixos-version-bump.md

  - id: endoreg-db:init
    summary: Initialize the EndoReg database.
    risk: local-state
    operator_confirmation_required: true
    usage: devenv tasks run endoreg-db:init
    implementation: devenv/tasks.nix
    documentation: docs/development.md

  - id: endoreg-db:migrate
    summary: Apply EndoReg database migrations.
    risk: local-state
    operator_confirmation_required: true
    usage: devenv tasks run endoreg-db:migrate
    implementation: devenv/tasks.nix
    documentation: docs/development.md
