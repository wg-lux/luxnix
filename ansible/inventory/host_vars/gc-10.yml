# inventory/host_vars/gc-10.yml
---
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  aglnet.client.enable: "true"
  custom_packages.baseDevelopment: "true"
  endoreg-client.lxAi: "true"
  endoreg_client.defaultCenterKey: '"university_hospital_wuerzburg"'

host_services:
  # Interactive annotation hit CPU throttling and memory reclaim on this 32 GiB host.
  luxnix.lxAnnotateLocal.runtime.limits.cpuQuota: '"200%"'
  luxnix.lxAnnotateLocal.runtime.limits.memoryHigh: '"5G"'
  luxnix.lxAnnotateLocal.django.enrollLegacyDefaultSalt: "true"
  # Würzburg shares one center salt; differing local salts stay as historical keys.
  luxnix.lxAnnotateLocal.django.centerIdentitySalt: "true"
  luxnix.lxAiLocal.runtime.protectedDataDir: '"/var/lib/lx-annotate/data"'

host_nixos:
  # Existing migrated-host policy; other fleet hosts retain their encrypted swap.
  swapDevices: "lib.mkForce [ ]"
  systemd.generators.systemd-gpt-auto-generator: '"/dev/null"'

extra_secret_names: []

host_luxnix:
  # Enrollment tooling only; unlock stays on the fleet passphrase default until ENC-09.
  openbao.local.enable: "true"
  storage.operatorUnlocked.migration.enable: "false"
  storage.operatorUnlocked.volumes.luxnix-app-storage.luksUUID: '"f5869d54-4ea5-407c-a690-7238fe79cd6b"'
  storage.operatorUnlocked.volumes.luxnix-secrets.luksUUID: '"dc53d362-e6e2-43ee-9cbf-4726d55c3055"'
  storage.operatorUnlocked.bindMounts."/var/lib/lx-annotate/hub-pki": >-
    { volume = "luxnix-secrets"; directory = "hub-client-pki"; }
  storage.operatorUnlocked.volumes.luxnix-app-storage.container: '"/data/raid01/luxnix-app-storage.luks"'
  # The application container lives on the second disk.
  storage.operatorUnlocked.volumes.luxnix-app-storage.depends: '[ "/data/raid01" ]'
  # Temporary bootstrap exception; set false after verified Vault enrollment.
  vault.client.auth.deferUntilProvisioned: "false"

  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
    - "thunderbolt"
    - "vmd"
