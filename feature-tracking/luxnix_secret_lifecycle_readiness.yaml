- id: central_identity_salts_disabled
  category: security
  title: Restrict central identity salt provisioning to opted-in centers
  acceptance:
  - Vault enrollment generates and grants read access to a center identity salt only for centers listed
    in hubPki.sharedIdentityCenters; all other centers receive neither.
  - File-free central salt launch stays disabled before secret access or network activity; Nix rejects
    identitySaltViaSecretSpec.
  - Preserve established local salts and records; no automatic generation, rotation or deletion.
  required: true
  verification:
    kind: manual
    instructions: Run focused boundary regression tests and type checks before coordinated deployment.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: '44 tests passed in 64.86s: retired central launcher/provisioner, retained local salt
        provisioning, Nix option rejection and recorded Vault enrollment without salt generation/read
        grants. Focused Pyright and Ruff passed; docs:check and six-family catalog passed.'
    note: Evidence predates the 2026-10-22 opt-in shared salt for university_hospital_wuerzburg; reassess
      with the new allowlist tests before relying on it. Source restriction only. No host activation,
      existing Vault policy reconciliation, secret revocation, or rotation performed.
    assessed_by: codex-hash-boundary-20261019
