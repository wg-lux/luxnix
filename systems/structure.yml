version: 1
tier: domain
path: systems
parent: ../structure.yml
summary: Snowfall host entry points and adjacent host-owned hardware or disk configuration.
responsibilities:
  - Compose per-host module options and local hardware
  - Consume generated inventory and template output
boundaries:
  - Do not import reusable modules directly across host entry points
  - Regenerate Autoconf-managed default.nix files from canonical inputs
entrypoints:
  - name: encrypted-layout
    file: x86_64-linux/encrypted-layout.nix
    purpose: Apply the shared LUKS2 root and stage-2 data policy to host-owned disk layouts; legacy mode is migration-only.
  - name: gc-10-local-backup-exports
    file: x86_64-linux/gc-10/backup-exports.nix
    purpose: Bind only annotation exports to the operator-authorized local Backup disk with UUID validation and fail-closed automount access.
  - name: shared-baseline
    file: x86_64-linux/host-common.nix
    purpose: Inspect shared baseline ownership and interfaces.
  - name: isolated-test-host
    file: x86_64-linux/lx-test/default.nix
    purpose: Inspect isolated test host ownership and interfaces.
dependencies:
  internal:
    - modules/nixos
    - ansible
    - conf
  external:
    - Snowfall
    - NixOS
    - disko
submodules: []
contracts:
  - name: architecture
    doc: ../docs/architecture.md
  - name: README
    doc: x86_64-linux/lx-test/README.md
tests:
  directory: ../tests
  command: python -m pytest -q tests/test_repository_architecture_contract.py
