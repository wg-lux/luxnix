[project]
dependencies = [
  "cryptography>=44.0.0",
  "pydantic>=2.10.4",
  "pyyaml>=6.0.2",
  "ruamel-yaml>=0.18.10",
]

description = "Utilities for Luxnix Administration"
name = "lx-administration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "0.1.0"

# Controller-only Vault/Autoconf/playbook support is never required by a storage node.
[project.optional-dependencies]
controller = [
  "ansible>=11.1.0",
  "jinja2>=3.1.5",
  "passlib>=1.7.4",
  "psycopg[binary]>=3.2.4",
]

[dependency-groups]
test = [
  "pytest>=8.4.1",
  "pexpect>=4.9.0",
  # Exercise the separately packaged terminology service and wheel installer.
  "flask>=3.1.2",
  "pip>=22.2",
]
docs = ["myst-parser[linkify]>=4.0.0", "sphinx>=8.1.3"]
profiling = ["pyinstrument>=5.1.3", "icecream>=2.1.4"]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "lx-administration[controller]",
  "black>=23.7.0",
  "ruff==0.14.14",
  "djlint>=1.36.4",
  "mypy>=1.16.0",
  "types-pyyaml>=6.0.12.20250516",
]

[project.scripts]
lx-hub-storage-node = "lx_administration.storage.data_plane:main"

[tool.setuptools]
packages = ["lx_administration"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
lint.ignore = []
lint.select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["result", "result-*", ".git"]

[tool.uv.sources]
lx_administration = {workspace = true}
