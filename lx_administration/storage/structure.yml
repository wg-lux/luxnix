version: 1
tier: package
path: lx_administration/storage
parent: ../structure.yml
summary: Storage management and hub data-plane interfaces.
responsibilities:
  - Manage storage paths and mounts through explicit calls
  - Validate hub envelopes and data-plane contracts
boundaries:
  - Do not mount or alter live storage during context validation
  - Preserve encrypted storage and hub authentication boundaries
entrypoints:
  - name: recovery-export
    file: recovery_export.py
    purpose: Share explicit optimized-Python-safe validation and private publication of encrypted recovery records.
  - name: migration-policy
    file: migration_policy.py
    purpose: Validate canonical writer and source coverage for snapshots and backup transport.
  - name: migration-policy-input
    file: migration-policy.yml
    purpose: Declare reviewed migration hosts, protected source mounts and application writer units.
  - name: independent-recovery-custody
    file: recovery_custody.py
    purpose: Prepare dedicated age identities and verify independently decryptable recovery envelopes without replacing originals.
  - name: boot-migration
    file: boot_migration.py
    purpose: Bind explicit LUKS2 fresh/migration plans to hardware checks, reviewed evidence and idempotent install-only actions.
  - name: storage-readiness
    file: readiness.py
    purpose: Collect observations or reject incomplete host, layout and disk-identity admission without changing storage.
  - name: migration-archive
    file: migration_archive.py
    purpose: Shared streaming encryption and authenticated archive verification, including RAM-only identity use for host-local backup recovery.
  - name: migration-snapshot
    file: snapshot.py
    purpose: Quiesce selected application writers, preserve read-only Btrfs snapshots and restore prior service state.
  - name: migration-backup
    file: migration_backup.py
    purpose: Stream inventory-scoped snapshots into authenticated age archives without deleting or restoring storage.
  - name: boot-storage
    file: boot.py
    purpose: Read-only actual mount identity, Btrfs member and protected key checks before activation or consumers.
  - name: login-access
    file: login_access.py
    purpose: Coordinate root-only OpenBao login credentials, guarded service startup and non-forced storage locking.
  - name: cutover
    file: cutover.py
    purpose: Background pre-copy and short-stop cutover into encrypted storage without modifying sources.
  - name: bao-migration
    file: bao_migration.py
    purpose: Idempotent allowlisted KV v2 provisioning with CAS and verified target-only operation after Vault retirement.
  - name: openbao-local
    file: openbao_local.py
    purpose: Validate explicit TPM admission or passphrase-wrapped seals with authenticated runtime staging; never initialize state at boot.
  - name: storage-provision
    file: provision.py
    purpose: Preserve existing recovery escrow and bound passphrase container provisioning to gc-09/gc-10 migration; reject alternative enrollment.
  - name: storage-provision-setup
    file: provision_setup.py
    purpose: Interactive, resumable operator guide that runs read-only prerequisite checks and delegates every change to storage-provision after typed confirmation.
  - name: tpm-release
    file: tpm_release.py
    purpose: Create and verify the non-exportable TPM client identity and fetch one volume release over mTLS.
  - name: operator-migration
    file: operator_migration.py
    purpose: >-
      Unlock existing containers, explicitly provision escrowed new volumes
      and verify resumable copies without formatting at startup or overwriting storage.
  - name: manager
    file: manager.py
    purpose: Inspect manager ownership and interfaces.
  - name: data-plane
    file: data_plane.py
    purpose: Inspect data plane ownership and interfaces.
  - name: envelopes
    file: envelope.py
    purpose: Inspect envelopes ownership and interfaces.
dependencies:
  internal:
    - modules/nixos
  external:
    - cryptography
    - mTLS
    - filesystem mounts
submodules: []
contracts:
  - name: hardware-setup
    doc: ../../docs/hardware-setup.md
tests:
  directory: ../../tests/storage_manager
  command: python -m pytest -q tests/storage_manager
