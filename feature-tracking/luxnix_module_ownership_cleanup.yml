schema_version: '1.0'
id: luxnix_module_ownership_cleanup
name: Nix module ownership cleanup
description: Consolidate scattered Nix configuration and make module ownership explicit.
owners:
- LuxNix maintainers
production_critical: false
tracking:
  state: active
  history: []
source_documents:
- path: AGENTS.md
  disposition: reference
  note: Package ownership and validation policy.
definition_of_done:
- id: nvidia_driver_selection
  category: functionality
  title: NVIDIA driver selection is explicit across all hosts
  acceptance:
  - The shared driver branch defaults to production; PRIME and standard modules inherit it and accept
    only stable, beta, or production.
  - Each enabled module selects the configured branch from its host kernel package set; simultaneous modules
    reject conflicting branches.
  - Regression tests evaluate every exported host and explicit branch overrides without activating any
    system.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/test_nvidia_driver_selection.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'tests/test_nvidia_driver_selection.py: 13 branch-selection/conflict/invalid-value tests
        passed; all 16 hosts had matching NVIDIA branches and packages, with an unrelated s-04 Hub CRL
        assertion blocking the initial broad assertion check. Scoped fleet rerun pending.'
    - kind: test
      reference: '2026-09-23: 13 branch-selection/conflict/invalid-value tests passed; final scoped fleet
        regression passed for all 16 exported hosts (1 passed, 1 warning, 98.56s). Warning preserves unrelated
        s-04 Hub CRL assertion. Total 14 distinct regression tests passed across focused runs.'
    - kind: command
      reference: devenv tasks run docs:check passed; changed Nix modules parsed successfully; nixfmt check
        for NVIDIA modules, Ruff check/format for regression tests, git diff --check and tracker validation
        passed. gc-10 nix eval selects production 595.71.05.
    note: NVIDIA configuration contract verified locally; no builds, deployments, GPU runtime tests or
      host restarts. s-04 still has an unrelated authenticated HTTPS CRL endpoint/crlTlsCaFile assertion
      that prevents full deployment readiness.
    assessed_by: codex-gc10-hls-20260923
    assessed_at: '2026-09-23T06:54:45.191325Z'
- id: duplicate_definitions_removed
  category: requirements
  title: Duplicate definitions are removed or justified
  acceptance:
  - Shared behavior has one canonical module owner.
  - Host-only and service-only settings are not duplicated across unrelated roles.
  - Intentional compatibility definitions carry an explanatory comment.
  required: true
  verification:
    kind: manual
    instructions: Review module and host definitions for repeated options, package declarations, and service
      settings.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: modules/nixos/roles/base-server/default.nix; common/default.nix; duplicate ownership
        search passed
    - kind: test
      reference: tests/test_repository_architecture_contract.py
    - kind: review
      reference: modules/nixos/cli/programs/nix-ld/default.nix; modules/nixos/roles/custom-packages/default.nix;
        modules/nixos/roles/base-server/default.nix
    assessed_by: codex-module-cleanup-20260831-b1
    assessed_at: '2026-08-31T14:18:00.108012Z'
- id: todos_are_actionable
  category: functionality
  title: Outstanding TODOs have actionable ownership
  acceptance:
  - Each retained TODO states the reason, intended owner, and next action.
  - Completed or obsolete TODOs are removed.
  required: true
  verification:
    kind: command
    command:
    - rg
    - --line-number
    - TODO|FIXME
    - --glob
    - '*.nix'
    timeout_seconds: 60
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: rg -n 'TODO|FIXME|CHANGEME' modules/nixos -g '*.nix'
    note: All retained modules/nixos TODOs now name an owner and next action; TODOs outside this worker
      scope still require review.
    assessed_by: codex-module-cleanup-20260831-b1
    assessed_at: '2026-08-31T14:18:02.855455Z'
- id: package_ownership_is_centralized
  category: security
  title: Package ownership is centralized
  acceptance:
  - Shared development packages have one canonical definition.
  - Service modules declare only hard runtime dependencies.
  required: true
  verification:
    kind: manual
    instructions: Review package declarations against AGENTS.md and custom-packages ownership rules.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: modules/nixos/roles/custom-packages/README.md; canonical package search passed
    - kind: test
      reference: tests/test_repository_architecture_contract.py
    - kind: document
      reference: modules/nixos/roles/custom-packages/README.md
    assessed_by: codex-module-cleanup-20260831-b1
    assessed_at: '2026-08-31T14:18:01.038908Z'
- id: module_boundaries_are_documented
  category: documentation
  title: Module boundaries are documented
  acceptance:
  - Shared, host-only, and service-specific module responsibilities are documented.
  required: true
  verification:
    kind: manual
    instructions: Review module README files and architecture documentation for ownership boundaries.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: modules/nixos/roles/custom-packages/README.md
    assessed_by: codex-cleanup-20260831-a7
