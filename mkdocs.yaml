---
site_name: LuxNix Documentation
site_description: LuxNix NixOS deployment and operations documentation
site_author: LuxNix Contributors
site_url: https://github.com/wg-lux/luxnix

repo_name: wg-lux/luxnix
repo_url: https://github.com/wg-lux/luxnix
edit_uri: "edit/main/docs/"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github-alt
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: ./docs
exclude_docs: |
  Luxnix_Setup.excalidraw.md
  Nixicle reference/
  vault-rebuild-ceremony-2026-08-11.md

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
#   - macros:
#       include_dir: docs/_snippets

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Operator Change Notes: changelog.md
  - Start Here:
