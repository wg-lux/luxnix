---
site_name: LuxNix Documentation
site_description: LuxNix NixOS deployment and operations documentation
site_author: LuxNix Contributors
site_url: https://github.com/wg-lux/luxnix

repo_name: wg-lux/luxnix
repo_url: https://github.com/wg-lux/luxnix
edit_uri: "edit/main/"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github-alt
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: ./docs
exclude_docs: |
  Luxnix_Setup.excalidraw.md
  Nixicle reference/

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
#   - macros:
#       include_dir: docs/_snippets

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Development: development.md
      - Nix Quality: nix-quality.md
      - Autoconf and Local Inventory: autoconf.md
  - Architecture:
      - System Architecture: architecture.md
      - Network Architecture: network-architecture.md
      - Network Resolution: network-resolution.md
      - Database Ownership: database-ownership.md
      - Access Management: access-management.md
  - Deployment and Testing:
      - Deployment Guide: deployment-guide.md
      - Hardware Setup: hardware-setup.md
      - Virtualization: virtualization-guide.md
      - SSH Host Identity: ssh-host-identity.md
      - Configuration Tests: testing-nixtests.md
  - Services:
      - Service Module Pattern: deploying-services-lx-annotate-style.md
      - lx-annotate Encrypted Data: lx-annotate-encrypted-data.md
      - lx-annotate Secure HLS: lx-annotate-secure-hls.md
      - lx-annotate Cluster Readiness: lx-annotate-cluster-readiness.md
  - Vault:
      - Setup and Bootstrap: vault-setup.md
      - Machine Enrollment: vault-hub-machine-enrollment.md
      - Owner Actions: vault-owner-immediate-actions.md
  - Clinical Operations:
      - Central Hub Transfer: clinical-hub-transfer-guide.md
