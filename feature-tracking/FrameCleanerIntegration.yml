    assessed_by: codex-endoreg-binaries-01a1398f
    assessed_at: '2026-10-14T09:37:46.945603Z'
- id: deployed_invocation
  category: functionality
  title: The deployed entry point preserves the attempt-scoped processing contract
  acceptance:
  - One deployed invocation processes one immutable source into one unpublished attempt-owned candidate.
  - Caller-selected input and candidate paths cross the packaged application boundary unchanged.
  required: true
  verification:
    kind: manual
    instructions: Exercise the packaged FrameCleaner entry point with an immutable fixture and inspect
      the unpublished candidate path.
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: deployment_smoke_coverage
  category: testing
  title: Deployment behavior has focused reproducible coverage
  acceptance:
  - A focused smoke check covers the CPU deployment profile and the configured accelerated profile where
    enabled.
  - The check fails when FFmpeg, FFprobe, or the typed lx-dtypes contract is unavailable.
  required: true
  verification:
    kind: manual
    instructions: Run the packaged FrameCleaner smoke checks against the evaluated target closure and
      record exact package versions and results.
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: ownership_boundary
  category: security
  title: Deployment preserves attempt ownership and fail-closed publication
  acceptance:
  - Each concurrent attempt constructs a separate FrameCleaner instance.
  - Caller-selected immutable input and attempt-owned candidate paths cross the service boundary unchanged.
  - A failed or cancelled invocation cannot publish a partial candidate as canonical media.
  required: true
  verification:
    kind: manual
    instructions: Review the deployed endoreg-db invocation path against the video import concurrency
      contract and its focused tests.
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: deployment_contract_documented
  category: documentation
  title: Package compatibility and ownership boundaries are documented
  acceptance:
  - The deployed lx-anonymizer and lx-dtypes compatibility set is reviewable before activation.
  - Documentation states that LuxNix supplies packages and runtime capabilities but does not own attempts,
    retries, publication, or cleanup.
  required: true
  verification:
    kind: manual
    instructions: Review the feature specification and publishing documentation against the evaluated
      deployment boundary.
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
