# Native host operations deliberately run outside the Devenv shell.
native_commands:
  - id: luxnix-normalize-storage
    summary: Preview and explicitly retire matching legacy native mount overrides so declared encrypted storage mounts take over.
    risk: local-state
    operator_confirmation_required: true
    usage: sudo luxnix-normalize-storage [--apply]
    execution_context: Run on the selected legacy-container host in a private terminal during a stopped-writer maintenance window.
    implementation: lx_administration/storage/operator_migration.py
    documentation: docs/legacy-storage-recovery.md
    effects:
      - Requires matching generated replacements, stopped guarded writers and typed hostname confirmation before changes.
      - Keeps private backups, reloads systemd and restores native overrides if replacement verification fails; never moves data or changes keys or mounts.

  - id: install-prepared-encrypted-system
    summary: Install a reviewed closure onto prepared storage in its explicitly selected root-encryption mode from trusted installer media.
    risk: destructive-local
    operator_confirmation_required: true
    usage: python -m lx_administration.storage.boot_migration install --state <private-state-directory>
    implementation: lx_administration/storage/boot_migration.py
    documentation: docs/boot-storage-migration.md
    prerequisites:
      - Mode-appropriate recovery evidence, exact disk identities and complete required target mounts; fresh installation requires verified empty new disks.
      - Administrator credentials staged; migration additionally requires restored identities, application keys and consistent data on protected storage.
      - Run the guarded installer from trusted media; direct nixos-install bypasses the evidence workflow and is not the supported migration entrypoint.
    effects:
      - Installs the boot configuration; does not authorize formatting or rerunning a disk phase.

  - id: setup-boot-password
    summary: Prompt privately to verify or add a root disk passphrase while retaining existing recovery slots.
    risk: sensitive-local-state
    operator_confirmation_required: true
    usage: sudo luxnix-setup-boot-password [--change]
    execution_context: Run interactively on the selected installed boot-LUKS host, using the target generation's command before detached activation.
    implementation: lx_administration/storage/boot_password.py
    documentation: docs/boot-storage-migration.md
    effects:
      - Prompts at the first boot or switch rebuild and after LUKS header changes; --change prompts explicitly.
      - Tests an existing password or adds a confirmed new password after verifying an existing recovery credential and backing up the header.
      - Stores only a private host/UUID/header-bound verification receipt; never stores a password or removes keyslots.
      - A missing private terminal blocks unprepared activation before bootloader changes; builds and dry activation do not enroll credentials.

  - id: rebuild-host-switch
    summary: Persist and activate the reviewed configuration using native NixOS switching.
    risk: remote-state
    operator_confirmation_required: true
    usage: sudo nixos-rebuild switch --flake '<checkout>#<host>'
    execution_context: Run on the selected host; the checkout must contain the reviewed compatible application version.
    verification:
      - Require exit status zero and matching /run/current-system and /nix/var/nix/profiles/system targets.
      - Check bootloader default and one-shot overrides; after an authorized reboot, verify /run/booted-system matches the intended closure.
    implementation: modules/home/cli/shells/shared/default.nix
    documentation: docs/deployment-guide.md
    prerequisites:
      - Explicit checkout and host; reviewed revision and locked inputs; successful build and connectivity checks.
      - Retain SSH session and verify fresh access after activation; console recovery for access-affecting changes.
    effects:
      - Updates the persistent system profile and boot default and activates services.
      - The nho alias uses LUXNIX_FLAKE and LUXNIX_HOST; no intermediate test activation.
      - Boot-LUKS passphrase setup prompts interactively if its verified host/header receipt is absent or stale.

  - id: rebuild-host-boot
    summary: Stage the reviewed configuration for the next boot without live activation.
    risk: remote-state
    operator_confirmation_required: true
    usage: sudo nixos-rebuild boot --flake '<checkout>#<host>'
    implementation: modules/home/cli/shells/shared/default.nix
    documentation: docs/deployment-guide.md
    effects:
      - Updates the system profile and boot default; running services retain their configuration.
      - The nhb alias uses LUXNIX_FLAKE and LUXNIX_HOST; reboot is a separate authorized action.
