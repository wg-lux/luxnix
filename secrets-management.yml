baseline_verification:
  - command: uv run pytest -q
    result: Exit 1; 643 passed, 2 failed in 747.21 seconds. The full run collected before the final three focused regression cases were added; the
      final focused run below includes those cases.
    failures: &id001
      - test: tests/lx-annotate/test_lx_annotate_filewatcher_wheel_key_env.py::test_runtime_exports_ffmpeg_transcode_timeout_to_wheel_services
        detail: Expects the literal ffmpegTranscodeTimeoutSeconds assignment to be 86400 in the runtime sources.
      - test: tests/test_nixtests.py::test_nixtest_suite_passes
        detail: Embedded nix run .#nixtests -- --workers 1 returned 2; 38/39 contracts passed. The failing enrollment contract requires gc-05 host
          YAML to contain vault.client.auth.deferUntilProvisioned set to true.
    disposition: Failing contracts and their relevant source inputs are unchanged from HEAD. Do not change host enrollment state or weaken a test
      solely to pass this run.
