---
- name: Deploy Secrets (Full Pipeline)
  hosts: managed
  gather_facts: false
  become: true
  become_user: admin

  tasks:
    - name: Verify secret source destination and temporary storage
      ansible.builtin.include_tasks: tasks/verify_secret_storage.yml
      vars:
        secret_controller_paths: ['{{ lx_vault_dir_src }}']
        secret_remote_paths: ['{{ lx_vault_psk }}', '{{ lx_vault_dir }}']

    - name: Copy PSK file
      ansible.builtin.copy:
        src: "{{ lx_vault_dir_src }}/psk/{{ inventory_hostname }}.psk"
        dest: "{{ lx_vault_psk }}"
        mode: "0600"
        owner: "{{ ansible_user }}"
      no_log: true

    - name: Find all secret files
      ansible.builtin.find:
        paths: "{{ lx_vault_dir_src }}/deploy/{{ inventory_hostname }}"
        recurse: true
      register: secret_files
      delegate_to: localhost

    # sops-nix owns these names on this host; copying them would replace its
    # symlinks with stale plaintext.
    - name: Read export names migrated to sops-nix
      ansible.builtin.command:
        argv:
          - nix
          - eval
          - --json
          - '.#nixosConfigurations.{{ inventory_hostname }}.config.security.sops.operatorStorageKey.applicationSecrets'
          - --apply
          - builtins.attrNames
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: sops_migrated_secrets

    - name: Deploy secrets individually
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ lx_vault_dir }}/{{ item.path | basename }}"
        mode: "0600"
        owner: "{{ ansible_user }}"
      loop: "{{ secret_files.files }}"
      when: (item.path | basename) not in (sops_migrated_secrets.stdout | from_json)
      no_log: true
      vars:
        ansible_vault_identity: "{{ inventory_hostname }}@{{ lx_vault_dir_src }}/psk/{{ inventory_hostname }}.psk"
