# Canonical ownership and execution map for repository tests.
schema_version: 1
pytest_root: tests
pytest_command: uv run pytest -q
python_suites:
  - id: repository
    path: tests
    scope: LuxNix Python unit, integration, and source-contract tests.
    command: uv run pytest -q
  - id: generator-contracts
    path: tests/test_autoconf_rendering.py
    scope: Non-evaluating Autoconf and boot-renderer contracts.
    command: devenv tasks run nix-quality:generators
  - id: tracker
    path: feature-tracking/test_tracker.py
    scope: Feature-tracking schema, lock, message, and orchestration contracts.
    command: uv run pytest -q feature-tracking/test_tracker.py
  - id: repository-cleanup
    path: feature-tracking/test_repository_cleanup.py
    scope: Retired artifacts, preserved sources, ignored local output, and stale references.
    command: uv run pytest -q feature-tracking/test_repository_cleanup.py
  - id: cuda-probes
    path: scripts/cuda
    scope: Optional CUDA environment probes, outside the default pytest suite.
    command: devenv tasks run env:setup-cuda
nix_suites:
  - id: boot-storage
    path: tests/nixtest/boot_storage_vm_test.nix
    scope: Cold boot root unlock, stage-2 data unlock, key retention and failure behavior on disposable disks.
    command: nix build .#checks.x86_64-linux.boot-storage --no-link -L
  - id: storage-login-access
    path: tests/nixtest/storage_login_access_vm_test.nix
    scope: Real PAM/OpenBao/LUKS login unlock, remote locking, private roots and cold boot.
    command: nix build .#checks.x86_64-linux.storage-login-access --no-link
  - id: root-integrity
    path: tests/nixtest/root_integrity_vm_test.nix
    scope: Isolated dm-verity store boot and tamper prototype; no hardware or production acceptance.
    command: devenv tasks run tests:root-integrity-vm
  - id: nixtest
    path: tests/nixtest
    scope: Vault, SSH reachability, and lx-annotate safety contracts.
    command: nix run .#nixtests -- --workers 1
  - id: configuration
    path: tests/run-configuration-tests.sh
    scope: Evaluation and no-link builds for every exported NixOS host.
    command: ./tests/run-configuration-tests.sh
independent_projects:
  - id: wg-lux-mcp
    path: wg-lux-mcp/tests
    scope: Nested MCP service tests with the nested project's dependencies.
    command: cd wg-lux-mcp && uv run pytest -q
