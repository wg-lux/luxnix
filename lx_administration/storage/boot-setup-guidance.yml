# These are human assessments, never automatic proof or permission to erase.
console_boot_tested: At the selected host, test the physical console, keyboard and firmware boot menu. Confirm you can select recovery media without relying on SSH.
trusted_installer_tested: Boot a trusted RAM recovery environment on this machine without starting installation; signed LuxNix one-shot boot or NixOS installer media can provide it. Confirm it sees the system disk and can access the chosen recovery source, then return to the known-working installed generation to record the result. For a connected recovery drive, rerun setup-media after reboot to remount it.
independent_credentials_tested: Test administrator login and sudo. Confirm required recovery credentials are accessible independently of the system disk being encrypted; do not put passwords in the evidence notes.
vault_recovery_tested: STOP if the only vault or its unlocking key is on a selected disk. The migration guide runs secret preflight before this assessment; its receipt covers only this host's required credentials, not a data backup or application restore. If it failed, resolve its reported missing source or custody item before rerunning the guide. Follow the Vault recovery section in docs/boot-storage-migration.md. From independent protected recovery storage, test access to the original administrator password/hash pair and required application keys/salts. Preserve local Vault files, controller Ansible Vault and its unlock key, and HashiCorp Vault recovery/access material where applicable; a remote Vault address or a copied encrypted file alone is not proof. Record the applicable stores, recovery locations and actual recovery test results without secret contents. Keep the original password hash to preserve login; do not bootstrap or rotate passwords to pass this check.
in_place_backup_acknowledged: Where is your recovery backup, on a connected drive or a remote backup service, and how did you test restoring it? A connected drive is expected, but a remote backup is also valid when its network access and credentials work from the recovery environment independently of the root disk. The durable migration journal still needs independent local storage. Make and test the backup before encrypting; bad RAM or a failing disk can damage data during conversion. Record data coverage, consistency, required keys and the restore test without passwords. If you decide to go without a backup, name who accepted that risk; this records a risk decision, never a verified backup or data recoverability. Credential custody and the migration journal do not replace a data backup.
plaintext_remnants_reviewed: Old unencrypted copies can stay physically readable on SSD flash after in-place encryption. Confirm patient data was only ever stored in encrypted containers on this host, not on the plaintext root, in home folders, logs or temp files. If it was on the plaintext root, stop for a separate data-remanence review. This workflow does not erase old flash contents and offers no formatting fallback.
container_data_consolidated: Confirm the data from every old container is at its normal path on the encrypted root and that the old container files are still present and untouched. Do not delete them yet; retire-containers is available only after physical acceptance.
target_layout_reviewed: Review every prepared mount, filesystem and selected disk against the saved plan.
recovery_slots_tested: Test the independent LUKS recovery credentials for the newly prepared volumes.
boot_artifacts_reviewed: Review the bootloader, initrd, root unlock configuration and boot-password receipt for this exact target.
offline_cold_boot_passed: Cold-boot the installed machine without network-dependent root unlock and test local disk unlock and account selection/login.
secondary_unlock_passed: Verify every configured secondary encrypted volume unlocks and mounts correctly after boot.
application_verified: Verify application startup, authenticated access and decryption of required existing data.
failure_tests_passed: Verify required missing-key, missing-storage and unavailable-secret scenarios stop affected consumers safely.
recovery_test_passed: Demonstrate recovery using the independent media and credentials, retaining the recovery copies afterward.
partial_install_reviewed: Inspect the actual partial installation, boot files and prepared mounts; record what completed and what failed.
safe_to_retry_install_only: Confirm only the pinned install-only operation can safely be repeated; no repartitioning or formatting is permitted.
