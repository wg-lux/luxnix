version: 1
tier: package
path: lx_administration/storage
parent: ../structure.yml
summary: Storage management and hub data-plane interfaces.
responsibilities:
  - Manage storage paths and mounts through explicit calls
  - Validate hub envelopes and data-plane contracts
boundaries:
  - Do not mount or alter live storage during context validation
  - Preserve encrypted storage and hub authentication boundaries
entrypoints:
  - name: boot-storage
    file: boot.py
    purpose: Read-only actual mount identity, Btrfs member and protected key checks before activation or consumers.
  - name: login-access
    file: login_access.py
    purpose: Coordinate root-only OpenBao login credentials, guarded service startup and non-forced storage locking.
  - name: cutover
    file: cutover.py
    purpose: Background pre-copy and short-stop cutover into encrypted storage without modifying sources.
  - name: bao-migration
    file: bao_migration.py
    purpose: Idempotent allowlisted KV v2 provisioning with CAS and verified target-only operation after Vault retirement.
  - name: openbao-local
    file: openbao_local.py
    purpose: Validate explicit TPM admission or passphrase-wrapped seals with authenticated runtime staging; never initialize state at boot.
  - name: storage-provision
    file: provision.py
    purpose: Escrow recovery in the existing encrypted admin vault and an independent host before explicit local or SSH-targeted passphrase, TPM or local OpenBao provisioning.
  - name: tpm-release
    file: tpm_release.py
    purpose: Create and verify the non-exportable TPM client identity and fetch one volume release over mTLS.
  - name: operator-migration
    file: operator_migration.py
    purpose: > Unlock existing containers, explicitly provision escrowed new volumes
          and verify resumable copies without formatting at startup or overwriting storage.
  - name: manager
    file: manager.py
    purpose: Inspect manager ownership and interfaces.
  - name: data-plane
    file: data_plane.py
    purpose: Inspect data plane ownership and interfaces.
  - name: envelopes
    file: envelope.py
    purpose: Inspect envelopes ownership and interfaces.
dependencies:
  internal:
    - modules/nixos
  external:
    - cryptography
    - mTLS
    - filesystem mounts
submodules: []
contracts:
  - name: hardware-setup
    doc: ../../docs/hardware-setup.md
tests:
  directory: ../../tests/storage_manager
  command: python -m pytest -q tests/storage_manager
