# Current storage contract. Historical acceptance material is not an installer gate.
schema_version: 1
architecture: manual-boot-luks2
default_workflow: fresh
runbook: docs/boot-storage-quickstart.md
historical_catalog: boot-encryption-acceptance.yml
baseline:
  - One operator passphrase unlock for root; no TPM or central service required at boot.
  - The passphrase always remains valid; an enrolled USB key is an optional additional keyslot, never a replacement.
  - Secondary keys remain on encrypted root, outside the initrd.
  - Protected services verify actual encrypted backing devices before writing.
  - Disk installation never rotates application keys or identities.
workflows:
  fresh:
    command: devenv shell luxnix --profile <administrator-profile.yml>
    implementation: lx_administration/storage/fresh_install.py
    scope: GPT system disk with EFI and LUKS2 Btrfs root, plus independent LUKS2 Btrfs data disks; manual root console unlock.
    profile: Explicit fresh/new-disks or disposable/discard-approved selection for this operation.
    prerequisites:
      - Clean durable release with locked inputs and administrator-prepared hardware profile.
      - Prepared account and application credentials on independent encrypted media.
      - Administrator password verified before disk changes; disk passphrase retained off-machine.
      - Actual target UUID, disk serial and size verified in the live installer.
      - Explicit typed approval of the displayed erasure.
    excludes:
      - Migration backup and old-data restore attestations for intentionally discarded contents.
      - Implicit disposal of any data, keys or identities still required elsewhere.
      - Automatic retry of formatting, unattended unlock and signed first installation.
    recovery:
      command: <prepared-bundle>/bin/luxnix-install --state <original-state> --credentials <original-credentials> --resume
      apply: Add --apply to continue after the read-only recovery preview.
      behavior: Verify the original plan, hardware, mounted filesystem identities and existing credentials; copy only missing credentials and retry the same system installation without Disko.
      limit: Missing verified storage checkpoints or conflicting credentials stop recovery; incomplete formatting never authorizes another erase.
    acceptance:
      - Installation completes against the matching closure and verified encrypted mounts.
      - Cold boot, unlock, administrator login and application initialization are verified separately.
      - Recovery access and required application credentials remain available off-machine.
  existing:
    command: devenv shell luxnix inspect <host>
    behavior: Read-only verification of configured live mounts, secondary keys and administrator hash.
    configuration: Apply matching configuration through the existing deployment workflow after inspection.
    routing: migrate stops on a host whose live root is already LUKS2 and has no migration plan, and names this command; there is nothing to convert.
  preservation:
    command: devenv shell luxnix migrate
    implementation: lx_administration/storage/boot_setup.py
    behavior: Preserve existing data with the established in-place conversion and recovery journal.
    prerequisites: Existing recovery, backup, identity preservation and acceptance requirements remain applicable.
    multidisk: Encrypt independent Btrfs partitions in place; preserve filesystem identities and source containers, with data keys on encrypted root.
    excludes: MD arrays and multi-member Btrfs conversion.
remote_unlock:
  laptop_guide: docs/remote-unlock-laptop.md
  scope: Opt-in per host; no deployed host has it enabled or physically accepted yet.
  locked_root: ssh -tt -p 2222 root@<early-boot address> reaches the dedicated initrd SSH endpoint, which only accepts the root passphrase.
  after_boot: sudo luxnix-operator-storage start opens secondary storage and starts guarded services in a normal SSH session. It needs a booted system and cannot unlock root.
  without_remote_unlock: A reboot or power loss leaves the host unreachable until someone types the passphrase at its console.
  enable_on_encrypted_host:
    - Deploy a generation containing luxnix-setup-remote-unlock, then run sudo luxnix-setup-remote-unlock; it creates the initrd host identity once on verified encrypted root and prints the known_hosts line.
    - Set storage.operatorUnlocked.remoteUnlock in the host inventory, regenerate, and install with boot; a missing identity stops the switch.
    - With an operator at the console as fallback, reboot and unlock once over the real management network before relying on it.
  requirements:
    - Reachable wired management interface, static address and verified NIC drivers on every host.
    - Explicit allowed source addresses and dedicated operator keys, with pinned initrd host identity.
    - The normal OpenVPN overlay cannot provide connectivity before root unlock; off-site operators jump through an allowed host on the same LAN that is itself running.
    - Not available together with controller-signed Secure Boot.
  fleet_status: Host-specific management inputs and physical acceptance remain required; do not infer readiness from helper availability.
  physical_acceptance:
    initial_targets: [gc-02, gc-09]
    evidence: Private controller observations under cmdb/boot-access-checks; never commit host facts or passwords.
    stages:
      baseline:
        - Verify mounted root is cryptroot and running, booted, persistent and default boot generations match; inspect any one-shot override.
        - List the installed initrd to establish whether SSH is actually included; helper presence and a running normal SSH server are not sufficient.
        - Test normal SSH from the intended operator and jump hosts before relying on it for access after boot.
      private_operator_checks:
        - Run sudo luxnix-verify-boot-storage on the installed host.
        - Resolve the mounted cryptroot backing device and run cryptsetup open --type luks2 --test-passphrase against that exact device in a private root terminal; do not enroll or remove keyslots.
      candidate_admission:
        - Require an operator present at the console, verified disk passphrase, working keyboard/display and a preserved compatible boot entry.
        - Confirm a reachable management LAN, reserved static address, exact NIC and drivers, allowed source addresses and independently running jump host.
        - Provision and pin the dedicated initrd host identity; use explicit dedicated operator public keys and a signing-compatible reviewed release.
        - Build and inspect the exact candidate initrd, normal SSH access and storage contract before requesting approval for boot staging or reboot.
      ram_boot_smoke_test:
        - Start the host-bound kexec RAM bundle from the selected running host, with a separate controller and an operator at its physical screen.
        - Pin the runtime host identity before the switch and verify the controller key is authorized; keep normal boot defaults and target storage unchanged.
        - Require a visible migration banner on the physical display and a strictly verified SSH connection reporting the expected migration hostname and tmpfs root.
        - Record a black screen as a failed display test even when SSH works; a RAM boot is not acceptance of the installed generation's root unlock.
      attended_boot:
        - Test one host at a time, keeping the operator or jump host running; record the candidate closure and boot entry before proceeding.
        - Unlock through strictly pinned initrd SSH while the console operator watches; use console recovery if that path fails.
        - After boot, reconnect through normal SSH and verify root, secondary storage, generation identity, administrator access and guarded services.
        - Record observed results and failures; physical acceptance remains pending until every required check passes on that host.
usb_key_unlock:
  status: Experimental opt-in per host; VM-tested only, no physical acceptance yet.
  behavior: With the enrolled stick inserted at boot, root unlocks without input. Without it, or with a rejected key, the passphrase prompt appears after the wait.
  enroll: sudo luxnix-setup-usb-unlock <USB partition> creates one random key file per host on an existing ext4 or vfat stick, adds it as an extra keyslot after the passphrase and prints the inventory values. Nothing is formatted and no slot is removed.
  enable: Set storage.operatorUnlocked.usbKeyUnlock (enable, filesystemUuid, fsType) in the host inventory, regenerate and install with boot.
  risk:
    - The stick is a bearer credential; whoever holds it and the machine can read the disk.
    - A stick left in an unattended machine removes the protection against theft of that machine; this trades confidentiality for reachability.
    - Revoke a lost stick by removing its keyslot with the passphrase, then rerun sudo luxnix-setup-boot-password.
verification:
  python: uv run pytest -q tests/test_fresh_install.py tests/test_luxnix_cli.py
  vm: nix build .#checks.x86_64-linux.boot-storage-fresh --no-link -L
  multidisk_vm: >-
    nix build .#checks.x86_64-linux.boot-storage-fresh-multidisk
    .#checks.x86_64-linux.boot-storage-in-place-multidisk --no-link -L
  remote_vm: nix build .#checks.x86_64-linux.boot-storage-remote --no-link -L
  ram_display_vm: nix build .#checks.x86_64-linux.migration-kexec --no-link -L
  usb_key_vm: nix build .#checks.x86_64-linux.boot-storage-usb-key --no-link -L
  qualification: Repository tests do not establish physical host acceptance.
