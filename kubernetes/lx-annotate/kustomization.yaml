apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lx-annotate

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjobs.yaml

# Run bootstrap-job.yaml explicitly with kubectl create before or during a
# release. It uses metadata.generateName so every release can create a fresh
# migration/base-data job, and the Deployments wait for its release marker.
