schema_version: 1

# This file is the canonical, machine-readable Nix quality policy. Baselines
# describe the current debt ceiling, not a desired end state. Lower them after
# an intentional cleanup; never raise them merely to make the check pass.
scope:
  include_suffix: .nix
  exclude_directories:
    - .git
    - .devenv
  exclude_files:
    - .devenv.flake.nix
  flake_source_roots:
    - flake.nix
    - modules
    - systems
    - homes
    - lib
    - packages
    - overlays
    - shells
    - topology
    - tests/nixtest
  generated_patterns:
    - systems/x86_64-linux/*/default.nix
    - systems/x86_64-linux/*/boot-decryption-config.nix
    - homes/x86_64-linux/*/default.nix
  generated_exclude_patterns:
    # Deliberately hand-maintained integration host; see its README.
    - systems/x86_64-linux/lx-test/default.nix
    # No boot-stick generator is enabled for this host.
    - systems/x86_64-linux/c-01/boot-decryption-config.nix
    # Pre-provisioning placeholders contain no device UUID and cannot be
    # reproduced by the active renderer until an operator provisions a stick.
    - systems/x86_64-linux/gc-05/boot-decryption-config.nix
    - systems/x86_64-linux/gc-06/boot-decryption-config.nix
    - systems/x86_64-linux/gs-02/boot-decryption-config.nix
  generated_sources:
    - pattern: systems/x86_64-linux/*/default.nix
      canonical_sources:
        - autoconf/config.yml
        - ansible/inventory/hosts.ini
        - ansible/inventory/group_vars/
        - ansible/inventory/host_vars/
        - conf/nix-templates/systems/x86_64-linux/main/default.nix.j2
      safe_check: python3 scripts/autoconf-pipeline.py --check
      safe_render: >-
        python3 scripts/autoconf-pipeline.py --nix-output
        <new-directory-outside-repository>
    - pattern: homes/x86_64-linux/*/default.nix
      canonical_sources:
        - autoconf/config.yml
        - ansible/inventory/home-hosts.yml
        - ansible/inventory/group_vars/group_home_*.yml
        - ansible/inventory/host_vars/home/
        - conf/nix-templates/homes/x86_64-linux/default.nix.j2
      safe_check: python3 scripts/autoconf-pipeline.py --check
      safe_render: >-
        python3 scripts/autoconf-pipeline.py --nix-output
        <new-directory-outside-repository>
    - pattern: systems/x86_64-linux/*/boot-decryption-config.nix
      canonical_sources:
        - modules/nixos/luxnix/boot-decryption-stick/default.nix
        - modules/nixos/luxnix/boot-decryption-stick-gs-01/default.nix
        - modules/nixos/luxnix/boot-decryption-stick-gs-02/default.nix
        - modules/nixos/luxnix/boot-decryption-stick/render-boot-decryption-config.nix
        - modules/nixos/luxnix/boot-decryption-stick/render-boot-decryption-config.sh
      safe_check: >-
        bash -n
        modules/nixos/luxnix/boot-decryption-stick/render-boot-decryption-config.sh
      safe_render: >-
        luxnix-render-boot-decryption-config --output <new-file-outside-repository>
        --usb-uuid <uuid> --offset-bytes <bytes> --keyfile-size <bytes>
        --luks-device <mapping-name>
      note: >-
        Generated by device-mutating setup scripts, which delegate their final
        render step to the shared pure renderer. The renderer requires explicit
        values, writes only its explicit output path, and never touches devices
        or key material.

formatter:
  command: nixfmt
  rationale: >-
    nixfmt is already used by the development environment and editor
    configuration. Alejandra remains available for legacy/manual use but is not
    a repository quality gate.

checks:
  flake_source_visibility:
    command: [git, ls-files, --others, --exclude-standard, --]
    accepted_exit_codes: [0]
    baseline:
      max_untracked_files: 0
  nix_parse:
    command: [nix-instantiate, --parse]
    accepted_exit_codes: [0]
  deadnix:
    command: [deadnix, --output-format, json, .]
    accepted_exit_codes: [0]
    baseline:
      max_findings: 0
      max_non_generated_findings: 0
  statix:
    command: [statix, check, --format, json, .]
    accepted_exit_codes: [0, 1]
    baseline:
      max_findings: 0
      max_non_generated_findings: 0
  nixfmt:
    accepted_exit_codes: [0, 1]
    baseline:
      max_unformatted_files: 0
      max_non_generated_unformatted_files: 0
  flake_checker:
    command:
      - flake-checker
      - --no-telemetry
      - --check-outdated
      - --check-owner
      - --check-supported
      - --nixpkgs-keys
      - nixpkgs,nixpkgs-unstable
      - flake.lock
    accepted_exit_codes: [0]
    baseline:
      max_issues: 2
  flake_evaluation:
    command: [nix, flake, check, --no-build]
    accepted_exit_codes: [0]
    full_only: true

policy:
  default_mode: fast
  full_mode_flag: --full
  baseline_rule: Ratchet only; metrics may stay equal or decrease.
  generated_file_rule: Fix canonical YAML inputs or templates, then regenerate.
  automatic_fixing: disabled

