---
site_name: LuxNix Documentation
site_description: LuxNix NixOS deployment and operations documentation
site_author: LuxNix Contributors
site_url: https://github.com/wg-lux/luxnix

repo_name: wg-lux/luxnix
repo_url: https://github.com/wg-lux/luxnix
edit_uri: "edit/main/"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github-alt
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: ./docs

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
#   - macros:
#       include_dir: docs/_snippets

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

nav:
  - Introduction: index.md
  - Getting Started: getting-started.md
  - Deployment Guide: deployment-guide.md
  - Vault Setup: vault-setup.md
  - SSH Host Identity: ssh-host-identity.md
  - Hardware Setup: hardware-setup.md
  - Security: security.md
  - Service Architecture: service-architecture.md
  - User Management: user-management.md
