    reference: ansible/inventory/group_vars/operator_unlocked_secrets.yml
  - field: unlock_method
    working_tree: unlockMethod = "tpm2" nur für gc-10 über host_vars; Gruppen-Default ist passphrase
    reference: ansible/inventory/host_vars/gc-10.yml
  - field: root_filesystem
    head: Root von gc-10 ist unverschlüsseltes btrfs
    reference: systems/x86_64-linux/gc-10/disks.nix
  criterion_findings:
  - criterion: ENC-05
    status: not_met
    severity: blocking
    finding: Ein lokales OpenBao ist nicht implementiert. provision() legt einen systemd-tpm2-Token mit PCR 7 an;
      dieser öffnet den Container ohne OpenBao und widerspricht dem Profil.
    references:
    - lx_administration/storage/operator_migration.py
  - criterion: ENC-06
    status: open
    severity: blocking
    finding: Der verworfene Prototyp lud den Seal-Schlüssel per LoadCredentialEncrypted, prüfte aber nur die Länge
      von 32 Byte. Ein mit dem Host-Schlüssel verschlüsseltes Credential wäre mit einer Plattenkopie entschlüsselbar.
      Die Neuimplementierung braucht eine erzwungene TPM2-Versiegelung samt Negativtest.
    references:
    - docs/openbao-architecture.md
  - criterion: ENC-13
    status: not_met
    severity: blocking
    finding: unlockMethod erlaubt passphrase (Default) und tpm2; eine Inventar-Änderung stuft ohne Fehler herab, und
      unlock() enthält weiter die Passwortabfrage.
    references:
    - modules/nixos/luxnix/operator-unlocked-storage/default.nix
    - lx_administration/storage/operator_migration.py
  - criterion: ENC-23
    status: not_met
    severity: blocking
    finding: Alle drei Identity-Salt-Kopien liegen auf luxnix-secrets, also in einer Fehlerdomäne; das Hub-Backup
      schließt die Recovery-Kopie aus. Der stündliche Timer lx-annotate-identity-salt-migration (--apply --allow-partial)
      kann Identitäten auf eine Generation umstellen, die nur in diesem Container existiert.
    references:
    - ansible/inventory/group_vars/operator_unlocked_secrets.yml
    - modules/nixos/services/lx-annotate-local/subservices/lx-annotate-identity-salt-migration.nix
    - modules/nixos/services/lx-annotate-local/subservices/lx-annotate-identity-salts.nix
  - criterion: ENC-20
    status: not_met
    severity: review
    finding: Ein Abbruch von provision() zwischen luksFormat und Receipt bleibt dauerhaft bei never reformat stehen.
      tests/test_operator_storage_migration.py schreibt dieses Steckenbleiben als gewolltes Verhalten fest (evidence_policy).
      enroll-tpm2 prüft nicht auf einen vorhandenen Token und belegt bei jedem Aufruf einen weiteren Keyslot.
    references:
    - lx_administration/storage/operator_migration.py
    - tests/test_operator_storage_migration.py
  - criterion: ENC-19
    status: not_met
    severity: review
    finding: Recovery-Datensätze sind an /etc/machine-id gebunden, die sich bei Neuinstallation ändert.
    references:
    - lx_administration/storage/provision.py
  - criterion: ENC-01
    status: not_met
    severity: review
    finding: unlockMethod wird nur für gc-10 in host_vars gesetzt und verletzt damit das Gruppenprofil. system.boot.secureBoot
      steht einmal in group_nixos von operator_unlocked_secrets und ist Teil des Gruppenprofils, kein Verstoß.
  - criterion: ENC-09
    status: not_met
    severity: blocking
    finding: PCR 7 bindet nicht an Kernel, Initrd, Kommandozeile oder Nix-Store, und Root ist unverschlüsselt. Mit
      lokaler unbeaufsichtigter Entsperrung erhält manipulierter Code nach dem Boot den Seal-Schlüssel.
  - criterion: ENC-10
    status: not_met
    severity: review
    finding: Die lanzaboote-Signierschlüssel liegen auf luxnix-secrets, also auf dem Volume, das automatisch entsperrt
      werden soll. lanzaboote v1.2.0 signiert nur mit einem lokalen Schlüsselpaar (sbsign mit Schlüsseldatei); ein
      entfernter oder PKCS#11-Signierer existiert nicht. Damit Clients nur signierte Artefakte erhalten, braucht LuxNix
      einen zentralen Signierschritt außerhalb des Hosts, dessen Ergebnis der Install-Hook gegen db.pem prüft. Der
      Ort des Signierens ist eine offene Eigentümerentscheidung.
    references:
    - modules/nixos/system/boot/default.nix
  - criterion: ENC-21
    status: not_met
    severity: review
    finding: devenv/commands.yml enthält beim Eintrag rebuild-host-switch die hostgebundene Variante gc10_install;
      tests/test_devenv_command_catalog.py schlägt mit 2 Fehlern fehl. Der Install-Hook bricht vor dem Signieren ab,
      wenn der Schlüsselring gesperrt ist oder fehlt, und installiert nie unsignierte Images; das Firmware-Enrollment
      von Secure Boot ist aber ein manueller Schritt je Host ohne katalogisierten Befehl. Ein Abbruch vor der Aktivierung
      bei fehlendem Secure Boot ist damit nicht erfüllt.
    references:
    - devenv/commands.yml
  - criterion: ENC-22
    status: not_met
    severity: review
    finding: Für TPM-Preflight, lokale Initialisierung, Re-Seed und flottenweiten Status existieren keine katalogisierten
      Befehle.
  - criterion: ENC-03
    status: open
    severity: review
    finding: Die Provisionierungstests mocken cryptsetup vollständig (Klasse unit). Sie belegen keine erhaltenen Nutzdaten
      oder Keyslots.
    references:
    - tests/test_operator_storage_migration.py
  - criterion: ENC-25
    status: open
    severity: review
    finding: Mehrere Nix-abhängige Tests überspringen sich ohne Nix per pytest.skip. Ergebnisse müssen skipped getrennt
      ausweisen.
    references:
    - tests/test_operator_unlocked_storage.py
    - tests/test_secure_boot.py
  historical_findings_schema_1_1:
  - ENC-07 VPN-Zugangsdaten unter /etc/openvpn betrafen die zentrale Freigabe; für die lokale Entsperrung entfällt
    die Abhängigkeit, für das Hub-Enrollment bleibt sie bestehen.
  - ENC-08 zweites Shamir-Unseal auf gs-02 gilt nun nur für das zentrale OpenBao; es blockiert keinen Client-Boot.
  - ENC-15 Accessor-Widerruf und Rollenentzug wurden im VM-Test des zentralen Backends belegt und gelten für die
    Hub-Identitäten weiter.
  decisions_required:
  - topic: Seal-Mechanismus des lokalen OpenBao
    recommendation: Static Seal mit 32-Byte-Schlüssel aus systemd-creds encrypt --with-key=tpm2 und expliziter PCR-Policy;
      Ablehnung jedes nicht TPM-versiegelten Credentials. Den Seal-Schlüssel vor der ersten Initialisierung in Admin-Vault
      und Notfallexport verwahren.
    open: Unterstützung des Static Seal in 2.6.4 im VM-Test belegen; PCR-Auswahl gemeinsam mit ENC-09 festlegen.
    status: recommended_not_decided
  - topic: Unseal des zentralen OpenBao auf gs-02
    recommendation: Shamir mit Custodians beibehalten; Clients booten unabhängig. Ein TPM-Static-Seal auch für den
      Hub ist eine eigene Entscheidung.
    status: recommended_not_decided
  - topic: Dauerhaftigkeit der Machine Salts
    owner: Center identity custodian und endoreg-db maintainer
    recommendation: Innerhalb des quellenlokalen Vertrags eine zweite Fehlerdomäne nutzen, etwa eine Kopie auf luxnix-app-storage,
      das auf gc-10 auf einer anderen Platte liegt. Eine verschlüsselte Hinterlegung in der Recovery-Verwahrung ändert
      den Vertrag und braucht die Zustimmung der Eigentümer. Bis zur Entscheidung startet die automatische Salt-Migration
      nur nach geprüfter Verwahrung in zwei Fehlerdomänen.
    status: open_owner_decision
  - topic: Secure-Boot-Signierschlüssel
    recommendation: Eigene Schlüsselklasse und eigener Signiervorgang, getrennt von der Volume-Entsperrung; der private
      Schlüssel liegt nicht auf einem automatisch entsperrten Volume (ENC-10).
    status: recommended_not_decided
  - topic: Integrität von Root und Nix-Store
    recommendation: Einen nachgewiesenen Integritätspfad wählen, weil sonst ein manipuliertes, aber gebootetes System
      den Seal-Schlüssel erhält. Keylime ist eine mögliche Attestierungskomponente; für die lokale Entsperrung zählt
      vor allem eine signierte PCR-Policy über das gesamte gestartete System.
    status: recommended_not_decided
  recommendation_source: Eigentümerentscheidungen vom 2026-10-26 und Review in docs/openbao-architecture.md. OpenBao-Storage
    wurde gegen den gepinnten Quellcode v2.6.4 geprüft (docs/openbao.md); der Static Seal ist nur anhand von Zeichenketten
    im Binary vermutet.
architecture_decisions:
  authoritative_date: '2026-10-26'
  local_transport:
    decision_date: '2026-10-26'
    approved_by: repository_owner_in_chat
    decision: TCP is permitted only inside a private network namespace; local clients retain the private Unix socket.
    reason: OpenBao 2.6.4 requires a TCP listener to synthesize Raft cluster addresses; Unix-only initialization fails.
    implementation: modules/nixos/luxnix/openbao/default.nix
    verification: tests/nixtest/openbao_local_vm_test.nix
    acceptance: Local VM lane passed; hardware and fleet acceptance remain pending. No other criterion is waived.

  local_role: Verwahrung der Container-Schlüssel, unabhängiges Raft, TPM-gebundener Seal, automatische Entsperrung
    und geordnetes Sperren.
  hub_role: Maschinen- und Anwendungsidentitäten, PKI, Policies, Online-Widerruf und Auslieferung der Center-Salts
    für freigegebene gemeinsame Center; Nachfolger der entsprechenden HashiCorp-Vault-Funktionen.
  tpm_missing: Installation und Aktivierung blockieren; kein Rückfall.
  hashicorp_vault: Ablösung nach abgenommener Kompatibilität, Datenübernahme, Issuer-Wechsel, Recovery und vollständiger
    Flottenmigration.
  identity_salts: Quellenlokal gemäß secrets-management.yml. Das zentrale OpenBao zentralisiert weder Machine Salts
    noch Patienten- oder Untersuchungshashes.
  rollout_2026_10_26:
    decided_by: Repository-Eigentümer
    provisioning: Alle Hosts der Gruppe legen fehlende deklarierte Container beim nächsten Update über den katalogisierten
      Deploy-Befehl an. Der Controller verwahrt zuerst die Recovery-Passphrase in Admin-Vault und Notfallexport;
      danach legt der Host den Container an und speichert das Entsperrgeheimnis im TPM-gesiegelten lokalen OpenBao.
    gc10_adoption: gc-10 behält seine bestehenden Container. Die vorhandene Passphrase wird als Eintrag im lokalen
      OpenBao gespeichert und zusätzlich in Admin-Vault und Notfallexport verwahrt.
    gc10_consequence: Auf gc-10 sind Entsperrgeheimnis und Recovery-Passphrase damit identisch. Eine Offenlegung
      eines Eintrags trifft beide Wege. Folgeschritt nach Abnahme ist ein eigener OpenBao-Keyslot und die Rotation
      der Passphrase (ENC-20, Rotation 2).
    migration: Vorkopie im Hintergrund bei laufenden Schreibern, danach kurzer Stopp aller Schreiber, exakte Abschlusskopie,
      Prüfung, Umbenennung, Quittung, Aktivierung der Binds, Start der Schreiber.
    tpm_missing: Das Update bricht vor jeder Änderung ab; der Host bleibt im bisherigen Zustand.
    inventory_switch: Die Gruppe wird erst auf unlockMethod local-openbao umgestellt, wenn Enrollment, Provisionierung
      im Deploy-Befehl und Cutover integriert und im VM-Test belegt sind. Ein früheres Umschalten würde Hosts
      ohne initialisiertes lokales OpenBao gesperrt starten.
  adoption_dedicated_keyslot_2026_10_26:
    decided_by: Repository-Eigentümer (Chat vom 2026-10-26)
    supersedes: rollout_2026_10_26.gc10_adoption und rollout_2026_10_26.gc10_consequence
    decision: Bestehende Container erhalten bei der Übernahme sofort einen eigenen OpenBao-Keyslot mit einem zufälligen
      256-Bit-Geheimnis. Der Eintrag im lokalen OpenBao ist dieses Geheimnis, nicht die Recovery-Passphrase. Der Recovery-Keyslot
      bleibt unverändert; systemd-tpm2-Token und ihre Keyslots werden entfernt. Die vorhandene Passphrase wird vorher
      über storage-provision escrow in Admin-Vault und Notfallexport verwahrt.
    reason: Eine Offenlegung des Entsperreintrags betrifft damit nicht den Recovery-Weg; Entsperrgeheimnis und Recovery-Passphrase
      sind nie identisch.
    implementation: lx_administration/storage/openbao_enroll.py (convert-volume), lx_administration/storage/local_enrollment.py
      (adopt)
    verification: tests/nixtest/openbao_local_vm_test.nix (Klasse vm)
    acceptance: VM-Nachweis für Übernahme, Idempotenz und erhaltene Daten/UUID; Hardware- und Flottenabnahme offen.
  status: planned_not_implemented_not_deployed
implementation_choices_not_prescribed:
- Konkretes TPM-Enrollment-Werkzeug oder konkrete PCR-Nummern, sofern ENC-06 und ENC-09 erfüllt sind
- Static Seal mit TPM-versiegeltem Credential oder PKCS#11-Seal
- Single-Node-Raft oder späterer redundanter Betrieb des zentralen OpenBao
- lanzaboote als zwingender oder allein ausreichender Integritätsnachweis
- Vault Agent beziehungsweise OpenBao Agent statt eines geeigneten Reauthentisierungsdienstes
- Keylime oder ein anderes Attestierungsverfahren
