# inventory/host_vars/gc-08.yml
---
luxnix_dev_repo: "/home/admin/dev/luxnix"
template_name: "main"

host_roles:
  aglnet.client.enable: "true"
  custom_packages.dev03: "true"
  custom_packages.cuda: "true"
  custom_packages.office: "true"
  custom_packages.baseDevelopment: "true"
  endoreg-client.lxAi: "true"

host_services:
  luxnix.lxAnnotateLocal.runtime.deploymentRole: '"site_node"'

host_nixos:
  users.users.admin.extraGroups:
    - "config.luxnix.generic-settings.sensitiveServiceGroupName"

extra_secret_names:
  - "SCRT_roles_system_password_postgres_host_test_password"

host_luxnix:
  # Temporary bootstrap exception; set false after verified Vault enrollment.
  vault.client.auth.deferUntilProvisioned: "true"

  generic_settings.linux.kernelModules:
    - "intel"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
    - "btrfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
    - "btrfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "vmd"
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
  generic_settings.linux.supportedFilesystems:
    - "nfs"
    - "btrfs"

  maintenance.autoUpdates.enable: "false"
