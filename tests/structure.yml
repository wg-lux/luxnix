version: 1
tier: domain
path: tests
parent: ../structure.yml
summary: Root-scoped Python contracts, service suites and explicit Nix evaluation or VM lanes.
responsibilities:
  - Test configuration ownership, generators and administration interfaces
  - Keep independent MCP tests outside root discovery
boundaries:
  - Source checks do not prove deployment readiness
  - Nix evaluation and VM tests are separate from the fast Python lane
entrypoints:
  - name: storage-cutover
    file: test_storage_cutover.py
    purpose: Unit tests with real rsync for resumable pre-copy, verified cutover and preserved sources.
  - name: bao-migration
    file: test_bao_migration.py
    purpose: Verify absent-source reconciliation, conflict protection and interrupted writes.
  - name: bao-migration-vm
    file: nixtest/bao_migration_vm_test.nix
    purpose: Run real Vault and OpenBao TLS services for repeatable logical migration.
  - name: bao-migration-guest
    file: nixtest/bao_migration_guest.py
    purpose: Exercise the actual provisioning CLI using ephemeral guest-only secrets.
  - name: secure-boot
    file: test_secure_boot.py
    purpose: Evaluate fleet Secure Boot public-certificate and keyless-host contracts.
  - name: secure-boot-controller
    file: test_secure_boot_controller.py
    purpose: Exercise controller signing and host import with real lzbt, sbctl and sbverify.
  - name: encryption-primitives
    file: test_encryption_primitives.py
    purpose: Real dm-verity tamper and authenticated synthetic recovery tests; not hardware or full boot evidence.
  - name: openbao-local-vm
    file: nixtest/openbao_local_vm_test.nix
    purpose: Exercise real systemd TPM-only credentials and isolated local OpenBao auto-unseal.
  - name: openbao-local-guest
    file: nixtest/openbao_local_guest.py
    purpose: Initialize disposable test state and verify local API readiness without emitting secrets.
  - name: openbao-local
    file: test_openbao_local.py
    purpose: Verify TPM bootstrap policy rejection and independent local/hub service evaluation.
  - name: tpm-release
    file: test_tpm_release.py
    purpose: swtpm-backed TPM identity and mTLS release client contract.
  - name: openbao-release-vm
    file: nixtest/openbao_vm_test.nix
    purpose: Exercise the hardened OpenBao unit on LUKS with isolated file-certificate clients, authorization, revocation, audit and reseal.
  - name: openbao-release-guest
    file: nixtest/openbao_release.py
    purpose: Generate ephemeral VM-only credentials and verify HTTPS release API behavior; no TPM identity claim.
  - name: openbao
    file: test_openbao.py
    purpose: Evaluate backend isolation, encrypted mount guards and TLS configuration.
  - name: storage-recovery-escrow
    file: test_storage_provision.py
    purpose: Verify authenticated encrypted recovery copies, independent export, retries and conflict rejection.
  - name: operator-storage-migration-vm
    file: nixtest/operator_storage_migration_vm_test.nix
    purpose: Verify actual LUKS copy, mount ordering, post-mount permissions and receipt reuse after reboot.
  - name: operator-storage-migration
    file: test_operator_storage_migration.py
    purpose: Exercise startup copy integrity, existing destination conflicts, receipts and exclusive container creation.
  - name: operator-unlocked-storage
    file: test_operator_unlocked_storage.py
    purpose: Evaluate reusable storage validation, dependency gates, disabled isolation and generated site layouts.
  - name: runtime-private-credentials
    file: test_runtime_private_credentials.py
    purpose: Verify private runtime credential copies preserve source values and reject invalid inputs without replacing existing copies.
  - name: vault-tls-storage
    file: test_vault_server_tls_rotation.py
    purpose: Verify CA-preserving leaf renewal, encrypted mount dependencies, disk-swap exclusion and opt-out behavior.
  - name: vault-network-policy
    file: test_vault_network_policy.py
    purpose: Evaluate inventory-derived Vault endpoints, certificate IPs and VPN DNS pinning.
  - name: ca-trust
    file: test_ca_trust.py
    purpose: Reject distrusted roots in either PEM form and repair or check virtualenv certifi bundles.
  - name: application-port-policy
    file: lx-annotate/test_application_port_policy.py
    purpose: Evaluate the application port alias, proxy propagation and conflicting assignments.
  - name: monitoring-port-policy
    file: test_monitoring_service_contract.py
    purpose: Evaluate monitoring proxy ports against effective service listeners.
  - name: package-selection
    file: test_package_selection.py
    purpose: Evaluate package merging, deduplication, role gating and invalid selections.
  - name: vpn-source-of-truth
    file: test_aglnet_ssot.py
    purpose: Evaluate shared VPN route, DNS and domain inputs with explicit client overrides.
  - name: redis-source-of-truth
    file: test_redis_service_contract.py
    purpose: Evaluate shared Redis port propagation to the server, proxy and firewall.
  - name: identity-runtime-injection
    file: test_identity_secrets_runtime.py
    purpose: Verify retired central launcher and provisioner reject before network, execution or file access.
  - name: managed-secret-storage
    file: test_managed_secret_storage.py
    purpose: Exercise encrypted block ancestry, runtime memory, swap rejection and refresh failure.
  - name: center-identity-enrollment
    file: lx-annotate/test_identity_salt_enrollment.py
    purpose: Reject central salt options and execute Vault enrollment without salt publication or read grants.
  - name: keycloak-vault-secret
    file: lx-annotate/test_keycloak_vault_secret.py
    purpose: Verify opt-in Vault delivery of the shared Keycloak client secret and the custodian publish guard.
  - name: identity-salt-provisioning
    file: lx-annotate/test_identity_salt_provisioning.py
    purpose: Exercise atomic generation publication, rollback rejection and retained source matching salts.
  - name: encrypted-data-mount-contract
    file: lx-annotate/test_encrypted_data_mount.py
    purpose: Execute rendered mount guards against matching and mismatched encrypted-volume probes.
  - name: secret-rotation-contracts
    file: test_secret_rotation_catalog.py
    purpose: Verify catalog boundaries, gate order and missing source rejection.
  - name: pytest-config
    file: ../pyproject.toml
    purpose: Inspect pytest config ownership and interfaces.
  - name: configuration-suite
    file: run-configuration-tests.sh
    purpose: Inspect configuration suite ownership and interfaces.
  - name: autoconf-map
    file: autoconf.yml
    purpose: Inspect autoconf map ownership and interfaces.
  - name: context-contracts
    file: test_structure.py
    purpose: Inspect context contracts ownership and interfaces.
dependencies:
  internal:
    - lx_administration
    - modules
    - scripts
  external:
    - pytest
    - nixtest
    - NixOS VMs
submodules: []
contracts:
  - name: testing-nixtests
    doc: ../docs/testing-nixtests.md
  - name: README
    doc: nixtest/README.md
tests:
  directory: .
  command: python -m pytest -q tests/test_structure.py tests/test_test_layout_contract.py
