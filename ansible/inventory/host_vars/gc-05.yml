# inventory/host_vars/gc-05.yml
---
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  custom_packages.baseDevelopment: "true"
  endoreg_client.defaultCenterKey: '"rbk_stuttgart"'

host_services:
  # Host-scoped emergency release; immutable artifact identity is recorded
  # alongside the wheel under release-artifacts/lx-annotate/1.2.2/.
  luxnix.lxAnnotateLocal.runtime.wheelPath: '../../../release-artifacts/lx-annotate/1.2.2/lx_annotate-1.2.2-py3-none-any.whl'
  luxnix.lxAnnotateLocal.runtime.packageVersion: '"1.2.2"'

host_nixos:
  nix.settings.max_jobs: 1
  nix.settings.cores: 4

ansible_roles:
  - "dev_access"

extra_secret_names:
  - "SCRT_roles_system_password_postgres_host_test_password"

host_luxnix:
  # gc-05 is enrolled and must retain fail-closed Vault authentication.
  vault.client.auth.deferUntilProvisioned: "false"

  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'

  generic_settings.linux.cpuMicrocode: '"intel"'
  generic_settings.linux.kernelModules:
    - "kvm-intel"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
  generic_settings.linux.supportedFilesystems:
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []

  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.prime.enable: "true"
  generic_settings.gpu.nvidia.prime.nvidiaBusId: '"PCI:1:0:0"'
  generic_settings.gpu.nvidia.prime.onboardBusId: '"PCI:0:2:0"'
  generic_settings.gpu.nvidia.prime.onboardType: '"intel"'
  generic_settings.gpu.nvidia.driver: '"production"'
