group_roles:
  endoreg_db_central_01.enable: "true"
  endoreg_db_central_01.centralNodes:
    - "s-04"
  endoreg_db_central_01.localNodes:
    - "s-04"
    - "gs-01"
    - "gs-02"
    - "gc-05"
    - "gc-06"
    - "gc-10"
  endoreg_db_central_01.api.hostname: '"0.0.0.0"'
  endoreg_db_central_01.api.port: "8118"
  endoreg_db_central_01.api.useHttps: "false"
  endoreg_db_central_01.api.djangoAllowedHosts:
    - "s-04"
    - "s-04.local"
    - "172.16.255.14"
  endoreg_db_central_01.api.djangoDebug: "false"
  endoreg_db_central_01.api.logLevel: '"INFO"'
  endoreg_db_central_01.database.name: '"endoregDbCentral"'
  endoreg_db_central_01.database.user: '"endoregDbCentral"'
  endoreg_db_central_01.database.sslMode: '"allow"'
  endoreg_db_central_01.service.workers: "4"
  endoreg_db_central_01.service.maxRequests: "5000"
  endoreg_client.repository.branch: '"container"'
group_services:
  luxnix.redis.enable: "true"
  redis.servers.main.bind: 'lib.mkForce "172.16.255.14"'
  luxnix.lxAnnotateLocal.runtime.externalServices.redisUrl: '"redis://172.16.255.14:6380/1"'
  luxnix.lxAnnotateLocal.runtime.externalServices.postgresHost: '"172.16.255.22"'
  luxnix.lxAnnotateLocal.runtime.externalServices.postgresPort: 5432
  luxnix.lxAnnotateLocal.runtime.celeryBroker.secureTransportConfirmed: "true"
  luxnix.lxAnnotateLocal.runtime.trainingWorker.mode: '"manual"'
  luxnix.lxAnnotateLocal.hub.transferApi.enable: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireSecureTransport: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireMtls: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.clientCaFile: '"/etc/secrets/vault/lx_annotate_hub_transfer_client_ca.pem"'
group_luxnix: {}
