---
# Writes first-setup choices into one host's inventory, and nothing else.
# Run by `devenv shell boot-storage-setup first-setup`. Local files only; no host,
# secret or Vault state changes here. Regenerate and commit after this.
- name: Write first-setup choices into host inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    host_vars_file: "{{ playbook_dir }}/../inventory/host_vars/{{ target_host }}.yml"
    allowed_settings:
      - host_services/luxnix.lxAnnotateLocal.django.centerIdentitySalt
      - host_services/luxnix.lxAnnotateLocal.django.enrollLegacyDefaultSalt
      - host_roles/endoreg-client.defaultCenterKey
      - host_roles/endoreg_client.defaultCenterKey
      - host_luxnix/vault.client.auth.deferUntilProvisioned
  tasks:
    - name: Refuse an invalid host name
      ansible.builtin.assert:
        that: target_host is match('^[a-z][a-z0-9-]{0,62}$')
        fail_msg: "Invalid inventory host name"

    - name: Refuse a setting this console does not own
      ansible.builtin.assert:
        that: (item.section ~ '/' ~ item.key) in allowed_settings
        fail_msg: "Not a first-setup setting: {{ item.section }}/{{ item.key }}"
      loop: "{{ settings }}"

    - name: Read the host inventory
      ansible.builtin.slurp:
        src: "{{ host_vars_file }}"
      register: inventory_file

    - name: Refuse an inventory without the required section
      ansible.builtin.assert:
        that: >-
          (inventory_file.content | b64decode)
          is search('(?m)^' ~ item.section ~ ':[ \t]*$')
        fail_msg: "{{ target_host }} has no {{ item.section }} section"
      loop: "{{ settings }}"

    - name: Write each choice in its section
      ansible.builtin.lineinfile:
        path: "{{ host_vars_file }}"
        regexp: "^  {{ item.key | regex_escape }}:"
        insertafter: "^{{ item.section }}:"
        line: "  {{ item.key }}: {{ item.value | to_json }}"
        firstmatch: true
      loop: "{{ settings }}"

    - name: Reread the host inventory
      ansible.builtin.slurp:
        src: "{{ host_vars_file }}"
      register: written_file

    - name: Confirm the inventory still parses and holds every choice
      ansible.builtin.assert:
        that: >-
          (written_file.content | b64decode | from_yaml)[item.section][item.key]
          == item.value
        fail_msg: "{{ item.key }} was not written as intended"
      loop: "{{ settings }}"
