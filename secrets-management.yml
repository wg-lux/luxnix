# Local remediation evidence; controlled production acceptance remains outstanding.
schema_version: 1
review:
  date: '2026-09-07'
  assessor: codex-secrets-20260907
  scope: Local implementation and regression review of password storage, host bootstrap, Vault site lifecycle and receiver revocation.
  conclusion: Four specialist agents and integration review implemented local source fixes for all nine findings, including scoped enrollment delivery
    and running admin-account rotation. Production readiness remains pending explicit legacy-key migration, unique recovery provisioning, named
    custodian infrastructure and controlled end-to-end acceptance.
  limitations:
    - No live hosts contacted; no production secrets read, issued, changed, or revoked.
    - Existing staged work was preserved; findings refer to the current working tree.
    - Historic sealed-state and exposure reports were not reverified against live Vault.
    - Standalone Python tooling has no matching framework-specific skill reference.
    - Local tests cannot establish actual consumer adoption, revocation, or recovery time.
  guides:
    enrollment: docs/vault-hub-machine-enrollment.md
    passwords: docs/admin-passwords.md
    deployment: docs/deployment-guide.md
  systems:
    ansible_vault:
      purpose: Encrypted host-password storage and per-host exports.
      authority: lx_administration/models/vault
      consumer: ansible/playbooks/deploy_secrets.yml
    hashicorp_vault:
      purpose: Site AppRole authentication, PKI, and hub-transfer secret delivery.
      authority: modules/nixos/luxnix/vault/default.nix
      consumer: modules/nixos/services/lx-annotate-local/config.nix
findings:
  - id: 1
    severity: high
    title: Re-enrollment does not revoke compromised access
    evidence:
      - modules/nixos/luxnix/vault/default.nix
      - modules/nixos/luxnix/vault/default.nix
      - modules/nixos/luxnix/vault/default.nix
    disposition: Implemented scoped contain/rotate/resume tooling with durable policy denial, Secret ID and service-token accessor revocation, CAS
      node-secret replacement, protected installer bundles and reconciliation interlocks.
    owner: Vault custodian and hub operator
    baseline_impact: Old Secret IDs remain usable without expiry or use limits; issued tokens and the existing node shared secret are not replaced by
      re-enrollment.
    residual: Legacy batch tokens cannot be enumerated by accessor. Preserve containment until absence/expiry and both node consumers are verified;
      preserve containment markers during disaster recovery.
  - id: 2
    severity: high
    title: Certificate revocation is not connected to the receiver
    evidence:
      - modules/nixos/services/lx-annotate-local/config.nix
    disposition: Implemented mandatory authenticated, signature-checked CRL publication, freshness and rollback checks, Nginx reload and fail-closed
      transfer readiness gate. Real Nginx tests reject a revoked certificate and accept its replacement.
    owner: Hub reverse-proxy and Vault maintainers
    baseline_impact: The receiver configures a client CA but no ssl_crl. Revoking a certificate in Vault alone cannot be relied on to make this Nginx
      configuration reject it.
    residual: Initial trusted CRL publication is required before Nginx startup. In-flight requests may survive reload; keep trusted
      network/application containment until rejection is established.
  - id: 3
    severity: high
    title: Missing admin hashes can restore a shared fallback credential
    evidence:
      - modules/nixos/security/local-users/default.nix
      - modules/nixos/security/local-users/default.nix
      - modules/nixos/user/admin/default.nix
    disposition: Removed the shared fallback hash and reject legacy fallback settings, the retired installed hash, invalid credential files and
      credential/backend bypasses before account activation.
    owner: Host identity and recovery owner
    baseline_impact: GC defaults permit a static known recovery hash when the runtime hash is missing. Loss of a rotated hash can therefore restore
      shared recovery access. Actual affected-host options and login reachability were not evaluated.
    residual: Provision a unique protected runtime hash before installation/activation and verify independent SSH and privileged recovery. Existing
      fallback users need rotation before rollout.
  - id: 4
    severity: high
    title: Export previously hid incomplete password distribution
    evidence:
      - lx_administration/models/vault/manager.py
      - tests/models/test_vault_export.py
    disposition: Fixed locally. Build a private replacement export, fail on PSK/encryption errors and invalid or duplicate targets, serialize
      exporters, and retain prior output until publication. Publication failures restore prior output; interrupted publication leaves a recovery
      marker and blocks the next export.
    residual: Two directory renames are not crash-atomic. Bootstrap writers and Ansible readers do not participate in the export lock; operators must
      serialize them.
    baseline_impact: Previously, export removed the old output and skipped missing PSKs or failed re-encryption while returning successfully. A breach
      rotation could therefore distribute an incomplete bundle or leave hosts on old credentials unnoticed.
  - id: 5
    severity: high
    title: Rotated files do not establish rotated running accounts
    evidence:
      - ansible/playbooks/deploy_secrets.yml
      - modules/nixos/user/admin/default.nix
      - lx_administration/models/vault/admin_passwords.py
      - lx_administration/models/vault/manager.py
    disposition: 'Added single-host rotate-admin-passwords workflow: verifies the password/hash pair and retiring-password change, installs protected files,
      applies the running account hash and verifies shadow adoption. Secret transport requires private tmpfs controller staging.'
    owner: Host and database operators
    baseline_impact: sync-secrets only copies files. NixOS activation, database password changes, service reloads and session revocation are not part
      of that playbook. Generic updates previously allowed password/hash pairs to diverge.
    residual: Paired import is sequential; complete and validate any failed import before export. Session revocation, databases and application
      credentials remain consumer-specific operator actions. Controlled old-login rejection is still required.
  - id: 6
    severity: medium
    title: Secret values could be exposed through operator interfaces
    evidence:
      - scripts/update_secret.py
      - docs/vault-hub-machine-enrollment.md
      - tests/models/test_vault_rotation.py
    disposition: Fixed locally. Replace the custom-value argument with a hidden prompt that refuses echoed input; reject the old option without
      printing its value. Clear transient rotation values on success and failure and timestamp successful updates. Enable usable password character
      classes by default; the previous all-disabled CLI defaults were rejected by the password generator. Project token lookup to safe fields and
      explicitly revoke the enrollment token instead of merely unsetting its environment variable.
    residual: Previously exposed credentials require actual revocation; editing code and documentation cannot revoke them. See the historical owner
      handoff for prior AppRole exposure reports, which were not reverified in this review.
    baseline_impact: See original source-review evidence and remediation below.
  - id: 7
    severity: medium
    title: New-machine enrollment depends on unspecified operator infrastructure
    evidence:
      - docs/vault-hub-machine-enrollment.md
      - docs/vault-hub-machine-enrollment.md
      - docs/vault-owner-immediate-actions.md
    disposition: Added scoped deliver-hub-enrollment with existing inventory/SSH verification, independently pinned CA fingerprint, protected tmpfs
      staging, installer checks and matching receiver secret delivery.
    owner: Vault service owner
    baseline_impact: The guide requires an approved issuer policy and encrypted delivery channel but does not provide a concrete implementation.
      Custodian availability and unseal recovery can block both enrollment and emergency rotation.
    residual: Human issuer authentication/policy, audit destination, tested backups/unseal recovery and named on-call custodian coverage remain
      operational prerequisites; no production identity provider or policy was invented.
  - id: 8
    severity: high
    title: Certificate renewal can reuse an expired bootstrap token
    evidence:
      - modules/nixos/luxnix/vault/default.nix
      - modules/nixos/luxnix/vault/default.nix
      - modules/nixos/luxnix/vault/default.nix
      - modules/nixos/luxnix/vault/default.nix
    disposition: Certificate issuance now authenticates afresh before issuance without extending token TTLs. Added an explicit forced reissue command
      that bypasses cached certificates and offline-success paths during incident recovery.
    owner: Vault client module maintainer
    baseline_impact: AppRole tokens have a one-hour TTL and four-hour maximum, but certificate renewal runs every twelve hours. The required
      authentication unit remains active after its initial login; starting a dependent unit does not rerun it. Once certificate issuance is needed,
      the cached token can already be expired. This is a source-derived failure mode, not a reproduced live incident.
    residual: Deploy client changes and replace AppRole files before reauthentication. Forced-reissue marker survives failed attempts but resides in
      /run; repeat the command after reboot while contained.
  - id: 9
    severity: high
    title: Local encryption depends on ambient Ansible identities rather than the declared key
    evidence:
      - lx_administration/models/vault/secret.py
      - lx_administration/models/vault/secret.py
      - lx_administration/models/vault/manager.py
      - lx_administration/models/vault/manager.py
      - scripts/validate-admin-passwords.py
    disposition: Local VaultLib encryption explicitly uses the private luxnix-master key; exports use unique registered host PSKs. Added authenticated
      copy-only legacy migration, strict preflight and real isolated bootstrap/import/export/wrong-key regression tests.
    owner: Local vault tooling and recovery owner
    baseline_impact: Encryption selects only the local hostname label with --encrypt-vault-id; it does not pass Vault.key. Hostname identities are
      registered against PSKs, while validation explicitly supplies --vault-key. Success can depend on ambient Ansible configuration and loaded keys,
      so the documented master-key and restore contract is not established by the source or mocked encryption tests.
    residual: Existing legacy ciphertext requires explicit migration and recovery acceptance before replacing canonical data. Keep retiring decryption
      keys for retained backups; no live material was inspected or migrated.
operator_checklists:
  new_machine:
    - Record the explicit host, center key, hub, verified SSH identity, source revision and lock digest.
    - Add canonical inventory membership and host YAML plus the matching hub receiver node.
    - Validate Autoconf, render and review generated output, then evaluate and build site and hub.
    - Use a clean durable checkout; run vault-site-preflight for the explicit host, then check-connectivity.
    - Confirm unsealed Vault and approved short-lived issuer access before issuing material.
    - Enroll one site, deliver through the identified encrypted channel and independently pin the CA fingerprint.
    - Install the receiver secret and site bundle with the documented ownership and modes.
    - Deploy hub then site, remove the host-only deferUntilProvisioned exception and revalidate.
    - Prove service health, node/center identity, renewal beyond token expiry and a disposable end-to-end transfer.
    - Revoke the operator token, remove decrypted staging and retain restricted acceptance evidence.
  breach_response:
    - Record the incident, affected hosts and credential classes; preserve audit evidence.
    - Contain access from trusted receiver/network controls; do not rely on the compromised sender stopping itself.
    - Prevent new issuance and revoke old Secret IDs and issued tokens; keep the identity isolated during replacement.
    - Rebuild or establish trust in affected machines before delivering new credentials.
    - For host passwords, import both password and hash, validate, export, distribute and activate the consumer.
    - For node secrets, stop transfers and coordinate Vault KV, both local files and both provisioned node records.
    - Revoke certificates, publish CRLs and prove receiver rejection; retain network/application denial through consumer acceptance.
    - Terminate compromised sessions and pooled connections; verify new acceptance and old rejection separately.
    - Restore access only after acceptance; recover with another fresh credential instead of a compromised rollback value.
    - Keep encryption-key rotation separate; preserve retiring decryption keys until retained data is safely migrated.
  exercise_evidence:
    - Operator-approved target and disposable test identities; no production credential values in the record.
    - Timestamps for detection, containment, revocation, delivery, consumer adoption and old-credential rejection.
    - Test offline/unreachable host handling and partial failures without reporting success for those hosts.
    - Test one new-machine enrollment from a clean checkout and one isolated breach rotation end to end.
    - Record measured containment/recovery times and agree service objectives before describing rotation as fast.
