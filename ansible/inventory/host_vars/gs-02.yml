# inventory/host_vars/gs-02.yml
---
template_name: "main"

host_roles:
  endoreg-client.enable: "true"
host_services: {}

ansible_roles:
  - "dev_access"

host_luxnix:
  lxAnnotateLocal.database.host: '"127.0.0.1"'
  lxAnnotateLocal.database.port: "5432"
  boot_decryption_stick_gs_01.enable: "true"

  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'

  generic_settings.linux.cpuMicrocode: '"amd"'

  generic_settings.linux.kernelModules:
    - "kvm-amd"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
    - "btrfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
    - "btrfs"
    - "dm-snapshot"
  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "thunderbolt"
    - "nvme"
    - "usb_storage"
    - "usbhid"
    - "sd_mod"

  generic_settings.linux.supportedFilesystems:
    - "nfs"
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []
  lxAnnotateLocal.enable: "true"
  lxAnnotateLocal.runtime.deploymentRole: '"central_hub"'
  lxAnnotateLocal.hub.enable: "true"

  lxAnnotateLocal.hub.transferApi.enable: "true"
  lxAnnotateLocal.hub.transferApi.requireSecureTransport: "true"
  lxAnnotateLocal.hub.transferApi.requireMtls: "true"
  lxAnnotateLocal.hub.transferApi.mtlsMetaKey: '"HTTP_X_CLIENT_CERT_VERIFIED"'
  lxAnnotateLocal.hub.transferApi.mtlsMetaValue: '"SUCCESS"'
  lxAnnotateLocal.hub.transferApi.clientCaFile: '"/etc/secrets/vault/lx-annotate-transfer-client-ca.crt"'
