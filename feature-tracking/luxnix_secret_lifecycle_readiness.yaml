- id: encrypted_local_secret_persistence
  category: security
  title: All persistent secret copies remain encrypted outside an unlocked runtime boundary
  acceptance:
  - This criterion owns the host storage boundary for every secret family in secrets-management.yml, including
    Vault bootstrap/AppRole credentials, tokens, private keys, center salts, recovery replicas, local
    vault encryption keys, service environment files, temporary files, backups, swap and crash dumps.
    Record each canonical source, consumer and encrypted persistence boundary without recording secret
    values.
  - Store persistent copies as authenticated ciphertext or on a verified encrypted volume; mode 0600 alone
    is insufficient. Unwrapped runtime credentials are limited to protected memory or bounded credential
    mounts, with encrypted or disabled swap/hibernation and no plaintext persistent copies.
  - Inspect scripts/provision-identity-salts.py recovery and replica writes, managed-secrets destination
    files, Vault enrollment staging and lx-annotate-local/scripts/env.nix output. Replace or gate every
    plaintext persistent write through the owning encrypted storage mechanism, including failure paths.
  - Verify mount/encryption identity and service ordering before any secret write or consumer start; an
    absent or wrong mount must not create secrets in the underlying ordinary directory. Resolve the unlock
    bootstrap without persisting the wrapping/unlock key beside the ciphertext it protects.
  - Distinguish HashiCorp Vault barrier encryption from local Ansible Vault ciphertext and deployed consumer
    files. Prove each boundary independently; encryption in the source vault does not prove encryption
    of its exports, local key files or recovery copies.
  - Preserve established ciphertext and required legacy decryptors during migration. Validate decryption,
    integrity and independent recovery before retiring any copy or key; no plaintext, default-secret,
    permission-only or encryption-disabled compatibility path is accepted.
  required: true
  verification:
    kind: manual
    instructions: Add host and provisioner tests for absent/wrong encrypted mounts, boot ordering, interrupted
      publication, runtime credential cleanup, swap and dump exposure. Perform an offline-disk inspection
      and independent restore drill using synthetic secrets; never print live values.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/test_managed_secret_storage.py
    - kind: test
      reference: tests/lx-annotate/test_identity_salt_provisioning.py
    note: 'Shared storage verifier checks every backing-device branch for encryption, rejects active swap/symlink
      paths and allows tmpfs only for explicit runtime handling. Wired into managed secret writes, salt
      sources/recovery, Vault client credential/enrollment/certificate storage, server TLS private material
      and application environment/password copies; local vault and Ansible gates under integration. Storage
      tests: 16 passed; helper Pyright clean. Probe assumes trusted root-controlled mounts and does not
      authenticate an expected volume UUID, continuously monitor swap, or prove hibernation/crash-dump
      policy. Offline disk inspection, independent restore, full deployment inventory and controlled mount/substitution
      acceptance remain unverified; no deployment.'
    assessed_by: codex-smh-audit-20261016
    assessed_at: '2026-10-16T09:11:18.482238Z'
- id: legacy_decryption_only_compatibility
  category: requirements
  title: Compatibility preserves historical decryption and source patient reidentification
  acceptance:
  - Record explicit key identities, formats and dependent artifacts for every legacy encrypted-file generation,
    including backups and local vault exports. Only new active generations may encrypt new files; old
    keys remain restricted to authenticated historical reads and reviewed re-encryption.
  - Retired or compromised authentication credentials must not become token, signing, TLS or enrollment
    fallbacks. Reconcile the planned signing-overlap wording in secrets-management.yml and operator guides
    with this stricter requested policy before implementation; do not silently treat old signatures as
    the encrypted-file exception.
  - Historical center salts remain available to authorized source clients for patient reidentification
    from historical hashes, including after database migration. Only active salts create new identities;
    historical salts never authorize delivery or authentication. Preserve arbitrary established source
    generations and reject a newer bundle that omits their matching material.
  - Link backend reader coverage to wg-lux/endoreg-db feature-tracking/Anonymization.yml criterion legacy_key_read_only_recovery;
    do not duplicate its implementation or readiness evidence here. Rehearse credential revocation separately
    from historical-file recovery.
  required: true
  verification:
    kind: manual
    instructions: Review the coordination catalog and test old-file decryption with retired keys while
      proving revoked credentials cannot enroll, retrieve a secret, authenticate a request or create new
      ciphertext.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/lx-annotate/test_identity_salt_provisioning.py
    - kind: runbook
      reference: docs/secret-rotation.md
    note: 'User clarification implemented: historical center salts are explicitly retained at authorized
      source clients for patient reidentification after migration, separate from historical-file decryption.
      New bundle publication rejects omitted source history, rollback and equivocation; only active material
      writes new identities. Catalog/runbook reject retired authentication/signing fallbacks. Backend
      owns encrypted-file readers and identity matching evidence. Controlled revocation and historical
      restore exercise remain outstanding.'
    assessed_by: codex-smh-audit-20261016
    assessed_at: '2026-10-16T09:11:22.067640Z'
- id: center_identity_enrollment
  category: security
  title: Center-scoped identity material is provisioned once without replacing legacy generations
  acceptance:
  - Inventory host_services/group_services configure centerIdentitySalt; its scope derives from defaultCenterKey
    and must agree with receiver membership before enrollment.
  - Custodian enrollment creates one random center salt with Vault compare-and-set; machine policies grant
    only center-scoped reads and never create or update permissions for identity material.
  - The shared recovery provisioner rejects missing, unsafe or conflicting center sources without local
    random fallback or replacement of established salts and receipts.
  - Controlled rollout verifies legacy migration and hub continuity before enabling the inventory switch;
    erased identities without authenticated source evidence remain explicit blockers.
  required: true
  verification:
    kind: manual
    instructions: Run the identity provisioning/enrollment tests and rehearse a same-center two-host import,
      placement change, legacy migration and restore through the installed runtimes.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/lx-annotate/test_identity_salt_provisioning.py
    - kind: test
      reference: tests/lx-annotate/test_identity_salt_enrollment.py
    - kind: runbook
      reference: docs/center-identity-salt-activation.md
    note: '2026-10-23: fixed center enrollment end to end. Provisioner gained --source-salt/--center-id
      (CLI previously rejected the Nix flags); established machine salts are demoted to retiring readers
      via a new center generation and atomic manifest switch with center_id/generation 1 (manifest lacked
      center_id, so endoreg-db rejected DJANGO_IDENTITY_CENTER_ID). 65 identity tests passed; demoted
      keyring loaded by endoreg-db 1.6.1 configured_identity_keyring with matching center and rejected
      for another center. gc-02/05/06/09/10/gs-02 toplevel eval passes (gc-06/gc-09 deferUntilProvisioned=false
      per operator). Not deployed. Blockers: hub record pseudonyms change for records transferred before
      activation (no alias migration in endoreg-db); live two-host rehearsal, migration review and restore
      exercise outstanding.'
    assessed_by: claude-identity-salt-20261023
    assessed_at: '2026-10-23T06:36:20.568281Z'
