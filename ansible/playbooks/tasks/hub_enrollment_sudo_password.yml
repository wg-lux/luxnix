---
- name: Ask for this host's Linux sudo password
  ansible.builtin.pause:
    prompt: 'Linux sudo password for {{ ansible_user | default("admin") }} on {{ inventory_hostname }} (hidden; not a Vault token or unseal share)'
    echo: false
  register: fleet_sudo_prompt
  no_log: true

- name: Require a nonempty Linux sudo password
  ansible.builtin.assert:
    that: fleet_sudo_prompt.user_input | default('') | length > 0
    fail_msg: 'No sudo password supplied. Rerun and enter the Linux account password for the named host.'
  no_log: true

- name: Keep the password only in this host's in-memory connection variables
  ansible.builtin.set_fact:
    ansible_become_password: '{{ fleet_sudo_prompt.user_input }}'
    fleet_sudo_prompt: {}
    cacheable: false
  no_log: true
