- id: operational_rotation
  category: operations
  title: Scoped enrollment and consumer rotation are reproducible
  acceptance:
  - Named host enrollment has a concrete authenticated delivery workflow.
  - Password rotation updates the consumer and verifies rejection of the retiring credential.
  - Operator ownership, audit evidence and measured recovery time are recorded.
  required: true
  verification:
    kind: manual
    instructions: Review operator workflow and controlled deployment evidence; preserve independent recovery
      access.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: secrets-management.yml
    - kind: test
      reference: tests/test_secret_operator_workflows.py
    - kind: test
      reference: tests/test_vault_fleet_enrollment.py
    - kind: runbook
      reference: docs/vault-hub-machine-enrollment.md
    - kind: runbook
      reference: ansible/playbooks/deploy_hub_admin_access.yml
    note: 'Added token-prompt fleet enrollment with pinned SSH, tmpfs secret transport, existing-identity
      reuse, contained/revoked/conflicting credential rejection, per-site failure isolation and shared
      idempotent delivery. Verification: uv run pytest -q tests/test_vault_fleet_enrollment.py tests/test_vault_site_enrollment_preflight.py
      tests/test_vault_site_lifecycle.py tests/test_secret_operator_workflows.py: 77 passed. Real Ansible
      PTY test confirms hidden token input is absent from terminal output and log; executable comparison
      tests cover unchanged files, changed content, modes, groups, symlinks and missing files. Ansible
      syntax checks for fleet/delivery/rotation, Ruff, bash -n, git diff --check, devenv tasks run docs:check
      and nix-quality:check passed; gc-09 toplevel and hub Vault-path Nix evaluations passed. Noninteractive
      devenv command correctly exits 2 before remote operations. Read-only fleet preflight: source.clean
      is expected to fail in this development worktree; additional existing failures are gc-04 ssh.identity/nix.target_identity,
      gc-06 ssh.identity/nix.receiver_contract, gc-08 nix.target_identity. No live token used or remote
      credential changes performed; controlled fleet acceptance and bootstrap-deferral rollout remain
      outstanding. Existing rotation evidence retained. 2026-10-09: User-authorized gs-02 admin public-key
      deployment completed on gs-02 and gc-09 using the supplied local sudo-password file without exposing
      its value. Existing keys preserved; key restricted to source 172.16.255.22, forwarding/PTY disabled.
      Verified hub host pin through existing trusted SSH. Canonical inventory group and isolated-generated
      host outputs retained. Corrected gc-09 salt flag namespace discovered during generation; unrelated
      gc-05/gc-06 rendering drift not published. check-connectivity passed both hosts; deploy_hub_admin_access.yml
      --check --diff preview then apply passed (changed=2 each); follow-up --check returned changed=0
      on both. Nested gs-02 SSH to gc-09 and itself returned admin; sudo with supplied password returned
      uid 0 on both. sudo -n true still fails as expected under unchanged password policy. Nix ssh authorizedKeys
      and toplevel.drvPath evaluations passed both hosts; docs:check, nix-quality:check, Ansible syntax
      and git diff --check passed. No NixOS activation, passwordless sudo grant or Vault enrollment performed.
      2026-10-12: Added optional hidden --ask-become-pass while preserving fixed inventory scope and rejecting
      arbitrary options. Detailed gs-02 guide and implementation map added. Verification: 81 focused pytest
      tests passed; bash -n, Ruff, docs:check and Ansible syntax passed. Canonical connectivity passed
      gs-02 and gc-09. CA-verified health at the configured VPN endpoint reports initialized=true, sealed=false.
      Operator will enter the Vault token and perform enrollment; no token-driven enrollment or NixOS
      activation performed in this update. 2026-10-12 follow-up: Operator run exposed mutable block-condition
      bug: initial failed-enrollment status skipped all remaining delivery tasks. Capture fleet_site_selected
      before the block so result transitions do not disable delivery or rescue. Real Ansible regression
      coverage includes success, delivery failure and excluded hosts; 34 fleet tests passed. Live credential
      enrollment remains operator-driven and is not yet verified. 2026-10-12: Enrollment now provisions
      receiver/sender database identities and starts site application/worker before success. pytest tests/test_vault_fleet_enrollment.py
      -q: 49 passed; devenv tasks run docs:check passed. Live read-only gc-09 diagnosis: missing Vault
      AppRole and CA files, app and worker inactive. No remote mutation performed; controlled enrollment
      acceptance remains outstanding.'
    assessed_by: codex-hub-gc09-20261012
    assessed_at: '2026-10-12T15:37:28.914927Z'
