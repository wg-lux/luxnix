# inventory/host_vars/gc-10.yml
---
ansible_python_interpreter: "{{ luxnix_dev_repo }}/.devenv/state/venv/bin/python"
luxnix_dev_repo: "/home/admin/luxnix"
template_name: "main"

host_roles:
  aglnet.client.enable: "true"
  custom_packages.baseDevelopment: "true"
  endoreg-client.lxAi: "true"
  endoreg_client.defaultCenterKey: '"university_hospital_wuerzburg"'


host_services:
  luxnix.lxAiLocal.runtime.protectedDataDir: '"/var/lib/lx-annotate/data"'
  luxnix.lxAnnotateLocal.runtime.mode: '"wheel"'
  # Fail-closed outbound hub transfer. Only explicitly eligible, anonymized
  # processed media may be queued; Vault supplies every runtime credential.
  luxnix.lxAnnotateLocal.hub.outboundTransfer.enable: "true"
  luxnix.lxAnnotateLocal.hub.outboundTransfer.requireMtls: "true"
  luxnix.lxAnnotateLocal.hub.outboundTransfer.caFile: '"/etc/secrets/vault/hub-pki/vault-server-ca.pem"'
  luxnix.lxAnnotateLocal.hub.nodeProvisioning.enable: "true"
  luxnix.lxAnnotateLocal.hub.nodeProvisioning.nodes: '[ { nodeKey = "gc-10";
    displayName = "gc-10 site node"; role = "site_node";
    centerKey = "university_hospital_wuerzburg";
    sharedSecretFile = "/etc/secrets/vault/hub-pki/source-node-secret"; }
    { nodeKey = "gs-02"; displayName = "gs-02 central hub";
    role = "central_hub"; baseUrl = "https://gs-02.intern"; } ]'

host_nixos:
  # Vault must resolve through the authenticated VPN path. Public DNS caused
  # the previous fail-closed deployment timeout before any Hub API request.
  'networking.hosts."172.16.255.22"':
    - "vault.endo-reg.net"

extra_secret_names: []

host_luxnix:

  # Keep first provisioning fail-closed. Enrollment material is delivered out
  # of band and is never rendered into the Nix store or inventory.
  vault.client.allowOffline: "false"
  vault.client.address: '"https://vault.endo-reg.net:8200"'
  vault.client.caCertFile: '"/etc/secrets/vault/hub-pki/vault-server-ca.pem"'
  vault.client.auth.method: '"approle"'
  vault.client.auth.roleIdFile: '"/etc/secrets/vault/hub-pki/approle_role_id"'
  vault.client.auth.secretIdFile: '"/etc/secrets/vault/hub-pki/approle_secret_id"'
  vault.client.hubPki.enable: "true"
  vault.client.hubPki.commonName: '"gc-10.intern"'

  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'

  generic_settings.linux.cpuMicrocode: '"intel"'
  generic_settings.linux.kernelModules:
    - "kvm-intel"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
    - "thunderbolt"
    - "vmd"
  generic_settings.linux.supportedFilesystems:
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []

  # GPU Configuration (New Unified System)
  generic_settings.gpu.nvidia.enable: "true"
  generic_settings.gpu.nvidia.prime.enable: "true"
  generic_settings.gpu.nvidia.prime.nvidiaBusId: '"PCI:1:0:0"'
  generic_settings.gpu.nvidia.prime.onboardBusId: '"PCI:0:2:0"'
  generic_settings.gpu.nvidia.prime.onboardType: '"intel"'
  generic_settings.gpu.nvidia.driver: '"production"'
