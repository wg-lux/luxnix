---
# Explicit consumer rotation, separate from file-only sync-secrets.
- name: Rotate one managed admin account from its validated encrypted export
  hosts: managed
  gather_facts: false
  become: true
  become_user: root
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_become_user: root
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    rotation_hash_source: '{{ lx_vault_host_deploy_dir }}/{{ admin_password_hashed_filename }}'
    rotation_password_source: '{{ lx_vault_host_deploy_dir }}/{{ admin_password_filename }}'
  pre_tasks:
    - name: Require one explicit host and independent recovery access
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname is match('^[a-z0-9][a-z0-9-]*$')
          - admin_rotation_recovery_confirmed | default(false) | bool
        fail_msg: Confirm independent SSH key or console recovery and select exactly one host.

    - name: Read declarative admin hash path from the selected checkout
      ansible.builtin.command:
        argv:
          - nix
          - eval
          - --json
          - '.#nixosConfigurations.{{ inventory_hostname }}.config.user.admin.passwordFile'
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: rotation_configured_path

    - name: Require the configured account to be admin
      ansible.builtin.command:
        argv: [nix, eval, --raw, '.#nixosConfigurations.{{ inventory_hostname }}.config.user.admin.name']
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: rotation_configured_name

    - name: Refuse SOPS paths or noncanonical overrides
      ansible.builtin.assert:
        that:
          - rotation_configured_name.stdout == 'admin'
          - (rotation_configured_path.stdout | from_json) == (lx_vault_dir ~ '/' ~ admin_password_hashed_filename)
        fail_msg: This workflow supports the canonical vault-file admin hash only.

  tasks:
    - name: Validate and activate the prepared password without logging material
      no_log: true
      diff: false
      block:
        - name: Read current account hash through the trusted SSH channel
          ansible.builtin.command:
            argv: [getent, shadow, admin]
          changed_when: false
          register: rotation_shadow

        - name: Require the expected account record
          ansible.builtin.assert:
            that:
              - rotation_shadow.stdout.split(':') | length == 9
              - rotation_shadow.stdout.split(':')[0] == 'admin'

        - name: Snapshot the prepared pair for validation approval and activation
          ansible.builtin.set_fact:
            rotation_credential:
              password: "{{ lookup('ansible.builtin.file', rotation_password_source, rstrip=false) }}"
              replacement_hash: "{{ lookup('ansible.builtin.file', rotation_hash_source, rstrip=false) | trim }}"
              current_hash: "{{ rotation_shadow.stdout.split(':')[1] }}"
            cacheable: false

        - name: Show the validated replacement once and require terminal y or n
          confirm_admin_rotation:
            host: '{{ inventory_hostname }}'
            credential: '{{ rotation_credential }}'
          register: rotation_consent

        - name: Require explicit approval before any credential write
          ansible.builtin.assert:
            that:
              - rotation_consent.approved | default(false) | bool

        - name: Persist the approved files for subsequent NixOS activation
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '{{ lx_vault_dir }}/{{ item.name }}'
            owner: root
            group: root
            mode: '0600'
          loop:
            - name: '{{ admin_password_filename }}'
              content: '{{ rotation_credential.password }}'
            - name: '{{ admin_password_hashed_filename }}'
              content: '{{ rotation_credential.replacement_hash }}'

        - name: Apply the replacement to the running account
          ansible.builtin.user:
            name: admin
            password: '{{ rotation_credential.replacement_hash }}'
            update_password: always

        - name: Read back the running account hash
          ansible.builtin.command:
            argv: [getent, shadow, admin]
          changed_when: false
          register: rotation_after

        - name: Verify that the live consumer adopted the prepared hash
          ansible.builtin.assert:
            that:
              - rotation_after.stdout.split(':')[1] == rotation_credential.replacement_hash

    - name: Record credential adoption without claiming session revocation
      ansible.builtin.debug:
        msg: Admin hash adopted. Revoke existing sessions through independent console or root access; password changes do not terminate them.
