---
# Run before secret-bearing copy/slurp/command tasks. The guard itself is public.
- name: Require protected controller staging from the secret wrapper
  ansible.builtin.assert:
    that:
      - lookup('env', 'ANSIBLE_LOCAL_TEMP') | length > 0
    fail_msg: Use the documented secret-playbook wrapper for protected staging.

- name: Verify controller secret sources and plaintext staging
  ansible.builtin.command:
    argv: '{{ ["python3", playbook_dir ~ "/../../lx_administration/secret_storage.py", "--allow-runtime", lookup("env", "ANSIBLE_LOCAL_TEMP")] + (secret_controller_paths | default([])) }}'
  delegate_to: localhost
  become: false
  changed_when: false

- name: Resolve the remote transport user home without gathering sensitive facts
  ansible.builtin.shell: 'printf "%s" "$HOME"'
  become: false
  changed_when: false
  register: secret_transport_home

- name: Verify remote secret destinations and Ansible plaintext staging
  ansible.builtin.script:
    cmd: >-
      {{ (playbook_dir ~ '/../../lx_administration/secret_storage.py') | quote }}
      --allow-runtime
      {{ (ansible_remote_tmp | default(secret_transport_home.stdout ~ '/.ansible/tmp')) | quote }}
      {{ secret_remote_paths | map('quote') | join(' ') }}
    executable: python3
  changed_when: false
