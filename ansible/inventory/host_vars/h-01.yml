# inventory/host_vars/h-01.yml
---
# Pre-VPN: reach h-01 via static public IP using the Hetzner RSA bootstrap key.
# The ansible_ssh_private_key_file below inherits from group_vars/hetzner_server.yml.
#
# After Phase 1 (VPN up), switch to:
#   ansible_host: 172.16.255.1
#   ansible_ssh_private_key_file: ~/.ssh/id_ed25519
ansible_host: 178.104.136.182
ansible_user: admin
# h-01 is a Hetzner cloud VM — the repo is not cloned there, so the global devenv
# python interpreter path doesn't exist. Use the system Python instead.
ansible_python_interpreter: /run/current-system/sw/bin/python3

template_name: "main"

host_roles:
  aglnet.client.enable: "lib.mkForce false"
  aglnet.host.enable: "true"
  keycloakHost.enable: "true"
  nginxHost.enable: "true"
  nginxHost.keycloak.enable: "true"
  postgres.main.enable: "true"

host_services: {}
host_luxnix:
  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'
  generic_settings.linux.cpuMicrocode: '"amd"'
  generic_settings.linux.kernelModules:
    - "kvm-amd"
  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
  generic_settings.linux.initrd.kernelModules:
    - "nfs"
  generic_settings.linux.initrd.availableKernelModules:
    - "virtio_pci"
    - "virtio_scsi"
    - "xhci_pci"
    - "uas"
    - "ahci"
    - "usbhid"
    - "nvme"
    - "usb_storage"
    - "sd_mod"
    - "sr_mod"
    - "ext4"
  generic_settings.linux.supportedFilesystems:
    - "btrfs"
  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []
  # h-01 is the OpenVPN server; tun0 gets 172.16.255.1 (standard subnet topology)
  generic_settings.vpnIp: '"172.16.255.1"'
