# inventory/host_vars/gs-02.yml
---
template_name: "main"

host_roles:
  endoreg-client.enable: "true"
  nginxHost.enable: "true"
  nginxHost.glm52.enable: "true"
  nginxHost.glm52.acme.email: '"hild@coloreg.de"'
  nginxHost.keycloak.enable: "false"
  nginxHost.nextcloud.enable: "false"

host_services:
  # Ollama service
  luxnix.ollama.enable: "true"
  luxnix.ollama.acceleration: '"cuda"'
  luxnix.ollama.enableModelBootstrap: "false"

  luxnix.lxAnnotateLocal.database.port: "5432"
  luxnix.lxAnnotateLocal.runtime.externalServices.postgresHost: '"127.0.0.1"'
  luxnix.lxAnnotateLocal.runtime.externalServices.postgresPort: "5432"

  # Raw Nix list expression.
  # A normal YAML list currently generates invalid Nix single quotes.
  # luxnix.ollama.models: '[ "gemma4:e2b" ]'
  # ollama.host: '"0.0.0.0"'

  # GLM service
  luxnix.glm52.enable: "true"
  luxnix.glm52.gpuLayers: "999"
  luxnix.glm52.host: '"0.0.0.0"'
  luxnix.glm52.port: "8088"
  luxnix.glm52.quant: '"UD-IQ2_M"'

  # LX-Annotate receiver application
  luxnix.lxAnnotateLocal.enable: "true"
  luxnix.lxAnnotateLocal.runtime.deploymentRole: '"central_hub"'
  luxnix.lxAnnotateLocal.hub.enable: "true"
  luxnix.lxAnnotateLocal.hub.backup.enable: "true"

  # Use PostgreSQL running locally on gs-02.
  # Secure hub-transfer receiver through Nginx and mTLS
  luxnix.lxAnnotateLocal.hub.transferApi.enable: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireSecureTransport: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.requireMtls: "true"
  luxnix.lxAnnotateLocal.hub.transferApi.mtlsMetaKey: '"HTTP_X_CLIENT_CERT_VERIFIED"'
  luxnix.lxAnnotateLocal.hub.transferApi.mtlsMetaValue: '"SUCCESS"'
  luxnix.lxAnnotateLocal.hub.transferApi.clientCaFile: '"/var/lib/lx-annotate/hub-pki/client-ca.pem"'

  # Provision the receiver-side node ledger from the separately delivered
  # request secret. The plaintext secret is hashed by the application model.
  luxnix.lxAnnotateLocal.hub.nodeProvisioning.enable: "true"
  luxnix.lxAnnotateLocal.hub.nodeProvisioning.nodes: '[ { nodeKey = "gc-02";
    displayName = "gc-02 site node"; role = "site_node";
    centerKey = "university_hospital_wuerzburg";
    sharedSecretFile = "/etc/secrets/vault/hub-pki/gc-02-source-node-secret"; }
    { nodeKey = "gc-10"; displayName = "gc-10 site node";
    role = "site_node"; centerKey = "university_hospital_wuerzburg";
    sharedSecretFile = "/etc/secrets/vault/hub-pki/gc-10-source-node-secret"; }
    { nodeKey = "gs-02"; displayName = "gs-02 central hub";
    role = "central_hub"; baseUrl = "https://gs-02.intern"; } ]'

  # Explicit Django central-node setting
  'luxnix.lxAnnotateLocal.django.extraSettings."IS_CENTRAL_NODE"': "lib.mkForce true"

ansible_roles:
  - "dev_access"
  - "nginx_host"

host_luxnix:
  # Keep system upgrades manual on this host.
  maintenance.autoUpdates.enable: "false"

  # Production Vault server for the transfer PKI. Initialization and unseal
  # remain an explicit offline-custodian ceremony.
  vault.server.enable: "true"
  vault.server.bindAddress: '"172.16.255.22:8200"'
  vault.server.apiAddress: '"https://vault.endo-reg.net:8200"'
  vault.server.clusterAddress: '"https://gs-02.intern:8201"'
  vault.server.tlsCertFile: '"/var/lib/lx-annotate-ssl/lx-annotate-selfsigned.crt"'
  vault.server.tlsKeyFile: '"/var/lib/lx-annotate-ssl/lx-annotate-selfsigned.key"'
  vault.server.caCertFile: '"/var/lib/lx-annotate-ssl/lx-annotate-selfsigned.crt"'
  vault.server.hubPki.enable: "true"
  vault.server.hubPki.caCertificateFile: '"/var/lib/lx-annotate/hub-pki/client-ca.pem"'

  boot_decryption_stick_gs_01.enable: "true"

  generic_settings.hostPlatform: '"x86_64-linux"'
  generic_settings.systemStateVersion: '"23.11"'
  generic_settings.linux.cpuMicrocode: '"amd"'

  generic_settings.linux.kernelModules:
    - "kvm-amd"

  generic_settings.linux.initrd.supportedFilesystems:
    - "nfs"
    - "btrfs"

  generic_settings.linux.initrd.kernelModules:
    - "nfs"
    - "btrfs"
    - "dm-snapshot"

  generic_settings.linux.initrd.availableKernelModules:
    - "xhci_pci"
    - "ahci"
    - "thunderbolt"
    - "nvme"
    - "usb_storage"
    - "usbhid"
    - "sd_mod"

  generic_settings.linux.supportedFilesystems:
    - "nfs"
    - "btrfs"

  generic_settings.linux.resumeDevice: '"/dev/disk/by-label/nixos"'
  generic_settings.linux.kernelParams: []
  generic_settings.linux.kernelModulesBlacklist: []

host_nixos:
  networking.firewall.interfaces.tun0.allowedTCPPorts: "lib.mkAfter [ 11434 8088 8200 ]"
